<!DOCTYPE html>
<html lang="th">
<head>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>เกมอิสรภาพทางการเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Storybook countryside: warm paper, sky and meadow, sun-gold accents, dirt-path roads (single light world) */
  --bg:#f7f1e1; --surface:#fffdf6; --surface2:#f4ecd8; --ink:#3f3a2c; --muted:#837b66; --line:#e5d9bb;
  --accent:#5f9e57; --accent-ink:#ffffff; --gold:#e3a63a; --bad:#d0644d; --good:#4e8f45;
  --capital:#eaf1fb; --road:#a48f6a; --sky:#cfe9f5; --meadow:#a9d18e;
  --display:"Mali", "IBM Plex Sans Thai Looped", system-ui, sans-serif;
  --body:"IBM Plex Sans Thai Looped", "Mali", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font-family:var(--body);font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
select,input{font-family:var(--body);font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px}
header .round{color:var(--muted);font-size:13px}
header .sp{flex:1}
.layout{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 16px 40px;max-width:1280px;margin:0 auto}
@media (min-width:1020px){.layout{grid-template-columns:minmax(560px,760px) 1fr;align-items:start}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Board */
.board{display:grid;--sep:clamp(6px,1.6vw,12px);grid-template-columns:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr);gap:2px;aspect-ratio:1;width:100%;max-width:760px;margin:0 auto}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;padding:1px 2px;display:flex;flex-direction:column;font-size:clamp(6.5px,1.45vw,10px);line-height:1.1;cursor:pointer;min-width:0}
.cell .stripe{height:4px;margin:-1px -2px 1px;flex:none}
.cell .lbl{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.cell .sub{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.corner{background:var(--surface2)}
.cell.inner{background:var(--capital)}
.cell.road{background:var(--road);color:#f2f2f2}
.cell.road .sub{color:#d6d6d6}
.cell .own{position:absolute;left:0;right:0;bottom:0;height:4px}
.cell .lv{position:absolute;right:2px;top:7px;font-size:.9em;color:var(--gold);font-weight:700}
.cell .toks{position:absolute;left:2px;bottom:6px;display:flex;flex-wrap:wrap;gap:1px;max-width:100%}
.tok{width:clamp(7px,1.8vw,11px);height:clamp(7px,1.8vw,11px);border-radius:50%;border:1.5px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cell.here{outline:2px solid var(--accent);outline-offset:-2px}
.center{grid-column:4/11;grid-row:4/11;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(6px,1.6vw,14px);display:flex;flex-direction:column;gap:clamp(4px,1.2vw,10px);justify-content:safe center;align-items:center;text-align:center;overflow:auto}
.center .who{font-family:var(--display);font-size:clamp(14px,3.4vw,20px);font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center}
.center .job{color:var(--muted);font-size:clamp(11px,2.4vw,13px)}
.dice{display:flex;gap:6px}
.die{width:clamp(26px,6vw,38px);height:clamp(26px,6vw,38px);border-radius:7px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(14px,3.4vw,20px)}
.prompt{font-size:clamp(11px,2.4vw,13px);color:var(--muted);max-width:30ch}
.piles{display:flex;gap:clamp(4px,1.2vw,8px);width:100%;justify-content:center}
.pile{flex:1;max-width:120px;border-radius:9px;border:1px solid var(--line);padding:clamp(5px,1.4vw,10px) 4px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:clamp(10px,2.3vw,13px);font-weight:600}
.pile small{font-weight:400;color:var(--muted);font-size:.85em}
.pile.life{border-top:4px solid #c96a2b}
.pile.learn{border-top:4px solid #2f7fb5}
.pile.opp{border-top:4px solid var(--gold)}
.pile.netp{border-top:4px solid #2a9d8f}
.modal.k-mkt{border-top:6px solid #7a5cc2}
.mkbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.mkbox h4{margin:0;font-size:13px;font-family:var(--display)}
.mkrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.mkrow select{flex:1;min-width:0;font-size:13px}
.modal.k-netc{border-top:6px solid #2a9d8f}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* Side */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;align-items:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left}
.pc.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc.view{background:var(--surface2)}
.pc .nm{display:flex;align-items:center;gap:6px;font-weight:600}
.pc .nm .tag{font-size:11px;color:var(--muted);font-weight:400}
.pc .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{font-size:1em;margin-left:2px}
.jl{font-size:10px;font-weight:600;color:#fff;background:var(--bad);border-radius:999px;padding:1px 6px;white-space:nowrap}
.pc .chev{margin-left:auto;color:var(--muted);font-size:12px}
.pc .pctx{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.pc.mini{padding:6px 10px;gap:4px}
.pc.mini .pctx+.chev{margin-left:4px}
.pc.mini .bar{height:5px}
.netlock{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.netlock h3{font-size:16px}
.layout>section{min-width:0}
.skp{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface)}
.skp.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.2)}
.skchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.skc{display:inline-flex;flex-direction:column;border-radius:10px;padding:4px 9px;font-size:12px;border:1.5px solid}
.skc small{font-size:11px;opacity:.8}
.skc.ps{background:#eef6e6;border-color:#cfe3bf;color:#36612d}
.skc.ac{background:#fff1d6;border-color:#f0cf87;color:#7a5200}
.ft .tok,.skp .tok{width:12px;height:12px}
.ft td:last-child{white-space:nowrap}
.skc.mini{display:inline-block;padding:1px 8px;font-size:11px}
.fin{display:flex;flex-direction:column;gap:12px;container-type:inline-size}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.fhead .meters{flex:0 1 300px}
#endbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,250,240,.96);border-top:2px solid #f0c9a6;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#endbar[hidden]{display:none}
.ebi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
#ebtxt{flex:1;font-size:13px;line-height:1.3}
#endbar .endbtn{width:auto;flex:none;margin:0;min-width:170px;min-height:52px}
body.hasend{padding-bottom:80px}
.endbtn{display:block;width:100%;max-width:260px;margin:6px auto;padding:10px 16px;font-size:17px;font-weight:800;border-radius:16px;background:linear-gradient(180deg,#ff9f5a,#e8692a);color:#fff;border:2px solid #c4521c;box-shadow:0 4px 0 #a8461a;letter-spacing:.3px}
.endbtn:hover:not(:disabled){filter:brightness(1.05)}.endbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #a8461a}
.tline{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.endbtn.mini{display:inline-block;width:auto;margin:0;padding:6px 14px;font-size:14px;box-shadow:0 2px 0 #a8461a}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 12px}.hero-logo{font-size:64px;animation:heroIn .9s cubic-bezier(.2,1.6,.4,1) both}.hero-t{font-family:var(--display);font-size:22px;font-weight:800;color:#be1e2d}@keyframes heroIn{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}

.tok.pic{background-image:var(--img,radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%))!important;background-size:cover;background-position:center;border:2px solid var(--pc,#fff)!important;width:clamp(13px,3.4vw,20px);height:clamp(13px,3.4vw,20px)}
.cell .tok.pic{box-shadow:0 0 0 1px #fff,0 2px 3px rgba(0,0,0,.35)}
.cell .tok.pic.cur{box-shadow:0 0 0 2px #ffb627,0 3px 5px rgba(0,0,0,.35)}
.tok.pic.big{width:30px;height:30px;border-width:3px!important}
.cell .zimg{position:absolute;right:-6%;bottom:-6%;width:72%;opacity:.55;pointer-events:none}
.cell.zoned .lbl{position:relative;z-index:1;text-shadow:0 0 3px #fffdf6,0 0 3px #fffdf6}
.cellpic{display:block;width:150px;margin:-4px auto 6px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.pimg{width:100%;max-width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.2);margin-bottom:3px}
.pile{padding-top:6px!important}
.pawn{height:64px;vertical-align:bottom}.pawn.sm{height:40px;margin-right:4px;vertical-align:middle}
.center{background:linear-gradient(rgba(255,252,242,.7),rgba(255,252,242,.82)),url(img/center.webp) center/cover!important}
.center::before{display:none}
.posefig{position:absolute;right:8px;top:4px;height:112px;z-index:12;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:poseIn .5s cubic-bezier(.2,1.6,.4,1) .35s both}.modal.haspose .mh{padding-right:88px;min-height:118px}.npcwrap{position:absolute;right:4px;top:2px;width:86px;z-index:12;pointer-events:none}.npcwrap .posefig{position:static;display:block;margin:0 auto;height:108px}.npcname{display:block;text-align:center;font-size:8.5px;font-weight:700;color:#fff;background:#be1e2d;border-radius:6px;padding:1px 3px;margin-top:-4px;white-space:nowrap}@keyframes poseIn{0%{transform:translateY(30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.pile.deck{background:none!important;border:none!important;box-shadow:none!important;padding:0 6px 8px 0!important;position:relative;flex:0 1 70px;max-width:70px;display:block}
.pile.deck .pimg{position:relative;z-index:3;display:block;width:100%;max-width:none;aspect-ratio:2/3;object-fit:cover;border-radius:7px;margin:0;box-shadow:0 1px 0 rgba(255,255,255,.8),0 3px 6px rgba(0,0,0,.28);transition:transform .2s}
.pile.deck::before,.pile.deck::after{content:'';position:absolute;left:0;top:0;right:6px;bottom:8px;border-radius:7px;background:var(--bk) center/cover;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.pile.deck::before{z-index:1;transform:translate(6px,7px) rotate(3deg);filter:brightness(.8)}
.pile.deck::after{z-index:2;transform:translate(3px,3.5px) rotate(1.5deg);filter:brightness(.9)}
.pile.deck:not(:disabled):hover{transform:none}.pile.deck:not(:disabled):hover .pimg{transform:translateY(-6px) rotate(-2deg)}
.pile.deck:not(:disabled):active .pimg{transform:translateY(2px) scale(.97)}
.pile.deck:disabled{opacity:.55}
.modal.k-pick{max-width:340px}
.pickwrap{display:flex;justify-content:center;perspective:900px}
.pickcard{width:calc(min(62vw,230px,38dvh) / var(--tz,1));aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 0 3px #fff;animation:pickZoom .45s cubic-bezier(.2,1.4,.4,1) both,pickFloat 2.4s ease-in-out .45s infinite}
@keyframes pickZoom{0%{transform:translateY(120px) scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pickFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.8deg)}}
.mf button.hire{background:#fff4d6;border-color:#e9b949;color:#7a5200;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0}
div.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;padding:6px 9px 5px;border-radius:14px;background:#fff;border:2px solid #eadfc4;box-shadow:0 2px 0 #eadfc4;line-height:1.15}
.chip .ci{font-size:22px}.chip .cv{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}.chip .cs{font-size:10.5px;color:#8a8170;white-space:nowrap}
.chip.gain .cv{color:#1f9d55}.chip.gain2 .cv{color:#2a7fb8}.chip.cost .cv{color:#d64545}.chip.use .cv{color:#c2410c}.chip.ok .cv{color:#1f9d55}
.chip.tag{background:#f6f0ff;border-color:#d9c8f5;box-shadow:0 2px 0 #d9c8f5}.chip.tag .cv{font-size:13px}
.chip.bad{border-color:#e05555;background:#fff0f0;box-shadow:0 2px 0 #e05555;animation:chipShake .5s .7s 2}.chip.bad .cv,.chip.bad .cs{color:#c62828;font-weight:700}
.chip.warn{border-color:#e9b949;background:#fff8e6;box-shadow:0 2px 0 #e9b949}.chip.warn .cv{color:#d64545}.chip.warn .cs{color:#8a5a00;font-weight:700}
@keyframes chipShake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.zchip{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:#7a6f5c;margin-top:2px}.zchip img{height:28px}
.paynet{text-align:center;font-family:var(--display);font-weight:800;font-size:24px;margin:2px 0}.paynet.up{color:#1f9d55}.paynet.down{color:#d64545}.cashflow{text-align:center;font-size:15px;margin:4px 0 2px}
.pdt td{padding:4px 6px}.pdt td:first-child{white-space:nowrap;vertical-align:top}.pdt{margin-bottom:8px}
.stp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stc{background:#fff;border:2px solid var(--c);border-radius:14px;padding:8px 9px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.sth{display:flex;align-items:center;gap:5px}
.sti{font-size:20px;line-height:1}
.stn{font-weight:700;font-size:13px;color:var(--c);flex:1;white-space:nowrap;min-width:0}
.stc{min-width:0}
.stv{font-size:22px;font-weight:800;color:var(--c);line-height:1}.stv small{font-size:11px;color:#8a8a8a;font-weight:600}
.stpips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:7px 0 5px}
.stpips i{height:10px;border-radius:3px;background:#ececec}.stpips i.on{background:var(--c)}
.sthint{font-size:10.5px;color:#7a7a7a;line-height:1.3}
@media(max-width:440px){.sti{font-size:16px}.stv{font-size:19px}.stn{font-size:12px}.stc{padding:7px}}@media(max-width:360px){.sthint{display:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:linear-gradient(180deg,#fff8e4,#f6edd5);border:1.5px solid #efe0b6;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:20px}
.tile b small{font-size:13px;color:var(--muted);font-weight:500}
.tile.wide{grid-column:1/-1}
.tile em{font-style:normal}
.tile small{font-size:12px}
@container (min-width:720px){.tiles{grid-template-columns:1fr 1fr 2fr}.tile.wide{grid-column:auto}}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
@container (min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
.fcard{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface)}
.fcard h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft td{padding:5px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
.ft td.r{text-align:right;white-space:nowrap;padding-left:8px}
.ft tr.gh td{font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:none;padding-top:8px;letter-spacing:.02em}
.ft tr.th td{font-size:11.5px;color:var(--muted);border-bottom:1.5px solid var(--line)}
.ft tr.tot td{font-weight:700;border-bottom:none;border-top:1.5px solid var(--line)}
.ft .fsub{font-size:11.5px;color:var(--muted)}
.ft .lvs{color:var(--gold);font-size:11px}
.ft.at td:last-child{width:1%}
.tw{overflow-x:auto}
.nowrap{white-space:nowrap}

.mapbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 6px;max-width:760px;gap:8px}
.layout.mapmin{grid-template-columns:minmax(170px,260px) minmax(0,1fr)!important;align-items:start}
.layout.mapmin>section:first-child{position:sticky;top:8px}
.layout.mapmin .mbar{gap:8px}
.minib{display:grid;grid-template-columns:repeat(1,1fr) 4px repeat(9,1fr) 4px 1fr;grid-template-rows:repeat(1,1fr) 4px repeat(9,1fr) 4px 1fr;gap:2px;aspect-ratio:1;width:100%;padding:4px;margin-bottom:8px;border-radius:12px;background:conic-gradient(from -45deg,#8cc263 0 90deg,#9aa0b5 90deg 180deg,#5ec0cf 180deg 270deg,#f0ad5e 270deg 360deg);box-shadow:0 2px 0 var(--line)}
.minib .mcity{grid-row:3/12;grid-column:3/12;border-radius:6px;background:#dbe5f3;box-shadow:0 0 0 1.5px #fff;z-index:0}
.minib .mc{z-index:1;border:1.5px solid rgba(60,50,30,.55);border-radius:3px;box-shadow:none}
.minib .mc.me{border-color:#e3a63a}
@media (max-width:560px){.minib{gap:1px;padding:3px}.minib .mc{border-width:1px;border-radius:1px}.mc .md{width:4px;height:4px;border-width:0}.mc .md.cur{width:5px;height:5px}}
.mc{border-radius:2px;position:relative;cursor:pointer;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;min-width:0;min-height:0}
.mc.me{outline:2px solid #e3a63a;outline-offset:0;z-index:2}
.mc .mo{position:absolute;left:0;right:0;bottom:0;height:2px}
.mc .md{width:5px;height:5px;border-radius:50%;border:1px solid #fff;display:block}
.mc .md.cur{width:8px;height:8px;box-shadow:0 0 0 1.5px #e3a63a}
.layout.mapmin .mrow.mact{flex-direction:column;align-items:stretch;gap:4px}
.layout.mapmin .mrow:not(.mact){flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 8px}

.logo{display:inline-block;width:1em;height:1em;background:var(--lc,var(--brand));-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
header h1::before{content:"";width:26px;height:26px;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
h1,h2,h3,.center .who,.die,.goal .big,.pile,.tabs button,header button,.btnrow button{font-family:var(--display)}
button{border-radius:999px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .12s, box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 0 var(--line);border-color:var(--accent)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
button.pri{background:linear-gradient(180deg,#77b56d,#5a9851);border-color:#4f8a47;box-shadow:0 3px 0 #3f7239;color:#fff}
button.pri:hover:not(:disabled){box-shadow:0 4px 0 #3f7239}
select,input,textarea{border-radius:12px;border:2px solid var(--line)}
/* board as a meadow island */
.board{background:conic-gradient(from -45deg,#8cc263 0 90deg,#9aa0b5 90deg 180deg,#5ec0cf 180deg 270deg,#f0ad5e 270deg 360deg);padding:8px;border-radius:22px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 8px 24px rgba(92,120,60,.25);gap:3px}
.cell{border-radius:9px;border:1.5px solid rgba(120,100,60,.18);box-shadow:0 2px 0 rgba(120,100,60,.18);background:var(--surface)}
.cell.corner{background:linear-gradient(180deg,#fff7df,#fbeec8)}
.cell.inner{background:linear-gradient(180deg,#f3f7ff,#e3ecfb)}
.cell.road{background:repeating-linear-gradient(90deg,#b49d74 0 8px,#a8916a 8px 16px);color:#fffaf0;border-color:#8f7a55}
.cell .stripe{height:5px;border-radius:0 0 6px 6px;margin:-1px 2px 2px}
.cell.here{outline:3px solid #f2b13b;outline-offset:-2px;box-shadow:0 0 0 3px rgba(242,177,59,.25)}
.cell .own{height:5px;border-radius:4px 4px 0 0;left:3px;right:3px}
.center{background:radial-gradient(120% 80% at 50% 0%,#fffef8,#fbf3de);border:2px solid #f0e2bd;border-radius:20px;box-shadow:0 4px 0 rgba(150,120,60,.15)}
.tok{border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.die{background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line)}
.pile{border-radius:16px;border-width:2px;background:var(--surface);box-shadow:0 3px 0 var(--line)}
.pile.life{border-top-width:6px}.pile.learn{border-top-width:6px}.pile.opp{border-top-width:6px}.pile.netp{border-top-width:6px}
.pc{border-radius:16px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);background:var(--surface)}
.pc.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.25),0 2px 0 var(--line)}
.bar{border-radius:999px;border-width:1.5px;background:#f1e8d2}
.bar i{background:linear-gradient(90deg,#8ccf7e,#5f9e57);border-radius:999px}
.bar.win i{background:linear-gradient(90deg,#ffd36b,#e3a63a)}
.tabs{border-bottom:2px dashed var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:none}
@media (max-width:480px){.tabs button{padding:7px 10px;font-size:12.5px}header h1{font-size:18px}}
.tabs button{border-radius:14px 14px 0 0;box-shadow:none}
.tabs button.on{border:2px solid var(--line);border-bottom-color:var(--surface)}
.panel{border:2px solid var(--line);border-top:none;border-radius:0 0 18px 18px}
.goal{background:linear-gradient(180deg,#fff8e4,#f6edd5);border:1.5px solid #efe0b6;border-radius:16px}
.chip{background:#eef6e6;border-color:#cfe3bf;color:#3f6b36}
.modal{border-radius:22px;border:2px solid var(--line);background:radial-gradient(140% 70% at 50% 0%,#fffef9,#fbf4e2);box-shadow:0 18px 50px rgba(70,60,30,.28)}
.modal .mf{border-top:2px dashed var(--line)}
.ov{background:rgba(70,90,70,.35);backdrop-filter:blur(2px)}
.setup{border-radius:22px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.legend{color:#5b5444}
.legend i{border-radius:50%}
.toast{background:#4a6b3c;color:#fffdf0;box-shadow:0 4px 0 #36502c}
.jl{background:var(--bad)}
.timer.low{color:var(--bad)}
.dbrow{background:var(--surface)}
.dblist,.dbform,.dbt{border-radius:16px;border-width:2px}
.setov{background:linear-gradient(180deg,var(--sky),var(--bg) 300px)}
.setov .sh{background:rgba(255,253,246,.9);border-bottom:2px dashed var(--line)}
.cityplate{grid-row:3/12;grid-column:3/12;margin:-5px;border-radius:16px;background:linear-gradient(160deg,#d9e4f2,#c5d4ea);box-shadow:0 0 0 3px #fffdf6,0 0 0 6px #8fa9cc,0 6px 16px rgba(60,80,120,.25);z-index:0;position:relative}
.cityplate span{position:absolute;left:22%;top:-1px;transform:translate(-50%,-50%);background:#8fa9cc;color:#fff;font-family:var(--display);font-size:clamp(8px,1.6vw,11px);padding:1px 10px;border-radius:999px;white-space:nowrap}
.cell{position:relative;z-index:1}
.board::after{content:"ต่างจังหวัด";grid-row:1;grid-column:1;display:none}
.cell.zoned{background:color-mix(in srgb,var(--zc) 30%,#fffdf6);border-color:color-mix(in srgb,var(--zc) 55%,#e5d9bb)}
.cell.zoned .sub{color:color-mix(in srgb,var(--zc) 35%,#5d5646)}
.cell.zoned .stripe{background:var(--zc)!important;opacity:1!important}
/* concrete two-lane roads */
.cell.road{background-color:#9da3a8;background-image:none;border-color:#7d8388;color:#fff}
.cell.road.v{background-image:linear-gradient(90deg,transparent 7%,#f5f5f0 7%,#f5f5f0 10%,transparent 10%,transparent 90%,#f5f5f0 90%,#f5f5f0 93%,transparent 93%),repeating-linear-gradient(180deg,#ffd75a 0 7px,transparent 7px 13px);background-size:100% 100%,3px 100%;background-position:0 0,50% 0;background-repeat:no-repeat}
.cell.road.h{background-image:linear-gradient(180deg,transparent 7%,#f5f5f0 7%,#f5f5f0 10%,transparent 10%,transparent 90%,#f5f5f0 90%,#f5f5f0 93%,transparent 93%),repeating-linear-gradient(90deg,#ffd75a 0 7px,transparent 7px 13px);background-size:100% 100%,100% 3px;background-position:0 0,0 50%;background-repeat:no-repeat}
.cell.road .lbl,.cell.road .sub{background:rgba(80,86,92,.75);border-radius:4px;padding:0 2px;align-self:flex-start;color:#fff}
.cell.road .stripe{display:none}
.bridge{background:#9da3a8;z-index:1;position:relative}
.bridge.v{margin:0 18%;background-image:repeating-linear-gradient(180deg,#ffd75a 0 4px,transparent 4px 7px);background-size:3px 100%;background-position:50% 0;background-repeat:no-repeat}
.bridge.h{margin:18% 0;background-image:repeating-linear-gradient(90deg,#ffd75a 0 4px,transparent 4px 7px);background-size:100% 3px;background-position:0 50%;background-repeat:no-repeat}
/* special squares filled */
.cell.t-pay{background:linear-gradient(180deg,#ffe66b,#ffd338);border-color:#e0b520;color:#5a4300}
.cell.t-pay .sub{color:#7a5d00}
.cell.t-jobless{background:linear-gradient(180deg,#5b2a86,#46206a);border-color:#3a1a58;color:#fff}
.cell.t-jobless .sub{color:#e3d4f5}
.cell.t-charity{background:linear-gradient(180deg,#ffa34d,#f5862a);border-color:#d96c12;color:#fff}
.cell.t-charity .sub{color:#fff3e6}
.cell.t-pay .stripe,.cell.t-jobless .stripe,.cell.t-charity .stripe{display:none}
/* need vs have box */
.need{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px;background:var(--surface);border-radius:10px;overflow:hidden}
.need th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:4px 6px;background:var(--surface2)}
.need th:first-child,.need td:first-child{text-align:left}
.need td{padding:4px 6px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.need tr.short td{color:var(--bad);font-weight:600}
.lack{color:var(--bad);font-weight:600;font-size:13px;margin:4px 0}
@media (prefers-reduced-motion: reduce){button{transition:none}}
/* ===== FX / animation ===== */
.cell .ico{position:absolute;right:1px;bottom:0;font-size:1.7em;line-height:1;opacity:.38;pointer-events:none;filter:saturate(1.2)}
.cell.corner .ico{font-size:2.6em;opacity:.5;right:50%;bottom:4%;transform:translateX(50%)}
.cell.road .ico{display:none}
.cell.here{outline:none;animation:herePulse 1.4s ease-in-out infinite;z-index:1}
@keyframes herePulse{0%,100%{box-shadow:inset 0 0 0 2px #ffb627,0 0 0 0 rgba(255,182,39,0)}50%{box-shadow:inset 0 0 0 2px #ffb627,0 0 0 5px rgba(255,182,39,.45)}}
.cell.trail::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,226,120,.85),rgba(255,200,60,.35));animation:trail 1.1s ease-out forwards;animation-delay:var(--td,0ms);pointer-events:none}
@keyframes trail{from{opacity:1}to{opacity:0}}
.cell .toks{z-index:2}
.tok{width:clamp(9px,2.4vw,14px);height:clamp(9px,2.4vw,14px);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%)!important;background-blend-mode:normal}
.cell .tok{box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.2)}
.cell .tok.cur{animation:tokBob 1.1s ease-in-out infinite;box-shadow:0 0 0 2px #ffb627,0 3px 4px rgba(0,0,0,.3)}
@keyframes tokBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cell .tok.hop{animation:tokHop .34s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tokHop{0%{transform:translateY(-12px) scale(1.35)}100%{transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;place-items:center}
.droll{display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .25s}
.droll.out{opacity:0}
.droll .row{display:flex;gap:20px}

/* ภัยพิบัติ: เปลี่ยนพื้นหลังเกมเป็นภาพภัยพิบัติ opacity 50% (P037) · body[data-dis] ตั้งใน render() */
body[data-dis]::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:center/cover no-repeat;opacity:.5;animation:disbgIn 1s ease-out}
body[data-dis=quake]::before{background-image:url(img/dis-quake.webp);background-size:600px;background-repeat:repeat}
body[data-dis=flood]::before{background-image:url(img/dis-flood.webp)}

.disbar{position:absolute;left:10px;bottom:10px;z-index:45;display:flex;align-items:center;gap:6px;max-width:calc(100% - 74px);padding:6px 14px;border-radius:999px;border:2px solid #fff;background:linear-gradient(90deg,#c0392b,#e8613c);color:#fff;font-weight:800;font-size:13px;line-height:1.25;box-shadow:0 4px 14px rgba(150,40,20,.4);cursor:pointer;animation:disPulse 1.6s ease-in-out infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disbar small{font-weight:600;opacity:.92}
.disbar[hidden]{display:none!important}/* display:flex ทับ hidden → ภัยพิบัติจบแล้วแถบยังค้าง */
@keyframes disPulse{0%,100%{box-shadow:0 4px 14px rgba(150,40,20,.4)}50%{box-shadow:0 0 0 5px rgba(232,97,60,.35),0 4px 14px rgba(150,40,20,.4)}}

@keyframes bannerIn{0%{transform:translateX(-110%)}22%{transform:translateX(0)}78%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
.coin{position:fixed;font-size:22px;animation:coinFly 1.1s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes coinFly{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r))}}
.modal{position:relative}
.modal.cardflip{animation:cflip .75s cubic-bezier(.3,.9,.3,1.05) both}
.modal.cardflip::before,.modal.cardflip::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:9;animation:cback .75s linear both;pointer-events:none}
.modal.cardflip::before{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35) 0 18%,transparent 19%),repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 9px,transparent 9px 18px),var(--cbc,#c96a2b);border:4px solid #fff;box-sizing:border-box}
.modal.cardflip::after{background:#fff;-webkit-mask:var(--logo) center/96px no-repeat;mask:var(--logo) center/96px no-repeat;opacity:.95}
.modal.k-life{--cbc:#d77a3a;--cbimg:url(img/back-life.webp)}.modal.k-learn{--cbc:#3a8cc4;--cbimg:url(img/back-learn.webp)}.modal.k-opp{--cbc:#d6a419;--cbimg:url(img/back-opp.webp)}.modal.k-netc{--cbc:#2a9d8f;--cbimg:url(img/back-net.webp)}
.modal.cardflip::before{background:var(--cbimg) center/cover no-repeat,var(--cbc)!important;border:none!important}.modal.cardflip::after{display:none}
@keyframes cflip{0%{transform:perspective(1100px) translateY(80px) rotateY(180deg) scale(.45);opacity:0}18%{opacity:1}50%{transform:perspective(1100px) translateY(0) rotateY(90deg) scale(.95)}100%{transform:perspective(1100px) rotateY(0) scale(1)}}
@keyframes cback{0%,49.9%{opacity:1}50%,100%{opacity:0}}
.pile{transition:transform .18s,box-shadow .18s;box-shadow:0 3px 0 var(--line),0 6px 0 -2px #fff,0 7px 0 -2px var(--line),0 10px 0 -4px #fff,0 11px 0 -4px var(--line)!important}

/* center */
.center{position:relative}.center::before{content:'';position:absolute;inset:18% 22%;background:#be1e2d;opacity:.06;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;pointer-events:none;z-index:0}.center>*{position:relative;z-index:1}

/* จอคอมกว้าง: ป๊อปอัปใหญ่ขึ้นเอง (--mz) · ปุ่ม A−/A+ (--tz) ขยายทั้งตัวหนังสือและความกว้างป๊อปอัปไปด้วย ไม่ให้ตัวหนังสือล้น/ถูกตัด */

/* text scale: panels, popups, notices, board labels */
.layout>section:last-child,.rnotes,#setupView,.setov{zoom:var(--tz)}
.modal .mh,.modal .mb,.modal .mf{zoom:calc(var(--tz) * var(--mz))}

.modal{display:flex;flex-direction:column}.modal>.mh,.modal>.mf{flex:none}.modal>.mb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.modal{max-width:min(calc(440px * var(--tz) * var(--mz)),96vw)!important}
.modal.k-pick{max-width:min(calc(340px * var(--tz) * var(--mz)),96vw)!important}
.cell .lbl{font-size:calc(1em * var(--tz))}
.center{font-size:calc(1em * var(--tz))}
.tzbox{display:inline-flex;gap:4px}.tzbox button{min-width:40px;font-weight:800;padding-left:8px;padding-right:8px}
.tzbox button:disabled{opacity:.4}
/* board pinch zoom */
.bwrap{position:relative;overflow:hidden;touch-action:pan-x pan-y;border-radius:22px}

.bwrap .board{transform-origin:0 0;will-change:transform}

.hcash{font-weight:700;white-space:nowrap}.hcash b{font-size:1.05em}
.bzoom{position:relative}
.bwrap.v3d .bzoom{position:absolute;inset:0;perspective:inherit;perspective-origin:inherit;transform-origin:50% 50%;transition:transform .25s ease-out}
.bzctl{position:absolute;right:10px;bottom:10px;z-index:41;display:flex;flex-direction:column;gap:6px}
.bzctl button{width:40px;height:40px;min-height:0;padding:0;border-radius:12px;font-size:22px;line-height:1;font-weight:700;background:rgba(255,253,246,.92);border:1.5px solid #d9c9a3;box-shadow:0 2px 6px rgba(60,50,20,.2);color:#5b4a2a}

 .layout{grid-template-columns:minmax(0,min(760px,calc(100dvh - 96px),calc(100% - 370px))) minmax(350px,1fr)!important;align-items:start}
 .layout>section:last-child{max-height:calc(100dvh - 76px);overflow:auto;position:sticky;top:8px}
}

.panel{overflow-x:hidden}

/* ===== 3D board ===== */
.bwrap.v3d{perspective:1000px;perspective-origin:50% 0%;overflow:hidden;aspect-ratio:1/1.02;background:radial-gradient(120% 90% at 50% 100%,#cfe8b8,#e8f4ff 70%);border-radius:22px}
.board.v3d{--tilt:50deg;transform-style:preserve-3d;transform:translateY(16%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.08)!important;transition:transform 1.1s cubic-bezier(.45,.05,.25,1);transform-origin:50% 50%}

.board.v3d .cell .tok.pic{transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt))) translateY(-12%);transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}

/* HUD (flat panel over far side) */
.hud{position:absolute!important;left:2%;right:2%;top:1.5%;z-index:30;flex-direction:row!important;flex-wrap:wrap;justify-content:center!important;align-items:center;gap:6px 14px!important;padding:8px 12px!important;border-radius:16px;background:rgba(255,253,246,.93)!important;box-shadow:0 6px 18px rgba(60,50,20,.18);container-type:inline-size!important;grid-column:auto!important;grid-row:auto!important;max-height:none;overflow:visible}
.hud::before{display:none}
.hud .who{font-size:clamp(14px,3.6cqw,22px)}.hud .who .tok.pic.big{width:clamp(28px,6.5cqw,46px)!important;height:clamp(28px,6.5cqw,46px)!important}
.hud .job{font-size:clamp(11px,2.3cqw,14px);flex-basis:100%;text-align:center}

/* card time: the HUD becomes the card table covering the board */

/* ===== 3D v2: tighter HUD, bigger near side, full-body standees ===== */
.bwrap.v3d{perspective:640px;perspective-origin:50% -10%;aspect-ratio:1/1.08}

.bwrap.v3d{aspect-ratio:1/1.12;perspective:760px}

.walker.bob::before{animation:walkBob var(--stepms,640ms) ease-in-out}
@keyframes walkBob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7%) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-7%) rotate(3deg)}}

/* แนวนอน (มือถือ/Fold/จอคอม): ป๊อปอัปกลางจอ ตัวละครเต็มตัวยืนข้างซ้าย-ขวา ใหญ่ขึ้น 50% (--fb = ความสูงเต็มตัว) */

/* ===== มุมมอง 3D แบบ isometric (กล้องตายตัว) ===== */
.board.v3d.iso{--band:minmax(0,1fr);background:none!important;grid-template-columns:minmax(0,1fr) var(--band) repeat(9,minmax(0,1fr)) var(--band) minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) var(--band) repeat(9,minmax(0,1fr)) var(--band) minmax(0,1fr)!important}
.landring{display:none}
.tbase{display:none}
.cell:has(.sqimg) .ico,.cell:has(.sqimg) .cimg{display:none!important}
.board.v3d.iso .cell>.cimg,.board.v3d.iso .cell>.ico,.board.v3d.iso .cell>.zimg:not(.pimgc){display:none!important}
/* isometric: ลำดับวาดตามความลึก (ช่องหน้าทับช่องหลัง) — ช่องที่ยืนอยู่ห้ามลอยทับภาพสูงของช่องหน้า */
.board.v3d.iso .cell,.board.v3d.iso .cell.here{z-index:calc(10 + var(--d,0))!important}.gapt{display:none}.board.v3d.iso .gapt{display:block;position:relative;container-type:size;z-index:1}.board.v3d.iso .gapt .pimgc{position:absolute;left:50%;top:50%;width:calc(var(--cw,62px) * 1.414);max-width:none;transform-origin:50% var(--b);transform:translate(-50%,calc(-1 * var(--b))) translateZ(calc(var(--d,0) * .04px)) rotate(-45deg) scaleY(var(--s)) scaleX(var(--m,1));pointer-events:none}
.board.v3d.iso .cell .ico{position:absolute;left:50%;top:50%;z-index:3;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateZ(calc(-1 * var(--ang,45deg))) rotateX(calc(-1 * var(--tilt)))}.board.v3d.iso .cell .zimg.tbase{display:block}
.board.v3d.iso .cell:has(.tbase)::before,.board.v3d.iso .cell:has(.tbase)::after{display:none}

function lifeApply(p,c){
  const parts=[];
  if(+c.cash>0){p.cash+=+c.cash;parts.push(`ได้เงิน ${B(+c.cash)}`)}
  if(+c.cash<0){const amt=lifeCost(p,-c.cash);pay(p,amt);parts.push(`จ่าย ${B(amt)}`)}
  if(+c.cpct){const a=rnd100(p.salary*Math.abs(c.cpct)/100);if(c.cpct>0){p.cash+=a;parts.push(`ได้เงิน ${B(a)}`)}else{pay(p,a);parts.push(`จ่าย ${B(a)}`)}}
  if(+c.spct){const a=rnd100(p.salary*c.spct/100);p.salary+=a;parts.push(`เงินเดือน ${a>0?'+':''}${B(a)} ต่อเดือน`)}
  if(+c.mexp){const mx=lifeCost(p,+c.mexp);p.exp.extra=(p.exp.extra||0)+mx;parts.push(`รายจ่าย +${B(mx)} ต่อเดือน`)}
  if(+c.act){p.active=(p.active||0)+ +c.act;parts.push(`รายได้เสริม +${B(+c.act)} ต่อเดือน`)}
  if(+c.pas){p.deals.push({id:NOW()+Math.random(),t:c.t,ty:'biz',cost:Math.max(0,-(+c.cash||0)),cf:+c.pas});parts.push(`Passive +${B(+c.pas)} ต่อเดือน`)}
  if(+c.kid){if(p.kids>=KIDMAX)parts.push(`มีลูกครบ ${KIDMAX} คนแล้ว`);else{p.kids++;parts.push(`ค่าเลี้ยงดูบุตร +${B(p.kidCost)} ต่อเดือน`)}}
  return (parts.join(' · ')||'—')+adj(p,{h:+c.h||0,t:+c.tt||0,k:+c.k||0});
}

/* หลุดบรรยากาศ: ห้ามเปิดกองธุรกิจเครือข่าย 2–5 เทิร์นของตัวเอง (p.offnet) · ป้องกัน: หัก ❤ 1–3 และ 📚 3–6 ตามจำนวนเทิร์น
   นับลดตอนจบเทิร์นของผู้เล่นคนนั้น (offnetTick ใน turnPassiveTime) ยกเว้นเทิร์นที่เพิ่งโดน */
function offnetTick(p){if(p.offnet>0){if(p._offnew){delete p._offnew;return}p.offnet--;if(!p.offnet){log(`🔥 ${esc(p.name)} กลับเข้าบรรยากาศธุรกิจ A แล้ว เปิดกองธุรกิจเครือข่าย ได้`);ruleNote(p,'กลับเข้าบรรยากาศแล้ว','เปิดการ์ดกองธุรกิจเครือข่าย ได้ตามปกติ')}}}
const offNet=p=>p&&p.offnet>0;
async function offCard(p,c){const [,t,,,,,,,,,,d]=c,n=2+Math.floor(Math.random()*4),nh=n<=2?1:n<=3?2:3,nk=n+1;
  const can=p.st.h>nh&&p.st.k>=nk;
  const body=`<p>${esc(d)}</p><div class="kv"><b>ผล</b><span class="neg">ติดสถานะ "หลุดบรรยากาศ" ห้ามเปิดการ์ดกองธุรกิจเครือข่าย <b>${n} เทิร์น</b></span></div>
   <p><b>ป้องกันได้</b> ถ้าฝืนกลับไปเข้าประชุมและคุยกับทีม: ใช้ ❤ ${nh} และ 📚 ${nk}</p>
   <p class="muted" style="font-size:12px">ตอนนี้คุณมี ❤ ${p.st.h} · 📚 ${p.st.k}${can?'':` — ${p.st.h<=nh?`❤ ต้องเหลืออย่างน้อย 1 หลังใช้ (ต้องมี ${nh+1} ขึ้นไป)`:''}${p.st.h<=nh&&p.st.k<nk?' · ':''}${p.st.k<nk?`📚 ไม่พอ (ต้องใช้ ${nk})`:''}`}</p>`;
  const v=await choose({actor:p,kind:'netc',title:`🌫️ ${esc(t)}`,body,opts:[{v:'save',l:`ฝืนกลับเข้าทีม (❤−${nh} 📚−${nk})`,c:'pri',dis:!can},{v:'lose',l:`ยอมพัก ${n} เทิร์น`}],bot:can?'save':'lose'});
  if(v==='save'&&can){const sx=adj(p,{h:-nh,k:-nk},true);log(`🔥 ${esc(p.name)} ฝืนกลับเข้าทีมได้ ไม่หลุดบรรยากาศ${sx}`);ruleNote(p,'ไม่หลุดบรรยากาศ',`ใช้ ❤ ${nh} และ 📚 ${nk} กลับเข้าประชุมและคุยกับทีม ยังเปิดกองธุรกิจเครือข่าย ได้`);return}
  p.offnet=Math.max(p.offnet||0,n);p._offnew=1;log(`🌫️ ${esc(p.name)} หลุดบรรยากาศ ห้ามเปิดกองธุรกิจเครือข่าย ${n} เทิร์น`);
  ruleNote(p,`หลุดบรรยากาศ (${n})`,`ห้ามเปิดการ์ดกองธุรกิจเครือข่าย ${n} เทิร์น${can?' (เลือกไม่ป้องกัน)':` · ค่าพลังไม่พอป้องกัน (ต้องมี ❤ มากกว่า ${nh} และ 📚 อย่างน้อย ${nk})`}`)}
/* ===== การ์ดสแกม "ธุรกิจ B" (กองธุรกิจเครือข่าย 1 ใบ) =====
   ลงทุน ฿100,000 → ได้ ฿20,000 ทุกจบเทิร์นของตัวเอง (ไม่นับเทิร์นที่ลงทุน) เป็นเวลาสุ่ม 1–3 เทิร์น (ผู้เล่นไม่รู้)
   ครบแล้ว → แจ้งจับฉ้อโกงประชาชน: ติดคุก 3 เทิร์น (ไม่ได้ทอย) + ยึดทรัพย์ทั้งหมด = เริ่มต้นใหม่ตามอาชีพ (เก็บลูกไว้)
   p.scamB={left,paid,_new} · p.jail = เทิร์นที่ต้องหยุด (เช็กใน rollTurn) */
async function scamBCard(p,c){const [,t,,,cost,,,cf,,,,d]=c;
  if(p.scamB||p.jail){await choose({actor:p,kind:'netc',title:esc(t),body:`<p>${esc(d)}</p><p class="muted">คุณลงทุนในธุรกิจ B ไปแล้ว</p>`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});return}
  const ok=await buyFlow(p,cost,{kind:'netc',verb:'ลงทุน',no:'ไม่สนใจ',cf,bot:p.cash>cost*1.5&&Math.random()<.35,title:`💸 ${esc(t)}`,body:`<p>${esc(d)}</p><div class="kv"><b>เงินลงทุน</b><span class="num">${B(cost)}</span><b>ผลตอบแทน</b><span class="num pos">+${B(cf)} ทุกเทิร์น</span></div>`});
  if(!ok)return;scamStart(p,'B')}
function scamStart(p,k){if(k==='B')p.scamB={left:1+Math.floor(Math.random()*3),paid:0,_new:1};else p.scamC={left:3+Math.floor(Math.random()*4),inv:50000,cf:SCC_CF,paid:0,_new:1};log(`💸 ${esc(p.name)} ลงทุนธุรกิจ ${k} ${B(k==='B'?100000:50000)} ตามคำชวนของเพื่อน`)}
/* ปุ่มในแท็บธุรกิจ B/C (เฉพาะตาของตัวเอง) */
async function scamTabInvest(k){const p=cp();if(!canAct()||S.view!==p.id||p.jail||(k==='B'?p.scamB:p.scamC))return;const cost=k==='B'?100000:50000,cf=k==='B'?20000:SCC_CF;
  const ok=await buyFlow(p,cost,{kind:'netc',verb:'ลงทุน',no:'ไม่ลงทุน',cf,bot:false,title:`💸 ลงทุนธุรกิจ ${k}`,body:`<div class="kv"><b>เงินลงทุน</b><span class="num">${B(cost)}</span><b>ผลตอบแทน</b><span class="num pos">+${B(cf)} ทุกเทิร์น</span></div>`});
  if(ok)scamStart(p,k);render()}
async function scamTabCancel(k){const p=cp();if(!canAct()||S.view!==p.id||!(k==='B'?p.scamB:p.scamC))return;

  if(v==='yes')await scamQuit(p,k,'ขอยกเลิกการลงทุน');render()}
function scamBTick(p){const z=p.scamB;if(!z)return;if(z._new){delete z._new;return}
  p.cash+=20000;z.paid+=20000;z.left--;ledg(p,'💸','ผลตอบแทนธุรกิจ B',{c:20000});log(`💸 ${esc(p.name)} ได้ผลตอบแทนธุรกิจ B +${B(20000)}`);

  const paid=z.paid;delete p.scamB;scamArrest(p);
  const b=`<p><b>ธุรกิจ B คือแชร์ลูกโซ่</b> เงิน "ผลตอบแทน" ${B(paid)} ที่ ${esc(p.name)} ได้รับ (เทิร์นละ ${B(20000)}) ไม่ได้มาจากกำไรจริง แต่เป็นเงินของสมาชิกรายใหม่ที่ถูกชวนเข้ามาต่อ ๆ กัน</p>
   <p>เมื่อมีคนแจ้งความ ตำรวจจับกุมทุกคนในเครือข่ายข้อหา <b>ฉ้อโกงประชาชน</b></p>
   <div class="kv"><b>สถานะ</b><span class="neg">ติดคุก หยุดเดิน 3 เทิร์น</span><b>ทรัพย์สิน</b><span class="neg">ถูกยึดทั้งหมด เริ่มต้นใหม่ตามอาชีพเดิม</span></div>
   <p class="muted" style="font-size:12px">บทเรียน: ผลตอบแทนสูงเกินจริงโดยไม่ต้องขายสินค้าหรือบริการ คือสัญญาณของแชร์ลูกโซ่</p>`;
  S.ann=S.ann||[];S.ann.push({k:'netc',t:`🚔 ${esc(p.name)} ถูกจับ! ธุรกิจ B เป็นแชร์ลูกโซ่`,b});
  ruleNote(p,'🚔 ถูกจับข้อหาฉ้อโกงประชาชน','ธุรกิจ B คือแชร์ลูกโซ่ · ติดคุก 3 เทิร์น · ทรัพย์สินถูกยึดทั้งหมด เริ่มต้นใหม่')}
/* ===== การ์ดสแกม "ธุรกิจ C" (กองธุรกิจเครือข่าย 1 ใบ) =====
   ลงทุน ฿50,000 → +฿15,000 ทุกจบเทิร์นของตัวเอง (ไม่นับเทิร์นที่ลงทุน) · ต้นเทิร์นถัดไปถามเพิ่มทุน ฿50,000 (ผลตอบแทน +฿15,000)
   ไม่เพิ่มทุน → ธุรกิจ C ปิดตัวหนี เงินลงทุนสูญ แต่ไม่โดนจับ · เพิ่มทุนไปเรื่อย ๆ จนครบ 3–6 เทิร์น (สุ่ม ไม่บอก) → โดนจับ โทษเหมือนธุรกิจ B
   p.scamC={left,inv,cf,paid,ask,_new} */
const SCC_ADD=50000,SCC_CF=15000;
async function scamCCard(p,c){const [,t,,,cost,,,cf,,,,d]=c;
  if(p.scamC||p.jail){await choose({actor:p,kind:'netc',title:esc(t),body:`<p>${esc(d)}</p><p class="muted">คุณลงทุนในธุรกิจ C ไปแล้ว</p>`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});return}
  const ok=await buyFlow(p,cost,{kind:'netc',verb:'ลงทุน',no:'ไม่สนใจ',cf,bot:p.cash>cost*1.5&&Math.random()<.35,title:`💸 ${esc(t)}`,body:`<p>${esc(d)}</p><div class="kv"><b>เงินลงทุน</b><span class="num">${B(cost)}</span><b>ผลตอบแทน</b><span class="num pos">+${B(cf)} ทุกเทิร์น</span></div>`});
  if(!ok)return;scamStart(p,'C')}
function scamCTick(p){const z=p.scamC;if(!z)return;if(z._new){delete z._new;return}
  p.cash+=z.cf;z.paid+=z.cf;z.left--;ledg(p,'💸','ผลตอบแทนธุรกิจ C',{c:z.cf});log(`💸 ${esc(p.name)} ได้ผลตอบแทนธุรกิจ C +${B(z.cf)}`);
  if(z.left>0){z.ask=1;ruleNote(p,'ผลตอบแทนธุรกิจ C',`ได้ +${B(z.cf)} (รวม ${B(z.paid)} · ลงทุนไป ${B(z.inv)})`);return}
  const paid=z.paid,inv=z.inv;delete p.scamC;scamArrest(p,'C');
  S.ann=S.ann||[];S.ann.push({k:'netc',t:`🚔 ${esc(p.name)} ถูกจับ! ธุรกิจ C เป็นแชร์ลูกโซ่`,b:`<p><b>ธุรกิจ C คือแชร์ลูกโซ่</b> ${esc(p.name)} ลงทุนเพิ่มตามที่ถูกชวนจนรวม ${B(inv)} ได้ "ผลตอบแทน" ${B(paid)} ซึ่งเป็นเงินของสมาชิกรายใหม่ ไม่ใช่กำไรจริง</p><p>เมื่อมีคนแจ้งความ ตำรวจจับกุมทุกคนในเครือข่ายข้อหา <b>ฉ้อโกงประชาชน</b></p><div class="kv"><b>สถานะ</b><span class="neg">ติดคุก หยุดเดิน 3 เทิร์น</span><b>ทรัพย์สิน</b><span class="neg">ถูกยึดทั้งหมด เริ่มต้นใหม่ตามอาชีพเดิม</span></div><p class="muted" style="font-size:12px">บทเรียน: ถ้าถูกเร่งให้เพิ่มเงินลงทุนเรื่อย ๆ เพื่อรักษาผลตอบแทน คือสัญญาณของแชร์ลูกโซ่ ยิ่งอยู่นานยิ่งเสียหายหนัก</p>`});
  ruleNote(p,'🚔 ถูกจับข้อหาฉ้อโกงประชาชน','ธุรกิจ C คือแชร์ลูกโซ่ · ติดคุก 3 เทิร์น · ทรัพย์สินถูกยึดทั้งหมด เริ่มต้นใหม่')}
/* ต้นเทิร์น: ถามเพิ่มทุนธุรกิจ C */
async function scamCAsk(p){const z=p.scamC;if(!z||!z.ask)return;delete z.ask;

    body:`<p>เพื่อนบอกว่ารอบนี้ต้อง "เพิ่มทุน" เพื่อรักษาสิทธิ์รับผลตอบแทน ถ้าเพิ่มทุนจะได้ผลตอบแทนมากขึ้น</p><div class="kv"><b>ลงทุนไปแล้ว</b><span class="num">${B(z.inv)}</span><b>ได้ผลตอบแทนแล้ว</b><span class="num pos">${B(z.paid)}</span><b>เพิ่มทุน</b><span class="num">${B(SCC_ADD)}</span><b>ผลตอบแทนใหม่</b><span class="num pos">+${B(z.cf+SCC_CF)} ทุกเทิร์น</span></div><p class="muted" style="font-size:12px">ถ้าไม่เพิ่มทุน ธุรกิจ C จะตัดสิทธิ์คุณ</p>`});
  if(ok){z.inv+=SCC_ADD;z.cf+=SCC_CF;log(`💸 ${esc(p.name)} เพิ่มทุนธุรกิจ C ${B(SCC_ADD)} (ลงทุนรวม ${B(z.inv)} · ผลตอบแทน ${B(z.cf)}/เทิร์น)`);return}

/* ถอนตัว/ไม่เพิ่มทุน: ธุรกิจปิดตัวหนี เงินลงทุนสูญ ไม่โดนจับ */
async function scamQuit(p,k,why){const z=k==='B'?p.scamB:p.scamC;if(!z)return;axOf(p).esc=1;const inv=k==='B'?100000:z.inv,paid=z.paid;if(k==='B')delete p.scamB;else delete p.scamC;

const RULES=`<ol class="rules">
<li><b>ลูก</b> (สูงสุด 4 คน): คนที่ 1–2 บังคับรับ คนที่ 3–4 เลือกได้ · ค่าเลี้ยงดูรายเดือนตามอาชีพ · ⏳ −1 ทุกวันเงินเดือนต่อลูก 1 คน · แรงบันดาลใจ: การ์ดธุรกิจ/งานที่ใช้ ❤ ลดลง 1 ต่อลูก และรายได้ธุรกิจ (ธุรกิจในกองโอกาส + ธุรกิจ A) +5% ต่อลูก · การ์ดค่าเทอม ทัศนศึกษา อุปกรณ์การเรียน ฯลฯ ไม่บังคับ คิดตามจำนวนลูก</li>
<li><b>กองดำเนินชีวิต</b> = แหล่งเติม ❤ หัวใจ และ ⏳ เวลา ไม่มีใบไหนหักค่าพลัง จ่ายเป็นเงินแทน และค่าใช้จ่ายของการ์ดคูณค่าครองชีพเขตที่ยืนอยู่: ต่างจังหวัด: เกษตรกรรม ×0.7 · อุตสาหกรรม ×0.8 · ชุมชน ×0.85 · ท่องเที่ยว ×1.0 | เมืองหลวงแพงกว่าเสมอ: ย่านการเงิน ×1.3 · ย่านธุรกิจ ×1.4 · ย่านช้อปปิ้ง ×1.5 · ย่านที่พักหรู ×1.7 · <b>การ์ดชีวิตไม่บังคับรับ</b> เลือกข้ามได้ ยกเว้นการ์ดอุบัติเหตุ (และช่องฟุ่มเฟือยที่บังคับจ่าย)</li>
<li>กระดาน 2 ชั้น: <b>ชั้นนอก = ต่างจังหวัด</b> 40 ช่อง (เขตเกษตรกรรม อุตสาหกรรม ท่องเที่ยว ชุมชน) ค่าครองชีพ ×0.85 ที่ดินถูก · <b>ชั้นใน = เมืองหลวง</b> 32 ช่อง ค่าครองชีพ ×1.3 อสังหาฯ แพง แต่สร้างธุรกิจง่าย (มีศูนย์ธุรกิจ และดีลธุรกิจลด 20%)</li>
<li>ทุกเขตมี <b>ช่องถนน</b> เดินผ่านแล้วเลือกข้ามไปถนนของอีกชั้นได้ การข้ามนับเป็น 1 ก้าว ก้าวที่เหลือเดินต่อในชั้นใหม่ ค่าครองชีพคิดตามชั้นที่คุณอยู่</li>
<li>ช่อง <b>เงินเดือน</b>: ชั้นนอก 4 ช่อง (ทุกมุม) ชั้นใน 2 ช่อง (มุมตรงข้ามกัน) · ช่อง <b>ตกงาน</b>: ชั้นละ 1 ช่อง · <b>รอบที่ 1–5</b> โดนแค่ <b>ใบเตือน 🟨</b> เงินเดือนลด 50% 2 เดือน · ตั้งแต่รอบที่ 6 หัวใจ −2 และติดสถานะตกงาน วันเงินเดือน 2 ครั้งถัดไปได้เฉพาะ Passive income (ไม่ได้เงินเดือนและรายได้ Active) แล้วหักรายจ่ายรวม ถ้าเงินสดไม่พอ เลือกกู้ หรือขายทรัพย์สินในราคา 50%</li>
<li>ปกติ <b>ทอยลูกเต๋า 1 ลูก</b> · ช่อง <b>บริจาคการกุศล</b> (ชั้นละ 1 ช่อง) บริจาค 10% ของรายรับรวม แล้วเลือกทอย 1 หรือ 2 ลูกได้ 3 เทิร์น</li>
<li>เทิร์นของคุณ: <b>ทอยลูกเต๋า</b> เดิน แล้วทำตามช่องที่หยุด จากนั้น <b>จั่วการ์ดได้ 3 ใบ</b> เลือกจากกองไหนก็ได้ ซ้ำกองได้: ดำเนินชีวิต · เรียนรู้ · โอกาสชีวิต · ธุรกิจ A (กด "พอแล้ว" เพื่อหยุดก่อนครบได้)</li>
<li>เดินผ่านช่อง <b>เงินเดือน</b> รับกระแสเงินสด = เงินเดือน + รายได้จากทรัพย์สิน − รายจ่ายรวม</li>
<li>ซื้ออสังหาฯ แบบเกมเศรษฐี ใครหยุดต้องจ่ายค่าผ่านทาง ครบทั้งเขตได้ค่าเช่า ×1.5 ค่าผ่านทาง ×2 หยุดที่ของตัวเองอัปเกรดได้ 2 ขั้น แตะช่องบนกระดานเพื่อดูรายละเอียด</li>
<li>ตลาดหุ้นและสินค้าเทรดได้ตลอดเทิร์นของคุณ ช่องตลาดหลักทรัพย์ (เมืองหลวง) เทรดฟรีค่าคอม</li>
<li><b>ธุรกิจ A</b> (ธุรกิจเครือข่าย): ไม่มีช่องบนแผนที่ สมัคร ฿900 เพื่อเปิดแท็บธุรกิจเครือข่าย › ธุรกิจ A · จั่วกองการ์ดธุรกิจเครือข่าย เพื่อสร้างสายงาน A–F ทำยอด PV และไต่ระดับ สมาชิก → ซิลเวอร์ → โกลด์ → แพลทินัม → รูบี้ → เพิร์ล → เอเมอรัลด์ → ไดมอนด์ · การ์ดในกองนี้ส่วนใหญ่ใช้เวลา 1</li>
<li><b>ศูนย์เรียนรู้</b> (ชั้นนอก 4 ช่อง ชั้นใน 2 ช่อง): ได้ความรู้ +2–4 และสกิลการ์ดสุ่ม 1 อย่าง ฟรี</li><li><b>แท็บตลาด</b>: ทุกต้นรอบ NPC เปิดการ์ดโอกาส 2 ใบ · ธุรกิจ/อสังหาฯ ขึ้นแท็บตลาด ซื้อได้ในตาของคุณ ใครยืนยันก่อนได้ (บอทซื้อได้เฉพาะตาของบอท) · ข่าวหุ้น/คริปโต/สินค้า/กองทุน ขึ้นแท็บข่าวสารและมีผลกับราคาทันที · โชว์ 2 รอบ · ในแท็บตลาดยังติดป้ายขาย ซื้อจากป้ายคนอื่น และขายให้ธนาคารได้</li>
<li>ซื้อขายทรัพย์สินกับผู้เล่นอื่นได้ กู้ธนาคารได้ ดอกเบี้ย 2% ต่อเดือน (เพดานหนี้ ฿400,000 หรือ 12 เท่าของเงินเดือน เกิน = ล้มละลาย)</li>
<li>⏱ <b>เทิร์นละไม่เกิน 3 นาที</b> หมดเวลาแล้วจบเทิร์นอัตโนมัติ (การตัดสินใจที่ค้างจะถูกปฏิเสธ) · กด <b>จบเทิร์น</b> ก่อนครบ 3 นาทีได้ ⏳ เวลา +1</li>
<li><b>ค่าพลัง (เต็ม 10)</b>: ❤ หัวใจ (สุขภาพกายและใจ) · ⏳ เวลา · 📚 ความรู้ — เรียนรู้ใช้เวลา 2 ได้ความรู้ +2 · ดีลธุรกิจใช้เวลา 2 อสังหาฯ นอกกระดานใช้เวลา 1 · ธุรกิจและอสังหาฯ (บนกระดานและการ์ดโอกาส) ให้ผลตอบแทน 6–8% ต่อเดือนตามเขต (เกษตร 6% · ชุมชน/ที่พักหรู 6.5% · อุตสาหกรรม/ช้อปปิ้ง 7% · ท่องเที่ยว/ธุรกิจ 7.5% · การเงิน 8%) ผลตอบแทนยิ่งสูงยิ่งต้องใช้ความรู้มาก (×1–2.5) · ความรู้ 7 ขึ้นไปมองเห็นกลโกง · ทุกวันเงินเดือน (ผ่านหรือหยุด) ❤ หัวใจ สุ่ม 0 ถึง +2 และ <b>ลด −1 ต่อความเครียดแต่ละข้อ</b> (รายรับไม่พอรายจ่าย · หนี้ธนาคารเกิน 3 เท่าของเงินเดือน · ⏳ เหลือ ≤2 · ตกงาน · มีลูก 2 คนขึ้นไป) · ⏳ เวลา +1–3 · 📚 ความรู้ −0–1 · <b>การ์ดชีวิต/โอกาส/ธุรกิจ A หัก ⏳ ❤ 📚 ที่ต้องใช้ออกจริง</b> (การ์ดเรียนรู้และอสังหาฯ บนกระดานใช้ 📚 เป็นเกณฑ์ขั้นต่ำ ไม่หัก) · <b>ได้ ⏳ คืนเพิ่ม</b>: ช่องพักผ่อน 🌿 (⏳+1–2 ❤+1) · การ์ดชีวิตบางใบ · ปุ่มจ้างคนช่วย ฿10,000 = ⏳+1 (เทิร์นละครั้ง) · <b>ทุกเทิร์น</b> (ตอนจบเทิร์น): Passive ถึง 25% ของรายจ่าย ⏳+1 · 50% ⏳+1 📚+1 · 75% ❤+1 ⏳+1 📚+1 · ชนะ Lv.1 แล้ว ❤+1 ⏳+2 📚+1 (แทนขั้น Passive ไม่ซ้อน) · ธุรกิจ A ตามระดับสูงสุด (ซิลเวอร์ 📚+1 … ไดมอนด์ ❤+3 ⏳+4 📚+4) · จบเทิร์นก่อนเวลา ⏳+1 · ธุรกิจ A เลื่อนระดับละ ⏳+1 (ครั้งเดียว) · หัวใจ ≤2 เสียค่ารักษา หัวใจหมดป่วยหนักขาดงาน</li>
<li><b>❤ หัวใจต่ำ (2 หรือต่ำกว่า)</b>: ทุกวันเงินเดือนจ่ายค่ารักษา 20% ของเงินเดือน · ตกงานมาจากช่องตกงานหรือการ์ดตกงานเท่านั้น · เมื่อระบบใช้กติกาอัตโนมัติ (กู้อัตโนมัติ ค่ารักษา ล้มละลาย) จะมีกล่อง 📌 แจ้งสาเหตุ</li>
<li><b>ชนะ Lv.1 🏆</b>: รายได้จากทรัพย์สิน (Passive Income) ถึง 2 เท่าของรายจ่ายรวม ได้ถ้วยข้างชื่อ เกมเล่นต่อได้ · <b>ชนะ Lv.2 💎</b>: ธุรกิจ A ระดับไดมอนด์ · <b>ชนะเกม</b> ต้องได้ทั้ง Lv.1 และ Lv.2 (เกมจบทันที) · กด "จบเกมและสรุปผล" ในแท็บผู้เล่นเพื่อจบเกมเมื่อไรก็ได้</li></ol>`;

function resume(){

  if(!S.mkOn){S.adj={};for(const k in MKT){const a=AS(k),base=a.p*MKT[k][Math.min(cryIdx(),CRY_N-1)]/MKT[k][S.cm0];S.adj[k]=(S.prices[k]||base)/base}S.mkOn=1}
  syncDiv();
  for(const a of ASSETS)if(S.prices[a.s]==null){S.prices[a.s]=a.p;S.hist[a.s]=[a.p]}for(const q of S.players)q.dep=q.dep||0;if(S._stkNote){delete S._stkNote;const q=S.players.find(x=>x&&!x.bot);if(q)setTimeout(()=>ruleNote(q,'ตลาดเปลี่ยนรายชื่อสินทรัพย์','หุ้น/เหรียญ/สินค้าที่ถูกถอดออกจากตลาดขายคืนให้อัตโนมัติที่ราคาตลาดล่าสุด ดูยอดเงินในบันทึกเกม'),800)}
  if(S.winner!=null){render();return}
  if(S.phase==='busy')S.phase='card';
  S.autoPilot=false;S.turnEnd=NOW()+TURN_MS;
  if(PAR()){render();if(!S.rp&&parMaster())parStartRound();return}
  render();const p=cp();if(!p.bot)return;
  if(S.phase==='roll')botTurn();
  else if(S.phase==='card')sleep(S.speed).then(()=>pickPile(botPile(p)));
  else if(S.phase==='free')sleep(S.speed).then(()=>endTurn(true));
}

async function rollTurn(n){
  if(!S||S.phase!=='roll'||S.winner!=null)return;
  const p=cp();S.phase='busy';if(!p.bot&&!S.autoPilot)p.acted=true;
  if(p.jail>0){p.jail--;log(`🚔 ${esc(p.name)} ติดคุก หยุดเดินเทิร์นนี้${p.jail?` (เหลืออีก ${p.jail} เทิร์น)`:' · พ้นโทษแล้ว'}`);render();
    await choose({actor:p,kind:'netc',title:'🚔 ติดคุก',body:`<p>หยุดเดินเทิร์นนี้${p.jail?` เหลืออีก ${p.jail} เทิร์น`:' · เทิร์นหน้าพ้นโทษ เดินได้ตามปกติ'}</p>`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});
    S.phase='free';endTurn();return}
  if(p.scamC&&p.scamC.ask)await scamCAsk(p);
  await msnFlush(p);if(S.phase!=='busy')return;
  n=(p.charity>0&&n===2)?2:1;if(p.charity>0)p.charity--;
  const d=S.forceRoll?[S.forceRoll]:n===2?[r6(),r6()]:[r6()];S.forceRoll=0;await diceAnim(d,p.bot);S.dice=d;render();await sleep(p.bot?120:200);
  const steps=d.reduce((a,b)=>a+b,0);
  log(`🎲 ${esc(p.name)} ทอย ${n} ลูก ได้ ${steps}`);
  let left=steps;camOn(p);walkStart(p);
  while(left>0){
    p.pos=(p.pos+1)%RING_LEN[p.ring];left--;const q=SQ(p.ring+p.pos);FXT.trail[p.ring+p.pos]=NOW();FXT.hop={id:p.id,t:NOW()};
    render();camFollow(p);walkTo(p);await sleep(p.bot?(V3.on&&!MAPMIN?240:130):(V3.on&&!MAPMIN&&!RM?STEP_MS:260));if(q.t==='pay')await payday(p);
    if(q.t==='road'&&left>0){
      const [nr,ni]=roadPair(p.ring,p.pos);
      const into=nr==='i',toll=(2+Math.floor(Math.random()*9))*100;/* ค่าผ่านทางข้ามวง สุ่ม ฿200–1,000 (กันทริกลัดวงเก็บเงินเดือน) */
      const v=await choose({actor:p,title:`ถนน ${ZONES[q.z].n}`,body:`<p>${into?'เลี้ยวเข้า<b>เมืองหลวง</b>: สร้างธุรกิจง่าย แต่ค่าครองชีพ ×1.3 ที่ดินและอสังหาฯ แพง':'ออกไป<b>ต่างจังหวัด</b>: ค่าครองชีพ ×0.85 ที่ดินและอสังหาฯ ราคาถูก'}</p><p>ค่าผ่านทางข้ามชั้น <b>${B(toll)}</b> (สุ่ม ฿200–1,000)</p><p class="muted">เดินข้ามถนนไปอีกชั้นนับเป็น 1 ก้าว · เหลืออีก ${left} ก้าว</p>`,
        opts:[{v:'go',l:into?'เข้าเมืองหลวง':'ออกต่างจังหวัด',c:'pri'},{v:'stay',l:'เดินต่อชั้นเดิม'}],bot:botRoad(p,into)});
      if(v==='go'){pay(p,toll);ruleNote(p,'ค่าผ่านทางข้ามชั้น',`ข้ามถนนไป${into?'เมืองหลวง':'ต่างจังหวัด'}ต้องจ่ายค่าผ่านทาง ${B(toll)} (สุ่ม ฿200–1,000 ทุกครั้งที่ข้าม)`);p.ring=nr;p.pos=ni;left--;FXT.trail[p.ring+p.pos]=NOW();FXT.hop={id:p.id,t:NOW()};log(`🛣 ${esc(p.name)} ${into?'เข้าเมืองหลวง':'ออกต่างจังหวัด'} จ่ายค่าผ่านทาง ${B(toll)}`);render();camFollow(p);await sleep(150)}
    }
  }

}

    const bot=botMarket(p,offers,mine,others,avail,soldBank);
    if(p.bot&&bot.v==='done')break;
    const r=p.bot?(await sleep(S.speed*.6),{v:bot.v,form:bot.form}):await ask({actor:p,kind:'mkt',title:'ตลาดซื้อขาย',body,opts:[{v:'done',l:'ออกจากตลาด',c:'pri'}],bot:bot.v,

function botMarket(p,offers,mine,others,avail,soldBank){
  const f=fin(p);
  for(let i=0;i<others.length;i++){const l=others[i],a=findAsset(P(l.seller),l.key);if(a&&l.price<=a.fair*1.1&&p.cash-l.price>=f.expenses*.5)return {v:'buy'+i,form:{}}}
  for(let i=0;i<offers.length;i++){if(soldBank.has(i)||offers[i].m<1.3)continue;const a=mine.find(offers[i].match);if(a)return {v:'bank'+i,form:{['bo'+i]:a.key}}}
  if(p.cash<f.expenses&&avail.length&&!S.listings.some(l=>l.seller===p.id)){const a=avail.sort((x,y)=>x.cf-y.cf)[0];return {v:'post',form:{pk:a.key,pp:Math.round(a.fair*1.15/1000)*1000}}}
  return {v:'done',form:{}};
}

function liquidList(p){
  const out=[];
  for(const k in S.props)if(S.props[k].o===p.id)out.push({n:SQ(k).n,v:Math.round(S.props[k].inv*.5),go:()=>delete S.props[k]});
  for(const d of p.deals)if(d.ty!=='scam')out.push({n:d.t,v:Math.round(d.cost*.5),go:()=>{p.deals=p.deals.filter(x=>x!==d)}});
  for(const a of ASSETS){const hd=p.stocks[a.s];if(hd&&hd.q)out.push({n:`${a.n} ${hd.q.toLocaleString()} ${a.k==='stock'?'หุ้น':'หน่วย'} ทั้งหมด`,v:Math.round(hd.q*S.prices[a.s]*.5),go:()=>delete p.stocks[a.s]})}
  return out.filter(x=>x.v>0);
}
async function forcedPay(p,amt,title){
  while(p.cash<amt){
    const items=liquidList(p),short=amt-p.cash,L=Math.ceil(short/1000)*1000;
    const opts=[];if(items.length)opts.push({v:'sell',l:'ขายที่เลือก 50%'});opts.push({v:'loan',l:`กู้ธนาคาร ${B(L)}`,c:'pri'});
    const r=await ask({actor:p,pose:'angry',title,body:`<p>ต้องจ่าย ${B(amt)} มีเงินสด ${B(p.cash)} <b class="neg">ขาด ${B(short)}</b></p>${items.length?`<div class="fld"><label for="lq">หรือขายทรัพย์สินในราคา 50%</label><select id="lq" data-f="i">${items.map((it,i)=>`<option value="${i}">${esc(it.n)} — ได้ ${B(it.v)}</option>`).join('')}</select></div>`:''}<p class="muted">เงินกู้มีดอกเบี้ย ${LOAN_TXT} ต่อเดือน</p>`,opts,bot:'loan'});
    if(r.v==='sell'){const it=items[+(r.form.i||0)];it.go();p.cash+=it.v;log(`🔻 ${esc(p.name)} ขาย ${esc(it.n)} ราคา 50% ได้ ${B(it.v)}`)}
    else{p.loan+=L;p.cash+=L;log(`🏦 ${esc(p.name)} กู้ ${B(L)}`)}
    render();
  }
  p.cash-=amt;
  if(p.loan>Math.max(400000,p.salary*12))bankrupt(p);
}

function shockPrices(e){const ch=[];for(const s in e){const a=AS(s);if(!a||!cryLive(a,S))continue;const old=S.prices[s];let np=roundP(a,old*(1+e[s]/100));if(MKT[s]||a.k==='cry'){S.adj=S.adj||{};S.adj[s]=(S.adj[s]||1)*(1+e[s]/100)}S.prices[s]=np;S.hist[s].push(np);if(S.hist[s].length>20)S.hist[s].shift();ch.push({s,a,old,np,pct:e[s]})}syncDiv();return ch}
async function mnewsCard(p,c){
  if(PAR()){await parQueueNews(p,'m',c);return}
  const ch=shockPrices(c.e),[ico,cn]=MNCAT[c.cat];
  const rows=S.players.map(q=>{let dv=0;for(const x of ch){const h=q.stocks[x.s];if(h&&h.q)dv+=h.q*(x.np-x.old)}return {q,dv:Math.round(dv)}});
  if(c.cash)for(const q of S.players){if(c.cash>0)q.cash+=c.cash;else pay(q,-c.cash);ledg(q,'📰',`ข่าว: ${c.t}`,{c:c.cash})}
  log(`${ico} ${esc(p.name)} เปิดข่าว: ${esc(c.t)} · ${ch.map(x=>`${SN(x.a)} ${x.pct>0?'+':''}${x.pct}%`).join(' ')}${c.cash?` · ทุกคน${c.cash>0?'ได้':'จ่าย'} ${B(Math.abs(c.cash))}`:''}`);
  if(c.cash)ruleNote(p,c.cash>0?'ข่าวดี: ทุกคนได้เงิน':'ข่าวร้าย: ทุกคนจ่ายเงิน',`${c.cnote} ${B(Math.abs(c.cash))} (${esc(c.t)})`);
  render();
  const body=`${newsImg(c.tone!=='g',c.cat)}${chips([chip(ico,cn,'','tag'),chip(c.tone==='g'?'🟢':'🔴',c.tone==='g'?'ข่าวดี · ราคาขึ้น':'ข่าวร้าย · ราคาลง','',c.tone==='g'?'gain':'cost')])}
   <div class="mnl">${ch.map(x=>`<div class="ln"><span>${x.a.n}${SYMH(x.a)}</span><span class="num ${x.pct>0?'pos':'neg'}">${x.pct>0?'+':''}${x.pct}% → ${fmtP(x.a,x.np)}</span></div>`).join('')||'<p class="muted">สินทรัพย์ในข่าวยังไม่เข้าตลาด</p>'}</div>
   <h4 style="margin:10px 0 4px;font-size:13px">ผลกระทบต่อผู้เล่นทุกคน</h4>
   <div class="mnl">${rows.map(r=>`<div class="ln"><span>${esc(r.q.name)}</span><span class="num ${r.dv+(c.cash||0)>0?'pos':r.dv+(c.cash||0)<0?'neg':'muted'}">${r.dv?`พอร์ต ${r.dv>0?'+':'−'}${B(Math.abs(r.dv)).replace('−','')}`:'ไม่ได้ถือ'}${c.cash?` · เงินสด ${c.cash>0?'+':'−'}${B(Math.abs(c.cash))}`:''}</span></div>`).join('')}</div>
   ${c.cash?`<p class="muted" style="font-size:12px">${c.cnote} ${B(Math.abs(c.cash))}</p>`:''}<p class="muted" style="font-size:12px">ราคาใหม่ติดไปกับราคาจริงในเดือนต่อ ๆ ไป · ซื้อขายได้ที่แท็บเทรด/ธนาคารในเทิร์นของคุณ</p>`;
  await choose({actor:p,kind:'news',title:c.t,body,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});
}

/* ===================== ภัยพิบัติ (กองชีวิต) =====================
   สุ่มความรุนแรง sev 1–3 (เล็ก 50% · ปานกลาง 35% · รุนแรง 15%) และจำนวนรอบ · ผลต่อเนื่องคิดทุกจบรอบ (ทุกคนเล่นครบ 1 เทิร์น)
   อสังหาฯ = ที่ดินบนกระดานที่ถือ (ราคา × (1+ระดับอัปเกรด)) + การ์ดอสังหาฯ (ty re) · ธุรกิจตามหมวดจับจากชื่อ
   ห้ามซ้อน: เปิดได้ใบใหม่ระหว่างที่ยังมีภัยพิบัติ → ใบนั้นไปใต้กองชีวิต แล้วเปิดใบถัดไปอัตโนมัติ (pickPile) */
const DIS_SEC={food:/อาหาร|ซีฟู้ด|กาแฟ|ของชำ|ตลาดนัด|โรงสี|ของฝาก/,build:/ก่อสร้าง|รับเหมา|วัสดุ|ช่าง/,trans:/ขนส่ง|รถบรรทุก|ท่าเรือ|เรือนำเที่ยว|ปั๊มน้ำมัน|คาร์แคร์|โกดัง/,pharma:/คลินิก|ยา|โรงพยาบาล|สุขภาพ/,it:/ออนไลน์|มือถือ|ฟรีแลนซ์|ไอที|โคเวิร์กกิ้ง|ดิจิทัล/};
const DIS_STK={food:['KO','SOY','CORN','WHEAT','COFFEE'],build:['COPPER','ALU'],trans:['GROW'],pharma:[],it:['TTEC','NVDA','MSFT','GOOGL','AMZN','META','AVGO']};
const DIS_SN={food:'อาหาร',build:'ก่อสร้าง',trans:'ขนส่ง',pharma:'ยา/สุขภาพ',it:'ไอที'};
const DIS={
 quake:{ico:'🏚️',n:'แผ่นดินไหว',dur:[1,2],rep:.02,good:['food','build'],bad:[],stkG:4,stkB:0,biz:.2,bizB:0,all:0,hp:0,heart:0,
  d:'อาคารเสียหาย ผู้ถือครองอสังหาฯ ต้องจ่ายค่าซ่อมทุกรอบ · ธุรกิจร้านอาหารและก่อสร้างได้งานเพิ่ม'},
 flood:{ico:'🌊',n:'น้ำท่วม',dur:[2,4],rep:.015,good:['food','build'],bad:['trans'],stkG:3,stkB:4,biz:.15,bizB:.25,all:1000,hp:0,heart:0,
  d:'น้ำท่วมอสังหาฯ ต้องจ่ายค่าซ่อมทุกรอบ · ขนส่งติดขัด · ทุกคนเสียค่าใช้จ่ายรับมือน้ำท่วม · อาหารและก่อสร้างได้ประโยชน์'},
 plague:{ico:'🦠',n:'โรคระบาด',dur:[2,5],rep:0,good:['pharma','trans','food','it'],bad:[],stkG:3,stkB:0,biz:.15,bizB:0,all:0,hp:.02,heart:1,
  d:'ทุกคนต้องจ่ายค่าดูแลสุขภาพและ ❤ −1 ทุกรอบ · ยา ขนส่ง อาหาร และไอทีได้ประโยชน์'},
};
const LIFE_DIS=[{t:'ภัยพิบัติ: แผ่นดินไหว',dis:'quake',sp:'dis'},{t:'ภัยพิบัติ: น้ำท่วม',dis:'flood',sp:'dis'},{t:'ภัยพิบัติ: โรคระบาด',dis:'plague',sp:'dis'}];
const r100=n=>Math.round(n/100)*100;
const SEVN=['','เล็ก','ปานกลาง','รุนแรง'];
const disOn=()=>!!(S&&S.dis&&S.dis.left>0);
const disRI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function disSecOf(n){return Object.keys(DIS_SEC).filter(k=>DIS_SEC[k].test(n||''))}
/* อสังหาฯ ของผู้เล่น: [{n,v}] */
function disRE(p){const o=[];for(const k in S.props){const pr=S.props[k];if(pr.o!==p.id)continue;const q=SQ(k);o.push({n:q.n,v:q.down*(1+(pr.l||0))})}for(const d of p.deals||[])if(d.ty==='re')o.push({n:d.t,v:d.cost});return o}
/* ธุรกิจที่เข้าหมวด: [{n,cf,sec[]}] — ที่ดินบนกระดาน (ค่าเช่า/เดือน) + การ์ดธุรกิจ (Passive+Active) */
function disBiz(p){const o=[];for(const k in S.props){const pr=S.props[k];if(pr.o!==p.id)continue;const q=SQ(k),sec=disSecOf(q.n);if(sec.length)o.push({n:q.n,cf:propCf(k),sec})}for(const d of p.deals||[]){const sec=disSecOf(d.t);if(sec.length)o.push({n:d.t,cf:(+d.cf||0)+(+d.act||0),sec})}return o}
/* ผลต่อผู้เล่น 1 รอบ: {rep,biz,all,hp,heart,lines[]} (ยังไม่หักเงิน) */
function disTick(p,D){const T=DIS[D.k],sv=D.sev,L=[];let rep=0,biz=0,all=0,hp=0;
  if(T.rep)for(const r of disRE(p)){const c=r100(r.v*T.rep*sv*(.5+Math.random()));if(c>0){rep+=c;L.push(`ซ่อม ${r.n} −${B(c)}`)}}
  for(const b of disBiz(p)){let pct=0;if(b.sec.some(x=>T.good.includes(x)))pct+=T.biz*sv;if(b.sec.some(x=>T.bad.includes(x)))pct-=T.bizB*sv;const v=r100(b.cf*pct);if(v){biz+=v;L.push(`${b.n} ${v>0?'+':'−'}${B(Math.abs(v))}`)}}
  if(T.all){all=r100(T.all*sv*(.5+Math.random()));L.push(`ค่ารับมือ${T.n} −${B(all)}`)}
  if(T.hp){hp=Math.max(1000,r100(p.salary*T.hp*sv));L.push(`ค่าดูแลสุขภาพ −${B(hp)}`)}
  return {rep,biz,all,hp,heart:T.heart,lines:L}}
function disApply(p,D,tag){const T=DIS[D.k],r=disTick(p,D),net=r.biz-r.rep-r.all-r.hp;
  if(r.biz>0)p.cash+=r.biz;const cost=r.rep+r.all+r.hp+(r.biz<0?-r.biz:0);if(cost>0)pay(p,cost);
  let sx='';if(r.heart)sx=adj(p,{h:-r.heart},true);
  if(net||sx){ledg(p,T.ico,`${T.n}${tag?` (${tag})`:''}`,{c:net,h:-(r.heart||0)});log(`${T.ico} ${esc(p.name)} ${T.n}${tag?` ${tag}`:''}: ${r.lines.join(' · ')||'ไม่กระทบ'}${sx}`);
    ruleNote(p,`${T.ico} ${T.n} ${SEVN[D.sev]}${tag?` · ${tag}`:''}`,`${r.lines.join(' · ')}${sx} · รวม ${net>=0?'+':'−'}${B(Math.abs(net))} · เหลืออีก ${D.left} รอบ`)}
  return net}
/* แจ้งเตือนบนจอ (ทุกคนเห็น แม้บอทเป็นคนเปิด) · ok=true = สิ้นสุด */
function disFx(T,txt,ok){if(RM||(S&&S.autoPilot))return;const e=document.createElement('div');e.className='fxb '+(ok?'disok':'dis');e.innerHTML=`<div>${ok?'✅':T.ico} ${txt}</div>`;$('#fx').appendChild(e);setTimeout(()=>e.remove(),2600)}
/* รายการผล (ใช้ทั้งตอนเปิดการ์ดและแตะแถบแจ้งเตือน) */
function disLines(T,sev){const goodS=T.good.map(g=>DIS_SN[g]).join(' · '),badS=T.bad.map(g=>DIS_SN[g]).join(' · ');
  return `<div class="mnl">${T.rep?`<div class="ln"><span>🏚️ ค่าซ่อมอสังหาฯ</span><span class="num neg">${+(T.rep*sev*100).toFixed(1)}% ของมูลค่า/รอบ (สุ่ม ±50%)</span></div>`:''}
   ${T.all?`<div class="ln"><span>💸 ทุกคนจ่าย</span><span class="num neg">≈${B(T.all*sev)}/รอบ</span></div>`:''}
   ${T.hp?`<div class="ln"><span>🏥 ค่าดูแลสุขภาพทุกคน</span><span class="num neg">${T.hp*sev*100}% เงินเดือน/รอบ (ขั้นต่ำ ${B(1000)})</span></div>`:''}
   <div class="ln"><span>💼 วันเงินเดือน ทุกคน</span><span class="num neg">ไม่ได้รายได้ Active (เงินเดือน + รายได้เสริม) ได้แค่ Passive − รายจ่าย</span></div>
   ${T.heart?`<div class="ln"><span>❤ ทุกคน</span><span class="num neg">−${T.heart}/รอบ</span></div>`:''}
   <div class="ln"><span>🟢 ธุรกิจได้ประโยชน์ (${goodS})</span><span class="num pos">+${Math.round(T.biz*sev*100)}% ของรายได้/รอบ</span></div>
   ${T.bad.length?`<div class="ln"><span>🔴 ธุรกิจเสียหาย (${badS})</span><span class="num neg">−${Math.round(T.bizB*sev*100)}% ของรายได้/รอบ</span></div>`:''}</div>`}
/* แตะแถบภัยพิบัติบนแผนที่ */
function disInfo(){if(!disOn()||MODAL)return;const D=S.dis,T=DIS[D.k],by=S.players.find(q=>q.id===D.by);
  ask({kind:'life',noflip:true,title:`${T.ico} ภัยพิบัติ: ${T.n} ระดับ${SEVN[D.sev]}`,body:`${chips([chip('⏱',`เหลือ ${D.left} รอบ`,`จาก ${D.n} รอบ`,'use')])}<p>${T.d}</p>${disLines(T,D.sev)}<p class="muted" style="font-size:12px">${by?`${esc(by.name)} เป็นคนเปิดการ์ด · `:''}ผลต่อเนื่องคิดทุกจบรอบ · ภัยพิบัติเกิดได้ทีละ 1 อย่าง</p>`,opts:[{v:'ok',l:'ปิด',c:'pri'}]})}
/* จบรอบ: คิดผลต่อเนื่องให้ทุกคน แล้วนับถอยหลัง */
function disRound(){if(!disOn())return;const D=S.dis,T=DIS[D.k];D.left--;
  for(const q of S.players)disApply(q,D,`รอบ ${D.n-D.left}/${D.n}`);
  const e={};for(const g of T.good)for(const s of DIS_STK[g])e[s]=+(1*D.sev).toFixed(1);for(const b of T.bad)for(const s of DIS_STK[b])e[s]=-(1*D.sev);if(Object.keys(e).length)shockPrices(e);
  if(D.left<=0){log(`${T.ico} ${T.n}สิ้นสุดแล้ว`);S.dis=null;disFx(T,`${T.n}สิ้นสุดแล้ว · กลับมาได้รายได้ Active ตามปกติ`,true);for(const q of S.players)ruleNote(q,`✅ ${T.n}สิ้นสุดแล้ว`,'วันเงินเดือนได้รายได้ Active (เงินเดือน + รายได้เสริม) ตามปกติ');render()}}
async function disCard(p,c){
  const k=c.dis,T=DIS[k],w=Math.random(),sev=w<.5?1:w<.85?2:3,n=disRI(T.dur[0],T.dur[1]);
  S.dis={k,sev,n,left:n,by:p.id};S.disN=(S.disN||0)+1;
  /* ราคาหุ้น/สินค้าตามหมวด (ทันที) */
  const e={};for(const g of T.good)for(const s of DIS_STK[g])e[s]=disRI(T.stkG,T.stkG*2)*sev/2;for(const b of T.bad)for(const s of DIS_STK[b])e[s]=-disRI(T.stkB,T.stkB*2)*sev/2;
  for(const s in e)e[s]=Math.round(e[s]*10)/10;const ch=shockPrices(e);
  const rows=S.players.map(q=>{const r=disTick(q,{k,sev});let dv=0;for(const x of ch){const h=q.stocks[x.s];if(h&&h.q)dv+=h.q*(x.np-x.old)}return {q,r,dv:Math.round(dv),est:r.biz-r.rep-r.all-r.hp}});
  log(`${T.ico} ${esc(p.name)} เปิดการ์ดภัยพิบัติ: <b>${T.n}ระดับ${SEVN[sev]}</b> นาน ${n} รอบ · ${ch.map(x=>`${SN(x.a)} ${x.pct>0?'+':''}${x.pct}%`).join(' ')}`);
  render();
  disFx(T,`ภัยพิบัติ! ${T.n}ระดับ${SEVN[sev]} · ${n} รอบ`);
  const body=`${chips([chip(T.ico,T.n,`ระดับ${SEVN[sev]}`,'cost'),chip('⏱',`${n} รอบ`,'ผลต่อเนื่องทุกจบรอบ','use')])}
   <p>${T.d}</p>
   ${disLines(T,sev)}
   <h4 style="margin:10px 0 4px;font-size:13px">ราคาหุ้น/สินค้าตามหมวด</h4>
   <div class="mnl">${ch.map(x=>`<div class="ln"><span>${x.a.n}${SYMH(x.a)}</span><span class="num ${x.pct>0?'pos':'neg'}">${x.pct>0?'+':''}${x.pct}% → ${fmtP(x.a,x.np)}</span></div>`).join('')||'<p class="muted">—</p>'}</div>
   ${T.good.includes('pharma')?'<p class="muted" style="font-size:12px">ในเกมยังไม่มีหุ้นกลุ่มยา ผลดีหมวดยาจึงได้เฉพาะธุรกิจ เช่น คลินิกเอกชน</p>':''}
   <h4 style="margin:10px 0 4px;font-size:13px">ผลต่อผู้เล่นแต่ละคน (ประมาณ/รอบ)</h4>
   <div class="mnl">${rows.map(x=>`<div class="ln"><span>${esc(x.q.name)}</span><span class="num ${x.est>0?'pos':x.est<0?'neg':'muted'}">${x.est?`${x.est>0?'+':'−'}${B(Math.abs(x.est))}/รอบ`:'ไม่กระทบ'}${x.dv?` · พอร์ต ${x.dv>0?'+':'−'}${B(Math.abs(x.dv))}`:''}${T.heart?` · ❤−${T.heart}`:''}</span></div>`).join('')}</div>
   <p class="muted" style="font-size:12px">ภัยพิบัติเกิดได้ทีละ 1 อย่าง · ระหว่างนี้ถ้าเปิดได้การ์ดภัยพิบัติอีก ระบบจะสอดไว้ใต้กองแล้วเปิดใบใหม่ให้อัตโนมัติ</p>`;
  /* บอทเปิด: ยังต้องโชว์ให้ผู้เล่นคนเห็น (ปกติป๊อปอัปของบอทข้ามไปเงียบๆ) */
  if(p.bot&&!S.autoPilot&&S.players.some(q=>!q.bot))await ask({kind:'life',title:`${T.ico} ภัยพิบัติ: ${T.n}`,body:`<p><b>${esc(p.name)}</b> เปิดได้การ์ดภัยพิบัติ</p>${body}`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}]});
  else await choose({actor:p,kind:'life',title:`${T.ico} ภัยพิบัติ: ${T.n}`,body,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});
  ruleNote(p,`${T.ico} ${T.n}ระดับ${SEVN[sev]} ${n} รอบ`,`ผลต่อเนื่องคิดทุกจบรอบ (ค่าซ่อม/ค่าใช้จ่าย/รายได้ธุรกิจตามหมวด)${T.heart?` · ❤ −${T.heart} ทุกรอบ`:''}`);
}

/* ===================== CARDS ===================== */
const KIDMAX=4;
/* กล่องครอบครัวในงบการเงิน: จำนวนลูก ค่าเลี้ยงดูรวม และผลของลูก (เวลา −1/คน/เดือน · ธุรกิจ +5%/คน · ลดหัวใจที่ต้องใช้) */
const KID_IC=['👦','👧','🧒','👶'];
function kidBox(q){const n=q.kids||0,tot=n*q.kidCost;
  const slots=Array.from({length:KIDMAX},(_,i)=>i<n?`<span class="kid" title="ลูกคนที่ ${i+1}">${KID_IC[i%KID_IC.length]}</span>`:`<span class="kid e" title="ยังว่าง">＋</span>`).join('');
  return `<section class="fcard kidc"><h3>👨‍👩‍👧‍👦 ครอบครัว <span class="num">ลูก ${n}/${KIDMAX} คน</span></h3>
   <div class="kids">${slots}</div>

function addHold(p,s,q,cost){const h=p.stocks[s]||(p.stocks[s]={q:0,c:0});h.q+=q;h.c+=cost}
function commission(p,v){return S.freeComm||skHas(p,'stock')?0:Math.round(v*.01)}
async function trade(s,dir,lots){
  if(!canAct())return;const p=cp(),a=AS(s),pr=S.prices[s],unit=UNIT(a),hd=p.stocks[s];
  let q=LOT(a)*lots;
  if(dir<0){if(!hd||!hd.q){toast('ยังไม่มีให้ขาย');return}q=Math.min(q,hd.q)}
  const v=pr*q,fee=commission(p,v),prS=a.k==='com'?B(pr):'฿'+pr.toFixed(2);
  const row=(k,val,cls='')=>`<b>${k}</b><span class="num ${cls}">${val}</span>`;
  let body=`<div class="kv">${row('สินทรัพย์',AN(a))}${row('ราคาตอนนี้',`${prS} ต่อ${unit}`)}${row('จำนวน',`${q.toLocaleString()} ${unit}`)}${row('มูลค่า',B(v))}${row('ค่าคอม',fee?B(fee):'ฟรี',fee?'neg':'')}`;
  let opts;
  if(dir>0){
    const total=v+fee,after=p.cash-total,L=Math.ceil(Math.max(0,-after)/1000)*1000;
    const nq=(hd?hd.q:0)+q,nc=(hd?hd.c:0)+total;
    body+=`${row('รวมจ่าย',B(total),'neg')}${row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(after)}`,after<0?'neg':'')}${row('ถือหลังซื้อ',`${nq.toLocaleString()} ${unit} · ทุนเฉลี่ย ${fmtAvg(a,nc/nq)}`)}${a.div?row('ปันผลต่อเดือน (หลังซื้อ)','+'+B(nq*a.div*(1+skV(p,'stock')/100)),'pos'):''}</div>`;
    if(after<0)body+=`<p class="lack">เงินสดขาด ${B(-after)} · กดกู้เพื่อซื้อได้ (ดอกเบี้ย ${LOAN_TXT} ต่อเดือน)</p>`;
    opts=[after<0?{v:'loan',l:`กู้ ${B(L)} แล้วซื้อ`,c:'pri'}:{v:'ok',l:`ยืนยันซื้อ ${B(total)}`,c:'pri'},{v:'no',l:'ยกเลิก'}];
    const r=await choose({title:`ซื้อ ${a.n}`,body,opts});
    if(r==='no')return;
    if(r==='loan'){p.loan+=L;p.cash+=L;log(`🏦 ${esc(p.name)} กู้ ${B(L)} เพื่อซื้อ${a.n}`)}
    p.cash-=total;addHold(p,s,q,total);log(`${esc(p.name)} ซื้อ ${a.n} ${q.toLocaleString()} ${unit} @ ${prS} รวม ${B(total)}`);
  }else{
    const avg=hd.c/hd.q,cost=avg*q,get=v-fee,pl=get-cost;
    body+=`${row('ได้รับสุทธิ',B(get))}${row('ทุนเฉลี่ย',`${fmtAvg(a,avg)} ต่อ${unit}`)}${row('ทุนของส่วนที่ขาย',B(cost))}${row('กำไร/ขาดทุน',`${pl>=0?'+':'−'}${B(Math.abs(pl))} (${pl>=0?'+':''}${(pl/cost*100).toFixed(1)}%)`,pl>=0?'pos':'neg')}${row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(p.cash+get)}`)}${row('เหลือถือ',`${(hd.q-q).toLocaleString()} ${unit}`)}</div>`;
    if(q<LOT(a)*lots)body+=`<p class="muted">มีอยู่ ${hd.q.toLocaleString()} ${unit} จึงขายได้เท่านี้</p>`;
    const r=await choose({title:`ขาย ${a.n}`,body,opts:[{v:'ok',l:`ยืนยันขาย ${B(get)}`,c:'pri'},{v:'no',l:'ยกเลิก'}]});
    if(r==='no')return;
    hd.q-=q;hd.c-=cost;if(!hd.q)delete p.stocks[s];p.cash+=get;if(a.k==='cry')axOf(p).cry=(axOf(p).cry||0)+pl;
    log(`${esc(p.name)} ขาย ${a.n} ${q.toLocaleString()} ${unit} @ ${prS} ได้ ${B(get)} (${pl>=0?'กำไร':'ขาดทุน'} ${B(Math.abs(pl))})`);
  }
  render();save();checkWin();
}
function loan(dir){if(!canAct())return;const p=cp();if(dir>0){p.loan+=10000;p.cash+=10000}else{if(p.loan<10000||p.cash<10000){toast('ชำระไม่ได้');return}p.loan-=10000;p.cash-=10000}render();save();checkWin()}
function payDebt(k){if(!canAct())return;const p=cp(),a=p.debt[k];if(p.cash<a){toast('เงินสดไม่พอปิดหนี้');return}p.cash-=a;p.debt[k]=0;p.exp[k]=0;log(`✅ ${esc(p.name)} ปิดหนี้${{home:'บ้าน',car:'รถ',card:'บัตรเครดิต'}[k]} ${B(a)}`);render();save();checkWin()}

/* ===================== BOTS ===================== */
function botWants(p,cost,cf){
  const f=fin(p);if(cf<0)return false;
  if(p.cash-cost>=f.expenses*.5)return cf>0||Math.random()<.5;
  const L=Math.ceil(Math.max(0,cost-p.cash)/1000)*1000;
  return cf>0&&cf>L*LOAN_R*2&&f.flow>0&&p.loan+L<p.salary*6;
}
function botRoad(p,into){const f=fin(p);if(into)return p.cash>150000&&f.flow>15000&&Math.random()<.7?'go':'stay';return p.cash<80000||Math.random()<.35?'go':'stay'}
function botPile(p){const f=fin(p),r=Math.random();if(offNet(p)){if(r<.75)return 'opp';return 'life'}if(p.net.on&&r<.25)return 'net';if(!p.net.on&&r<.08)return 'net';if(p.skills.length<4&&p.cash>f.expenses*1.5&&r<.3)return 'learn';if(r<.75)return 'opp';return 'life'}
async function botInvest(p){
  if(p.st.t<=2&&!p.hired&&p.cash>HIRE_COST+fin(p).expenses*1.5)await hireHelp(p);
  const f=fin(p),res=f.expenses;
  while(p.loan>=10000&&p.cash-10000>res*1.5){p.loan-=10000;p.cash-=10000}
  for(const k of msnIs(p,'debtfree')?['card','car','home']:['card','car'])if(p.debt[k]>0&&p.cash-p.debt[k]>res*1.5){p.cash-=p.debt[k];p.debt[k]=0;p.exp[k]=0;log(`✅ ${esc(p.name)} ปิดหนี้${k==='card'?'บัตรเครดิต':'รถ'}`)}
  for(const a of ASSETS){const h=p.stocks[a.s];if(h&&h.q&&!a.div&&S.prices[a.s]*h.q>h.c*1.25){const v=S.prices[a.s]*h.q;p.cash+=v-commission(p,v);log(`${esc(p.name)} ขายทำกำไร ${a.n} ${B(v)}`);delete p.stocks[a.s]}}
  const surplus=p.cash-res*2;
  if(surplus>20000){const best=ASSETS.filter(a=>a.div).sort((x,y)=>y.div/S.prices[y.s]-x.div/S.prices[x.s])[0];
    const lots=Math.floor(surplus*.5/(S.prices[best.s]*1000));if(lots>0){const v=lots*1000*S.prices[best.s],fee=commission(p,v);p.cash-=v+fee;addHold(p,best.s,lots*1000,v+fee);log(`${esc(p.name)} ซื้อหุ้นปันผล ${best.n} ${(lots*1000).toLocaleString()} หุ้น`)}}
  save();
}

const _tpl=document.createElement('template');
function setBoard(bd,html){_tpl.innerHTML=html;const nw=_tpl.content.children,wk=bd.querySelector(':scope>.walker'),old=[...bd.children].filter(c=>c!==wk);
  if(old.length!==nw.length){bd.innerHTML=html;if(wk)bd.appendChild(wk);return}

function passiveDetail(p,k){const s=SKILLDB[k];if(!s)return '';const v=s.val;
  if(s.eff==='rent'){let b=0;for(const kk in S.props)if(S.props[kk].o===p.id){const pr=S.props[kk],q=SQ(kk);b+=(q.cf+pr.l*q.upcf)*(fullZone(p.id,q.z)?1.5:1)*v/100}for(const d of p.deals)if(d.ty==='re')b+=d.cf*v/100;return `ตอนนี้ช่วยเพิ่มค่าเช่า +${B(b)} ต่อเดือน`}
  if(s.eff==='biz'){let b=0;for(const d of p.deals)if(d.ty==='biz')b+=d.cf*v/100;return `ตอนนี้ช่วยเพิ่มกำไรธุรกิจ +${B(b)} ต่อเดือน`}
  if(s.eff==='stock'){let b=0;for(const a of ASSETS){const hd=p.stocks[a.s];if(hd&&hd.q&&a.div)b+=hd.q*a.div*v/100}return `ปันผลเพิ่ม +${B(b)} ต่อเดือน · ซื้อขายหุ้นไม่เสียค่าคอม`}
  if(s.eff==='tax')return `ประหยัดภาษี ${B(p.exp.tax*v/100)} ต่อเดือน`;
  if(s.eff==='buy')return 'ราคาอสังหาฯ และดีลที่เห็นในการ์ดหักส่วนลดให้แล้ว';
  if(s.eff==='net')return 'คิดเพิ่มให้ทุกครั้งที่ทำการ์ดสร้างธุรกิจในกองธุรกิจเครือข่าย';
  if(s.eff==='scam')return 'การ์ดหลอกลวงจะขึ้นคำเตือน และไม่เสียเงินกับคอร์สหลอกลวง';

  if(s.eff==='net_focus'){const f=(p.net.focus||[]);return f.length?`โฟกัสอยู่: สาย ${f.join(', ')}`:'ยังไม่ได้ติ๊กสายงาน (ติ๊กที่แท็บธุรกิจเครือข่าย › ธุรกิจ A)'}
  return ''}

function spark(arr){const w=64,h=20,mn=Math.min(...arr),mx=Math.max(...arr),sp=mx-mn||1;const pts=arr.map((v,i)=>`${(i/(Math.max(1,arr.length-1)))*w},${h-2-((v-mn)/sp)*(h-4)}`).join(' ');const up=arr[arr.length-1]>=arr[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'var(--good)':'var(--bad)'}" stroke-width="1.5"/></svg>`}

/* แถวสินทรัพย์ในตาราง (ใช้ร่วม: ตลาดหุ้นและสินค้า / กองทุนในแท็บธนาคาร) acc สะสมทุน-มูลค่าพอร์ต */
const MICO=a=>a.k==='cry'?`<span class="mico cico" style="--cc:${a.c}" aria-hidden="true">${a.g}</span>`:`<img class="mico" src="img/${ICO(a)}.webp" alt="">`;
const ICO=a=>a.k==='fund'?(a.s==='MMF'||a.s==='BOND'?'as-saving':a.s==='GOLDF'?'as-gold':'as-stock'):a.k==='stock'?'as-stock':a.s==='GOLD'?'as-gold':a.k==='cry'?'as-crypto':a.s==='OIL'||a.s==='NGAS'?'as-oil':['SOY','CORN','WHEAT'].includes(a.s)?'as-rice':['COPPER','ALU'].includes(a.s)?'as-steel':a.s==='STEEL'?'as-steel':'as-commod';
function cryTag(a){if(!cryLive(a,S))return `<span class="mk neg">ยังไม่เข้าตลาด · อีก ${cryFrom(a.s)-cryIdx()} รอบ</span>`;const b=(S.cryBase||{})[a.s];if(!b)return '';const x=S.prices[a.s]/b;return `<span class="mk ${x>=1?'pos':'neg'}" title="เทียบราคาตอนเริ่มเกม/เข้าตลาด">ตั้งแต่เริ่ม ${x>=10?'×'+Math.round(x).toLocaleString():x>=1.995?'×'+x.toFixed(1):(x>=1?'+':'−')+Math.abs(Math.round((x-1)*100))+'%'}</span>`}
function mrow(a,p,dis,acc){
  const pr=S.prices[a.s],hs=S.hist[a.s],prev=hs.length>1?hs[hs.length-2]:pr,ch=(pr-prev)/prev*100,h=p.stocks[a.s];

  return `<div class="mi"><div class="mi1 tap" role="button" tabindex="0" aria-label="ซื้อขาย ${a.n}" onclick="tradeDlg('${a.s}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tradeDlg('${a.s}')}">${MICO(a)}<div class="mname">${a.k==='stock'?`<b>${esc(a.n)}</b>`:`<b>${a.s}</b><span class="muted">${a.n}</span>`}</div>${spark(hs)}<div class="mprice"><b class="num">${fmtP(a,pr)}</b><span class="num ${ch>=0?'pos':'neg'}">${ch>=0?'+':''}${ch.toFixed(1)}%</span></div><span class="mgo" aria-hidden="true">›</span></div>
    <div class="mi2"><div class="mtags">${a.risk?`<span class="mk">เสี่ยง${RISK[a.risk]}</span>`:''}${a.k==='cry'?cryTag(a):''}${a.div?`<span class="mk">ปันผล ฿${a.k==='fund'?a.div.toFixed(2):a.div.toFixed(1)}/${UNIT(a)}</span>`:''}<span class="mk">ถือ ${h&&h.q?h.q.toLocaleString():0}</span>${pl}</div></div></div>`;
}
/* แท็บย่อยในเทรด: หุ้น / คริปโต / สินค้าโภคภัณฑ์ (จำแท็บล่าสุดไว้) · ตัวเลขบนแท็บ = จำนวนตัวที่ถือ */
const MKT_KS=[['stock','หุ้น','as-stock'],['cry','คริปโต','as-crypto'],['com','สินค้าโภคภัณฑ์','as-commod']];let MKT_K='stock';
