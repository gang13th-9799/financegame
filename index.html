<!DOCTYPE html>
<html lang="th">
<head>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>เกมอิสรภาพทางการเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Storybook countryside: warm paper, sky and meadow, sun-gold accents, dirt-path roads (single light world) */
  --bg:#f7f1e1; --surface:#fffdf6; --surface2:#f4ecd8; --ink:#3f3a2c; --muted:#837b66; --line:#e5d9bb;
  --accent:#5f9e57; --accent-ink:#ffffff; --gold:#e3a63a; --bad:#d0644d; --good:#4e8f45;
  --capital:#eaf1fb; --road:#a48f6a; --sky:#cfe9f5; --meadow:#a9d18e;
  --display:"Mali", "IBM Plex Sans Thai Looped", system-ui, sans-serif;
  --body:"IBM Plex Sans Thai Looped", "Mali", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font-family:var(--body);font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
select,input{font-family:var(--body);font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px}
header .round{color:var(--muted);font-size:13px}
header .sp{flex:1}
.layout{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 16px 40px;max-width:1280px;margin:0 auto}
@media (min-width:1020px){.layout{grid-template-columns:minmax(560px,760px) 1fr;align-items:start}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Board */
.board{display:grid;--sep:clamp(6px,1.6vw,12px);grid-template-columns:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr);gap:2px;aspect-ratio:1;width:100%;max-width:760px;margin:0 auto}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;padding:1px 2px;display:flex;flex-direction:column;font-size:clamp(6.5px,1.45vw,10px);line-height:1.1;cursor:pointer;min-width:0}
.cell .stripe{height:4px;margin:-1px -2px 1px;flex:none}
.cell .lbl{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.cell .sub{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.corner{background:var(--surface2)}
.cell.inner{background:var(--capital)}
.cell.road{background:var(--road);color:#f2f2f2}
.cell.road .sub{color:#d6d6d6}
.cell .own{position:absolute;left:0;right:0;bottom:0;height:4px}
.cell .lv{position:absolute;right:2px;top:7px;font-size:.9em;color:var(--gold);font-weight:700}
.cell .toks{position:absolute;left:2px;bottom:6px;display:flex;flex-wrap:wrap;gap:1px;max-width:100%}
.tok{width:clamp(7px,1.8vw,11px);height:clamp(7px,1.8vw,11px);border-radius:50%;border:1.5px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cell.here{outline:2px solid var(--accent);outline-offset:-2px}
.center{grid-column:4/11;grid-row:4/11;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(6px,1.6vw,14px);display:flex;flex-direction:column;gap:clamp(4px,1.2vw,10px);justify-content:safe center;align-items:center;text-align:center;overflow:auto}
.center .who{font-family:var(--display);font-size:clamp(14px,3.4vw,20px);font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center}
.center .job{color:var(--muted);font-size:clamp(11px,2.4vw,13px)}
.dice{display:flex;gap:6px}
.die{width:clamp(26px,6vw,38px);height:clamp(26px,6vw,38px);border-radius:7px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(14px,3.4vw,20px)}
.prompt{font-size:clamp(11px,2.4vw,13px);color:var(--muted);max-width:30ch}
.piles{display:flex;gap:clamp(4px,1.2vw,8px);width:100%;justify-content:center}
.pile{flex:1;max-width:120px;border-radius:9px;border:1px solid var(--line);padding:clamp(5px,1.4vw,10px) 4px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:clamp(10px,2.3vw,13px);font-weight:600}
.pile small{font-weight:400;color:var(--muted);font-size:.85em}
.pile.life{border-top:4px solid #c96a2b}
.pile.learn{border-top:4px solid #2f7fb5}
.pile.opp{border-top:4px solid var(--gold)}
.pile.netp{border-top:4px solid #2a9d8f}
.modal.k-mkt{border-top:6px solid #7a5cc2}
.mkbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.mkbox h4{margin:0;font-size:13px;font-family:var(--display)}
.mkrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.mkrow select{flex:1;min-width:0;font-size:13px}
.modal.k-netc{border-top:6px solid #2a9d8f}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* Side */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;align-items:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left}
.pc.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc.view{background:var(--surface2)}
.pc .nm{display:flex;align-items:center;gap:6px;font-weight:600}
.pc .nm .tag{font-size:11px;color:var(--muted);font-weight:400}
.pc .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{font-size:1em;margin-left:2px}
.jl{font-size:10px;font-weight:600;color:#fff;background:var(--bad);border-radius:999px;padding:1px 6px;white-space:nowrap}
.pc .chev{margin-left:auto;color:var(--muted);font-size:12px}
.pc .pctx{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.pc.mini{padding:6px 10px;gap:4px}
.pc.mini .pctx+.chev{margin-left:4px}
.pc.mini .bar{height:5px}
.netlock{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.netlock h3{font-size:16px}
.layout>section{min-width:0}
.skp{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface)}
.skp.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.2)}
.skchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.skc{display:inline-flex;flex-direction:column;border-radius:10px;padding:4px 9px;font-size:12px;border:1.5px solid}
.skc small{font-size:11px;opacity:.8}
.skc.ps{background:#eef6e6;border-color:#cfe3bf;color:#36612d}
.skc.ac{background:#fff1d6;border-color:#f0cf87;color:#7a5200}
.ft .tok,.skp .tok{width:12px;height:12px}
.ft td:last-child{white-space:nowrap}
.skc.mini{display:inline-block;padding:1px 8px;font-size:11px}
.fin{display:flex;flex-direction:column;gap:12px;container-type:inline-size}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.fhead .meters{flex:0 1 300px}
#endbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,250,240,.96);border-top:2px solid #f0c9a6;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#endbar[hidden]{display:none}
.ebi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
#ebtxt{flex:1;font-size:13px;line-height:1.3}
#endbar .endbtn{width:auto;flex:none;margin:0;min-width:170px;min-height:52px}
body.hasend{padding-bottom:80px}
.endbtn{display:block;width:100%;max-width:260px;margin:6px auto;padding:10px 16px;font-size:17px;font-weight:800;border-radius:16px;background:linear-gradient(180deg,#ff9f5a,#e8692a);color:#fff;border:2px solid #c4521c;box-shadow:0 4px 0 #a8461a;letter-spacing:.3px}
.endbtn:hover:not(:disabled){filter:brightness(1.05)}.endbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #a8461a}
.tline{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.endbtn.mini{display:inline-block;width:auto;margin:0;padding:6px 14px;font-size:14px;box-shadow:0 2px 0 #a8461a}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 12px}.hero-logo{font-size:64px;animation:heroIn .9s cubic-bezier(.2,1.6,.4,1) both}.hero-t{font-family:var(--display);font-size:22px;font-weight:800;color:#be1e2d}@keyframes heroIn{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}

.tok.pic{background-image:var(--img,radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%))!important;background-size:cover;background-position:center;border:2px solid var(--pc,#fff)!important;width:clamp(13px,3.4vw,20px);height:clamp(13px,3.4vw,20px)}
.cell .tok.pic{box-shadow:0 0 0 1px #fff,0 2px 3px rgba(0,0,0,.35)}
.cell .tok.pic.cur{box-shadow:0 0 0 2px #ffb627,0 3px 5px rgba(0,0,0,.35)}
.tok.pic.big{width:30px;height:30px;border-width:3px!important}
.cell .zimg{position:absolute;right:-6%;bottom:-6%;width:72%;opacity:.55;pointer-events:none}
.cell.zoned .lbl{position:relative;z-index:1;text-shadow:0 0 3px #fffdf6,0 0 3px #fffdf6}
.cellpic{display:block;width:150px;margin:-4px auto 6px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.pimg{width:100%;max-width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.2);margin-bottom:3px}
.pile{padding-top:6px!important}
.pawn{height:64px;vertical-align:bottom}.pawn.sm{height:40px;margin-right:4px;vertical-align:middle}
.center{background:linear-gradient(rgba(255,252,242,.7),rgba(255,252,242,.82)),url(img/center.webp) center/cover!important}
.center::before{display:none}
.posefig{position:absolute;right:8px;top:4px;height:112px;z-index:12;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:poseIn .5s cubic-bezier(.2,1.6,.4,1) .35s both}.modal.haspose .mh{padding-right:88px;min-height:118px}.npcwrap{position:absolute;right:4px;top:2px;width:86px;z-index:12;pointer-events:none}.npcwrap .posefig{position:static;display:block;margin:0 auto;height:108px}.npcname{display:block;text-align:center;font-size:8.5px;font-weight:700;color:#fff;background:#be1e2d;border-radius:6px;padding:1px 3px;margin-top:-4px;white-space:nowrap}@keyframes poseIn{0%{transform:translateY(30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.pile.deck{background:none!important;border:none!important;box-shadow:none!important;padding:0 6px 8px 0!important;position:relative;flex:0 1 70px;max-width:70px;display:block}
.pile.deck .pimg{position:relative;z-index:3;display:block;width:100%;max-width:none;aspect-ratio:2/3;object-fit:cover;border-radius:7px;margin:0;box-shadow:0 1px 0 rgba(255,255,255,.8),0 3px 6px rgba(0,0,0,.28);transition:transform .2s}
.pile.deck::before,.pile.deck::after{content:'';position:absolute;left:0;top:0;right:6px;bottom:8px;border-radius:7px;background:var(--bk) center/cover;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.pile.deck::before{z-index:1;transform:translate(6px,7px) rotate(3deg);filter:brightness(.8)}
.pile.deck::after{z-index:2;transform:translate(3px,3.5px) rotate(1.5deg);filter:brightness(.9)}
.pile.deck:not(:disabled):hover{transform:none}.pile.deck:not(:disabled):hover .pimg{transform:translateY(-6px) rotate(-2deg)}
.pile.deck:not(:disabled):active .pimg{transform:translateY(2px) scale(.97)}
.pile.deck:disabled{opacity:.55}
.modal.k-pick{max-width:340px}
.pickwrap{display:flex;justify-content:center;perspective:900px}
.pickcard{width:min(62vw,230px);aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 0 3px #fff;animation:pickZoom .45s cubic-bezier(.2,1.4,.4,1) both,pickFloat 2.4s ease-in-out .45s infinite}
@keyframes pickZoom{0%{transform:translateY(120px) scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pickFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.8deg)}}
.mf button.hire{background:#fff4d6;border-color:#e9b949;color:#7a5200;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;padding:6px 9px 5px;border-radius:14px;background:#fff;border:2px solid #eadfc4;box-shadow:0 2px 0 #eadfc4;line-height:1.15}
.chip .ci{font-size:22px}.chip .cv{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}.chip .cs{font-size:10.5px;color:#8a8170;white-space:nowrap}
.chip.gain .cv{color:#1f9d55}.chip.gain2 .cv{color:#2a7fb8}.chip.cost .cv{color:#d64545}.chip.use .cv{color:#c2410c}.chip.ok .cv{color:#1f9d55}
.chip.tag{background:#f6f0ff;border-color:#d9c8f5;box-shadow:0 2px 0 #d9c8f5}.chip.tag .cv{font-size:13px}
.chip.bad{border-color:#e05555;background:#fff0f0;box-shadow:0 2px 0 #e05555;animation:chipShake .5s .7s 2}.chip.bad .cv,.chip.bad .cs{color:#c62828;font-weight:700}
.chip.warn{border-color:#e9b949;background:#fff8e6;box-shadow:0 2px 0 #e9b949}.chip.warn .cv{color:#d64545}.chip.warn .cs{color:#8a5a00;font-weight:700}
@keyframes chipShake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.zchip{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:#7a6f5c;margin-top:2px}.zchip img{height:28px}
.paynet{text-align:center;font-family:var(--display);font-weight:800;font-size:24px;margin:2px 0}.paynet.up{color:#1f9d55}.paynet.down{color:#d64545}.cashflow{text-align:center;font-size:15px;margin:4px 0 2px}
.pdt td{padding:4px 6px}.pdt td:first-child{white-space:nowrap;vertical-align:top}.pdt{margin-bottom:8px}
.stp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stc{background:#fff;border:2px solid var(--c);border-radius:14px;padding:8px 9px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.sth{display:flex;align-items:center;gap:5px}
.sti{font-size:20px;line-height:1}
.stn{font-weight:700;font-size:13px;color:var(--c);flex:1;white-space:nowrap;min-width:0}
.stc{min-width:0}
.stv{font-size:22px;font-weight:800;color:var(--c);line-height:1}.stv small{font-size:11px;color:#8a8a8a;font-weight:600}
.stpips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:7px 0 5px}
.stpips i{height:10px;border-radius:3px;background:#ececec}.stpips i.on{background:var(--c)}
.sthint{font-size:10.5px;color:#7a7a7a;line-height:1.3}
@media(max-width:440px){.sti{font-size:16px}.stv{font-size:19px}.stn{font-size:12px}.stc{padding:7px}}@media(max-width:360px){.sthint{display:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:linear-gradient(180deg,#fff8e4,#f6edd5);border:1.5px solid #efe0b6;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:20px}
.tile b small{font-size:13px;color:var(--muted);font-weight:500}
.tile.wide{grid-column:1/-1}
.tile em{font-style:normal}
.tile small{font-size:12px}
@container (min-width:720px){.tiles{grid-template-columns:1fr 1fr 2fr}.tile.wide{grid-column:auto}}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
@container (min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
.fcard{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface)}
.fcard h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft td{padding:5px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
.ft td.r{text-align:right;white-space:nowrap;padding-left:8px}
.ft tr.gh td{font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:none;padding-top:8px;letter-spacing:.02em}
.ft tr.th td{font-size:11.5px;color:var(--muted);border-bottom:1.5px solid var(--line)}
.ft tr.tot td{font-weight:700;border-bottom:none;border-top:1.5px solid var(--line)}
.ft .fsub{font-size:11.5px;color:var(--muted)}
.ft .lvs{color:var(--gold);font-size:11px}
.ft.at td:last-child{width:1%}
.tw{overflow-x:auto}
.nowrap{white-space:nowrap}

.mapbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 6px;max-width:760px;gap:8px}
.layout.mapmin{grid-template-columns:minmax(170px,260px) minmax(0,1fr)!important;align-items:start}
.layout.mapmin>section:first-child{position:sticky;top:8px}
.layout.mapmin .mbar{gap:8px}
.minib{display:grid;grid-template-columns:repeat(1,1fr) 4px repeat(9,1fr) 4px 1fr;grid-template-rows:repeat(1,1fr) 4px repeat(9,1fr) 4px 1fr;gap:2px;aspect-ratio:1;width:100%;padding:4px;margin-bottom:8px;border-radius:12px;background:conic-gradient(from -45deg,#8cc263 0 90deg,#9aa0b5 90deg 180deg,#5ec0cf 180deg 270deg,#f0ad5e 270deg 360deg);box-shadow:0 2px 0 var(--line)}
.minib .mcity{grid-row:3/12;grid-column:3/12;border-radius:6px;background:#dbe5f3;box-shadow:0 0 0 1.5px #fff;z-index:0}
.minib .mc{z-index:1;border:1.5px solid rgba(60,50,30,.55);border-radius:3px;box-shadow:none}
.minib .mc.me{border-color:#e3a63a}
@media (max-width:560px){.minib{gap:1px;padding:3px}.minib .mc{border-width:1px;border-radius:1px}.mc .md{width:4px;height:4px;border-width:0}.mc .md.cur{width:5px;height:5px}}
.mc{border-radius:2px;position:relative;cursor:pointer;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;min-width:0;min-height:0}
.mc.me{outline:2px solid #e3a63a;outline-offset:0;z-index:2}
.mc .mo{position:absolute;left:0;right:0;bottom:0;height:2px}
.mc .md{width:5px;height:5px;border-radius:50%;border:1px solid #fff;display:block}
.mc .md.cur{width:8px;height:8px;box-shadow:0 0 0 1.5px #e3a63a}
.layout.mapmin .mrow{flex-direction:column;align-items:stretch;gap:4px}
.layout.mapmin .mrow>*{margin:0!important}
.layout.mapmin .mrow .mdice{text-align:left}
.layout.mapmin .mact button{width:100%}
.layout.mapmin .mapbar{flex-direction:column;align-items:stretch}
@media (max-width:560px){.layout.mapmin{grid-template-columns:118px minmax(0,1fr)!important;gap:8px;padding-left:8px;padding-right:8px}.layout.mapmin .mbar{padding:6px;font-size:12px}.layout.mapmin .mrow{font-size:12px}.layout.mapmin .mact button{padding:4px 4px;font-size:11.5px}.layout.mapmin .msum{display:none}.layout.mapmin .tabs button{padding:6px 8px;font-size:12px}}
.mbar{background:var(--surface);border:2px solid var(--line);border-left:8px solid var(--zc);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;gap:4px;max-width:none;box-shadow:0 2px 0 var(--line)}
.mrow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:13px}
.mrow .mst{color:var(--muted);font-size:12px}
.mrow .timer{font-size:13px}
.mrow .mdice{margin-left:auto;font-size:12px;color:var(--muted)}
.mrow .msum{flex:1;min-width:0;font-size:12px}
.mact button{padding:4px 10px}
.mpile.life{border-color:#c96a2b}.mpile.learn{border-color:#2f7fb5}.mpile.opp{border-color:var(--gold)}.mpile.netp{border-color:#2a9d8f}
.layout.mapmin .mapbar{max-width:none}
.mm{display:grid;grid-template-columns:1fr;gap:10px;max-width:760px;margin:0 auto}
@media (min-width:640px){.mm{grid-template-columns:1fr 1fr}}
.mmloc{background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--zc);border-radius:18px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.mmloc h3{font-size:18px;margin:2px 0 4px}
.mmtag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mmbody{font-size:13px}
.mmbody p{margin:5px 0}
.center.mmc{grid-column:auto;grid-row:auto;padding:12px}
@media (max-width:520px){table.mkt th:nth-child(3),table.mkt td:nth-child(3){display:none}table.mkt td,table.mkt th{padding:5px 3px}}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;text-align:left;border-radius:16px;padding:8px 12px;width:100%}
.prow.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.25)}
.prk{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pname{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.pnums{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink)}
.ppct{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);flex:none}
.players{display:flex!important;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
@media (min-width:1020px){.players{flex-wrap:wrap;overflow:visible}}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;background:var(--surface);border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.pchip .pcn{max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pchip .pcb{width:38px;height:6px;border-radius:999px;background:#f1e8d2;overflow:hidden;display:inline-block}
.pchip .pcb i{display:block;height:100%;background:linear-gradient(90deg,#8ccf7e,#5f9e57)}
.pchip .pcb.win i{background:linear-gradient(90deg,#ffd36b,#e3a63a)}
.pchip .pcp{color:var(--muted);font-size:11.5px}
.pchip.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.25)}
.pchip.view{background:#eef6e6;border-color:var(--accent)}
.pchead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.meters{display:flex;gap:6px;flex-wrap:wrap}
.mt{display:inline-flex;align-items:center;gap:3px;font-size:11px;flex:1;min-width:52px}
.mt b{font-weight:400;font-size:11px}
.mtb{flex:1;height:5px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:20px}
.mtb i{display:block;height:100%}
.mt-h .mtb i{background:#d0457a}.mt-t .mtb i{background:#d0892b}.mt-k .mtb i{background:#2f7fb5}
.timer{font-family:var(--display);font-weight:700;font-size:clamp(13px,3vw,17px)}
.timer.low{color:var(--bad)}
.center .meters{width:min(100%,260px)}
.pc .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.win i{background:var(--gold)}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:8px 14px}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;border:1px solid var(--line);border-bottom-color:var(--surface);margin-bottom:-1px}
.panel{background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:12px}
.stmt{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.stmt{grid-template-columns:1fr 1fr}}
.box h3{font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:center}
.ln:last-child{border-bottom:none}
.ln .a{display:flex;gap:6px;align-items:center}
.goal{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal .big{font-family:var(--display);font-size:20px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.mkt{width:100%;border-collapse:collapse;font-size:13px}
.mkt th{font-weight:500;color:var(--muted);text-align:left;padding:4px;border-bottom:1px solid var(--line);font-size:12px}
.mkt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.mkt td.r,.mkt th.r{text-align:right}
.mktwrap{overflow-x:auto}
.log{max-height:360px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.muted{color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,14,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:440px;width:100%;max-height:90%;overflow:auto;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal .mh{padding:14px 16px 6px}
.modal .mh .kind{font-size:12px;color:var(--muted);letter-spacing:.02em}
.modal .mh h2{font-size:19px}
.modal .mb{padding:4px 16px 12px;font-size:14px}
.modal .mb p{margin:6px 0}
.modal .mf{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.modal .handoff{background:var(--surface2);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.modal.k-life{border-top:6px solid #c96a2b}.modal.k-learn{border-top:6px solid #2f7fb5}.modal.k-opp{border-top:6px solid var(--gold)}
.modal.k-news{border-top:6px solid #5d6b76;--cbc:#5d6b76;--cbimg:url(img/back-news.webp)}.modal.k-win{border-top:6px solid var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld label{font-size:12px;color:var(--muted)}
.setov{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;padding:0 0 40px}
.setov .sh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
.setov .sh h2{font-size:18px;margin-right:auto}
.setwrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.dbtabs{display:flex;gap:6px;flex-wrap:wrap}
.dbtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dbt{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dbt table{border-collapse:collapse;font-size:13px;min-width:100%}
.dbt th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.dbt td{padding:3px 4px;border-bottom:1px solid var(--line)}
.dbt input,.dbt select{font-size:13px;padding:4px 6px;width:100%;min-width:70px}
.dbt input.w{min-width:260px}
.dbt input[type=number]{min-width:90px;font-variant-numeric:tabular-nums}
.dbnote{font-size:12px;color:var(--muted)}
.mvbox{margin-top:12px;padding:10px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.dbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbbar input{flex:1;min-width:120px}
.dblist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.dbrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dbrow:last-child{border-bottom:none}
.dbrt{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0;font-size:13px}
.dbra{display:flex;gap:6px;align-items:center}
.dbform{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:640px}
.dbform h3{font-size:16px;margin-bottom:4px}
.dbform input,.dbform select,.dbform textarea{width:100%;font-family:var(--body);font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
.filebtn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.dbio textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%}
.toast.on{opacity:1}

/* Setup */
.setup{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.setup h2{font-size:22px;margin-bottom:4px}
.seat{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.seat input{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 10px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.rules{font-size:13px;color:var(--ink)}
.rules li{margin:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.logo{display:inline-block;width:1em;height:1em;background:var(--lc,var(--brand));-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
header h1::before{content:"";width:26px;height:26px;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
h1,h2,h3,.center .who,.die,.goal .big,.pile,.tabs button,header button,.btnrow button{font-family:var(--display)}
button{border-radius:999px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .12s, box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 0 var(--line);border-color:var(--accent)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
button.pri{background:linear-gradient(180deg,#77b56d,#5a9851);border-color:#4f8a47;box-shadow:0 3px 0 #3f7239;color:#fff}
button.pri:hover:not(:disabled){box-shadow:0 4px 0 #3f7239}
select,input,textarea{border-radius:12px;border:2px solid var(--line)}
/* board as a meadow island */
.board{background:conic-gradient(from -45deg,#8cc263 0 90deg,#9aa0b5 90deg 180deg,#5ec0cf 180deg 270deg,#f0ad5e 270deg 360deg);padding:8px;border-radius:22px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 8px 24px rgba(92,120,60,.25);gap:3px}
.cell{border-radius:9px;border:1.5px solid rgba(120,100,60,.18);box-shadow:0 2px 0 rgba(120,100,60,.18);background:var(--surface)}
.cell.corner{background:linear-gradient(180deg,#fff7df,#fbeec8)}
.cell.inner{background:linear-gradient(180deg,#f3f7ff,#e3ecfb)}
.cell.road{background:repeating-linear-gradient(90deg,#b49d74 0 8px,#a8916a 8px 16px);color:#fffaf0;border-color:#8f7a55}
.cell .stripe{height:5px;border-radius:0 0 6px 6px;margin:-1px 2px 2px}
.cell.here{outline:3px solid #f2b13b;outline-offset:-2px;box-shadow:0 0 0 3px rgba(242,177,59,.25)}
.cell .own{height:5px;border-radius:4px 4px 0 0;left:3px;right:3px}
.center{background:radial-gradient(120% 80% at 50% 0%,#fffef8,#fbf3de);border:2px solid #f0e2bd;border-radius:20px;box-shadow:0 4px 0 rgba(150,120,60,.15)}
.tok{border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.die{background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line)}
.pile{border-radius:16px;border-width:2px;background:var(--surface);box-shadow:0 3px 0 var(--line)}
.pile.life{border-top-width:6px}.pile.learn{border-top-width:6px}.pile.opp{border-top-width:6px}.pile.netp{border-top-width:6px}
.pc{border-radius:16px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);background:var(--surface)}
.pc.cur{border-color:#f2b13b;box-shadow:0 0 0 3px rgba(242,177,59,.25),0 2px 0 var(--line)}
.bar{border-radius:999px;border-width:1.5px;background:#f1e8d2}
.bar i{background:linear-gradient(90deg,#8ccf7e,#5f9e57);border-radius:999px}
.bar.win i{background:linear-gradient(90deg,#ffd36b,#e3a63a)}
.tabs{border-bottom:2px dashed var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:none}
@media (max-width:480px){.tabs button{padding:7px 10px;font-size:12.5px}header h1{font-size:18px}}
.tabs button{border-radius:14px 14px 0 0;box-shadow:none}
.tabs button.on{border:2px solid var(--line);border-bottom-color:var(--surface)}
.panel{border:2px solid var(--line);border-top:none;border-radius:0 0 18px 18px}
.goal{background:linear-gradient(180deg,#fff8e4,#f6edd5);border:1.5px solid #efe0b6;border-radius:16px}
.chip{background:#eef6e6;border-color:#cfe3bf;color:#3f6b36}
.modal{border-radius:22px;border:2px solid var(--line);background:radial-gradient(140% 70% at 50% 0%,#fffef9,#fbf4e2);box-shadow:0 18px 50px rgba(70,60,30,.28)}
.modal .mf{border-top:2px dashed var(--line)}
.ov{background:rgba(70,90,70,.35);backdrop-filter:blur(2px)}
.setup{border-radius:22px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.legend{color:#5b5444}
.legend i{border-radius:50%}
.toast{background:#4a6b3c;color:#fffdf0;box-shadow:0 4px 0 #36502c}
.jl{background:var(--bad)}
.timer.low{color:var(--bad)}
.dbrow{background:var(--surface)}
.dblist,.dbform,.dbt{border-radius:16px;border-width:2px}
.setov{background:linear-gradient(180deg,var(--sky),var(--bg) 300px)}
.setov .sh{background:rgba(255,253,246,.9);border-bottom:2px dashed var(--line)}
.cityplate{grid-row:3/12;grid-column:3/12;margin:-5px;border-radius:16px;background:linear-gradient(160deg,#d9e4f2,#c5d4ea);box-shadow:0 0 0 3px #fffdf6,0 0 0 6px #8fa9cc,0 6px 16px rgba(60,80,120,.25);z-index:0;position:relative}
.cityplate span{position:absolute;left:22%;top:-1px;transform:translate(-50%,-50%);background:#8fa9cc;color:#fff;font-family:var(--display);font-size:clamp(8px,1.6vw,11px);padding:1px 10px;border-radius:999px;white-space:nowrap}
.cell{position:relative;z-index:1}
.board::after{content:"ต่างจังหวัด";grid-row:1;grid-column:1;display:none}
.cell.zoned{background:color-mix(in srgb,var(--zc) 30%,#fffdf6);border-color:color-mix(in srgb,var(--zc) 55%,#e5d9bb)}
.cell.zoned .sub{color:color-mix(in srgb,var(--zc) 35%,#5d5646)}
.cell.zoned .stripe{background:var(--zc)!important;opacity:1!important}
/* concrete two-lane roads */
.cell.road{background-color:#9da3a8;background-image:none;border-color:#7d8388;color:#fff}
.cell.road.v{background-image:linear-gradient(90deg,transparent 7%,#f5f5f0 7%,#f5f5f0 10%,transparent 10%,transparent 90%,#f5f5f0 90%,#f5f5f0 93%,transparent 93%),repeating-linear-gradient(180deg,#ffd75a 0 7px,transparent 7px 13px);background-size:100% 100%,3px 100%;background-position:0 0,50% 0;background-repeat:no-repeat}
.cell.road.h{background-image:linear-gradient(180deg,transparent 7%,#f5f5f0 7%,#f5f5f0 10%,transparent 10%,transparent 90%,#f5f5f0 90%,#f5f5f0 93%,transparent 93%),repeating-linear-gradient(90deg,#ffd75a 0 7px,transparent 7px 13px);background-size:100% 100%,100% 3px;background-position:0 0,0 50%;background-repeat:no-repeat}
.cell.road .lbl,.cell.road .sub{background:rgba(80,86,92,.75);border-radius:4px;padding:0 2px;align-self:flex-start;color:#fff}
.cell.road .stripe{display:none}
.bridge{background:#9da3a8;z-index:1;position:relative}
.bridge.v{margin:0 18%;background-image:repeating-linear-gradient(180deg,#ffd75a 0 4px,transparent 4px 7px);background-size:3px 100%;background-position:50% 0;background-repeat:no-repeat}
.bridge.h{margin:18% 0;background-image:repeating-linear-gradient(90deg,#ffd75a 0 4px,transparent 4px 7px);background-size:100% 3px;background-position:0 50%;background-repeat:no-repeat}
/* special squares filled */
.cell.t-pay{background:linear-gradient(180deg,#ffe66b,#ffd338);border-color:#e0b520;color:#5a4300}
.cell.t-pay .sub{color:#7a5d00}
.cell.t-jobless{background:linear-gradient(180deg,#5b2a86,#46206a);border-color:#3a1a58;color:#fff}
.cell.t-jobless .sub{color:#e3d4f5}
.cell.t-charity{background:linear-gradient(180deg,#ffa34d,#f5862a);border-color:#d96c12;color:#fff}
.cell.t-charity .sub{color:#fff3e6}
.cell.t-pay .stripe,.cell.t-jobless .stripe,.cell.t-charity .stripe{display:none}
/* need vs have box */
.need{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px;background:var(--surface);border-radius:10px;overflow:hidden}
.need th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:4px 6px;background:var(--surface2)}
.need th:first-child,.need td:first-child{text-align:left}
.need td{padding:4px 6px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.need tr.short td{color:var(--bad);font-weight:600}
.lack{color:var(--bad);font-weight:600;font-size:13px;margin:4px 0}
@media (prefers-reduced-motion: reduce){button{transition:none}}
/* ===== FX / animation ===== */
.cell .ico{position:absolute;right:1px;bottom:0;font-size:1.7em;line-height:1;opacity:.38;pointer-events:none;filter:saturate(1.2)}
.cell.corner .ico{font-size:2.6em;opacity:.5;right:50%;bottom:4%;transform:translateX(50%)}
.cell.road .ico{display:none}
.cell.here{outline:none;animation:herePulse 1.4s ease-in-out infinite;z-index:1}
@keyframes herePulse{0%,100%{box-shadow:inset 0 0 0 2px #ffb627,0 0 0 0 rgba(255,182,39,0)}50%{box-shadow:inset 0 0 0 2px #ffb627,0 0 0 5px rgba(255,182,39,.45)}}
.cell.trail::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,226,120,.85),rgba(255,200,60,.35));animation:trail 1.1s ease-out forwards;animation-delay:var(--td,0ms);pointer-events:none}
@keyframes trail{from{opacity:1}to{opacity:0}}
.cell .toks{z-index:2}
.tok{width:clamp(9px,2.4vw,14px);height:clamp(9px,2.4vw,14px);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%)!important;background-blend-mode:normal}
.cell .tok{box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.2)}
.cell .tok.cur{animation:tokBob 1.1s ease-in-out infinite;box-shadow:0 0 0 2px #ffb627,0 3px 4px rgba(0,0,0,.3)}
@keyframes tokBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cell .tok.hop{animation:tokHop .34s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tokHop{0%{transform:translateY(-12px) scale(1.35)}100%{transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;place-items:center}
.droll{display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .25s}
.droll.out{opacity:0}
.droll .row{display:flex;gap:20px}

:root{--tz:1}
/* text scale: panels, popups, notices, board labels */
.layout>section:last-child,.modal .mh,.modal .mb,.modal .mf,.rnotes,#setupView,.setov{zoom:var(--tz)}
.cell .lbl{font-size:calc(1em * var(--tz))}
.center{font-size:calc(1em * var(--tz))}
.tzbox{display:inline-flex;gap:4px}.tzbox button{min-width:40px;font-weight:800;padding-left:8px;padding-right:8px}
.tzbox button:disabled{opacity:.4}
/* board pinch zoom */
.bwrap{position:relative;overflow:hidden;touch-action:pan-x pan-y;border-radius:22px}
.bwrap.zoomed{touch-action:none}
.bwrap .board{transform-origin:0 0;will-change:transform}
.bzreset{position:absolute;right:8px;top:8px;z-index:40;font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bzhint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:40;background:rgba(40,34,24,.75);color:#fff;font-size:12px;padding:4px 12px;border-radius:999px;pointer-events:none;transition:opacity .6s}
.bzhint.gone{opacity:0}
@media (hover:hover) and (pointer:fine){.bzhint{display:none}}

.bwrap.cam .board{transition:transform .32s cubic-bezier(.3,.7,.3,1)}
.bwrap.cam .bzreset{display:none}
#btnCam.on{background:#eef8ee;border-color:#9fd3a6}
@media (max-width:420px){#btnCam{font-size:11px;padding:4px 8px}}

/* ===== long outer cells (Monopoly-style) ===== */
.board{grid-template-columns:minmax(0,1.75fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1.75fr)!important;grid-template-rows:minmax(0,1.75fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1.75fr)!important}
.cell:not(.inner) .lbl{-webkit-line-clamp:3}
.cell:not(.inner){font-size:clamp(7px,1.75cqw,13px)}
.cell.inner{font-size:clamp(6.5px,1.5cqw,11px)}
.cell:not(.inner) .cimg,.cell:not(.inner) .zimg{width:52%;max-width:46px}
#btnCam{display:none}
/* ===== two-column layout that never pushes the panel off-screen ===== */
.layout>section{min-width:0}
@media (min-width:900px){
 .layout{grid-template-columns:minmax(0,min(760px,calc(100dvh - 96px),calc(100% - 370px))) minmax(350px,1fr)!important;align-items:start}
 .layout>section:last-child{max-height:calc(100dvh - 76px);overflow:auto;position:sticky;top:8px}
}
.stp{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.panel{overflow-x:hidden}

/* ===== 3D board ===== */
.bwrap.v3d{perspective:1000px;perspective-origin:50% 0%;overflow:hidden;aspect-ratio:1/1.02;background:radial-gradient(120% 90% at 50% 100%,#cfe8b8,#e8f4ff 70%);border-radius:22px}
.board.v3d{--tilt:50deg;transform-style:preserve-3d;transform:translateY(16%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.08)!important;transition:transform 1.1s cubic-bezier(.45,.05,.25,1);transform-origin:50% 50%}
.board.v3d .cell,.board.v3d .toks{transform-style:preserve-3d}
.board.v3d .cell .tok.pic{transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt))) translateY(-12%);transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.board.v3d .cell .tok.pic.cur{transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt))) translateY(-12%) scale(1.25)}
.board.v3d .center.plaza{background:radial-gradient(circle at 50% 50%,#f4fbef 0 30%,#e2f2d6 31% 60%,#d3eac3 61%)!important;border:2px solid #cfe3bd}
.board.v3d .center.plaza::before{inset:24%;opacity:.12}
.bwrap.v3d .bzreset,.bwrap.v3d .bzhint{display:none}
/* HUD (flat panel over far side) */
.hud{position:absolute!important;left:2%;right:2%;top:1.5%;z-index:30;flex-direction:row!important;flex-wrap:wrap;justify-content:center!important;align-items:center;gap:6px 14px!important;padding:8px 12px!important;border-radius:16px;background:rgba(255,253,246,.93)!important;box-shadow:0 6px 18px rgba(60,50,20,.18);container-type:inline-size!important;grid-column:auto!important;grid-row:auto!important;max-height:none;overflow:visible}
.hud::before{display:none}
.hud .who{font-size:clamp(14px,3.6cqw,22px)}.hud .who .tok.pic.big{width:clamp(28px,6.5cqw,46px)!important;height:clamp(28px,6.5cqw,46px)!important}
.hud .job{font-size:clamp(11px,2.3cqw,14px);flex-basis:100%;text-align:center}
.hud .meters{width:auto;flex:0 1 auto}
.hud .prompt{flex-basis:100%;font-size:clamp(11px,2.3cqw,14px)}
.hud .rollbtn{font-size:clamp(14px,3.6cqw,22px)}
.hud .die{width:clamp(26px,6cqw,44px);height:clamp(26px,6cqw,44px)}
.hud .btnrow,.hud .piles{flex-basis:100%;justify-content:center}
.hud .subact{flex-basis:auto}
/* card time: the HUD becomes the card table covering the board */
.bwrap.cardtime .hud{top:1.5%;bottom:1.5%;align-content:center;background:radial-gradient(120% 80% at 50% 0%,#fffef8,#fbf3de)!important}
.bwrap.cardtime .hud .pile.deck{max-width:21cqw}
.bwrap.cardtime .hud .job{display:none}
.bwrap.cardtime .board{filter:blur(1px) brightness(.9)}
@media (prefers-reduced-motion:reduce){.board.v3d,.board.v3d .tok.pic{transition:none}}

/* ===== 3D v2: tighter HUD, bigger near side, full-body standees ===== */
.bwrap.v3d{perspective:640px;perspective-origin:50% -10%;aspect-ratio:1/1.08}
.board.v3d{--tilt:56deg;transform:translateY(17%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.32)!important}
.bwrap.v3d .hud:not(.ph-card){gap:4px 10px!important;padding:6px 10px!important}
.bwrap.v3d .hud:not(.ph-card) .job,.bwrap.v3d .hud:not(.ph-card) .prompt{display:none}
.bwrap.v3d .hud:not(.ph-card) .subact{flex-basis:auto}
.bwrap.v3d .hud:not(.ph-card) .rollbtn{padding:.45em 1.3em}
.board.v3d .cell .tok.pic{background:var(--pawn) 50% 100%/contain no-repeat!important;border:none!important;border-radius:0!important;box-shadow:none!important;width:clamp(16px,5.4cqw,40px)!important;height:clamp(36px,12.5cqw,92px)!important;margin-left:calc(clamp(16px,5.4cqw,40px) * -.25);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));position:relative}
.board.v3d .cell .tok.pic::after{content:'';position:absolute;left:-15%;right:-15%;bottom:-4%;height:16%;border-radius:50%;background:var(--pc);opacity:.85;z-index:-1;box-shadow:0 0 0 2px #fff}
.board.v3d .cell .tok.pic.cur{filter:drop-shadow(0 0 4px #ffb627) drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.board.v3d .cell .toks{top:auto;bottom:30%;transform:translateX(-50%)}
.board.v3d .cell[style*="grid-column:1;"] .toks,.board.v3d .cell[style*="grid-column:13;"] .toks{transform:none}

/* 3D v3 camera */
.bwrap.v3d{perspective:800px;perspective-origin:50% -10%}
.board.v3d{--tilt:52deg;transform:translateY(-11%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.24)!important}
.board.v3d .cell .tok.pic{width:clamp(18px,6.4cqw,46px)!important;height:clamp(42px,15cqw,108px)!important;margin-left:calc(clamp(18px,6.4cqw,46px) * -.3)}

/* 3D v4: standees never animate flat, labels face outward, longer outer cells */
.board.v3d .tok.pic{animation:none!important}
.board.v3d{grid-template-columns:minmax(0,2.8fr) var(--sep) minmax(0,1.2fr) repeat(7,minmax(0,1fr)) minmax(0,1.2fr) var(--sep) minmax(0,2.8fr)!important;grid-template-rows:minmax(0,2.8fr) var(--sep) minmax(0,1.2fr) repeat(7,minmax(0,1fr)) minmax(0,1.2fr) var(--sep) minmax(0,2.8fr)!important}
.board.v3d .cell{container-type:size}
.board.v3d .cell .lbl{position:absolute;left:50%;top:50%;width:92cqw;max-height:none;transform:translate(-50%,-50%);text-align:center;-webkit-line-clamp:3;font-size:clamp(7px,17cqmin,15px);line-height:1.15;z-index:2;text-shadow:0 1px 0 #fff}
.board.v3d .cell[data-side="0"] .lbl{transform:translate(-50%,-50%) rotate(180deg)}
.board.v3d .cell[data-side="1"] .lbl{width:92cqh;transform:translate(-50%,-50%) rotate(-90deg)}
.board.v3d .cell[data-side="3"] .lbl{width:92cqh;transform:translate(-50%,-50%) rotate(90deg)}
.board.v3d .cell .lbl{top:28%}
.board.v3d .cell[data-side="0"] .lbl{top:72%}
.board.v3d .cell[data-side="1"] .lbl{top:50%;left:28%}
.board.v3d .cell[data-side="3"] .lbl{top:50%;left:72%}
.board.v3d .cell .cimg,.board.v3d .cell .zimg{width:auto;height:46cqmin;max-width:none;right:50%;bottom:8%;transform:translateX(50%);opacity:1}
.board.v3d .cell[data-side="0"] .cimg,.board.v3d .cell[data-side="0"] .zimg{bottom:auto;top:8%;transform:translateX(50%) rotate(180deg)}
.board.v3d .cell[data-side="1"] .cimg,.board.v3d .cell[data-side="1"] .zimg{right:8%;bottom:50%;transform:translateY(50%) rotate(-90deg)}
.board.v3d .cell[data-side="3"] .cimg,.board.v3d .cell[data-side="3"] .zimg{right:auto;left:8%;bottom:50%;transform:translateY(50%) rotate(90deg)}
.board.v3d .cell.road .lbl,.board.v3d .cell.road .cimg{display:none}

/* 3D v5 */
.board.v3d{transform:translateY(-24%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.08)!important;grid-template-columns:minmax(0,2.3fr) var(--sep) minmax(0,1.1fr) repeat(7,minmax(0,1fr)) minmax(0,1.1fr) var(--sep) minmax(0,2.3fr)!important;grid-template-rows:minmax(0,2.3fr) var(--sep) minmax(0,1.1fr) repeat(7,minmax(0,1fr)) minmax(0,1.1fr) var(--sep) minmax(0,2.3fr)!important;gap:2px}
.bwrap.v3d{aspect-ratio:1/1.12;perspective:760px}
.board.v3d .cell .lbl{width:98cqw;font-size:clamp(6px,22cqw,14px);letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.board.v3d .cell[data-side="1"] .lbl,.board.v3d .cell[data-side="3"] .lbl{width:98cqh;font-size:clamp(6px,22cqh,14px)}
.board.v3d .cell .tok.pic{width:clamp(20px,8cqw,56px)!important;height:clamp(46px,18cqw,130px)!important;margin-left:calc(clamp(20px,8cqw,56px) * -.35)}
.board.v3d .cell .tok.pic::after{left:12%;right:12%;height:12%;bottom:-2%}

/* 3D v6: near side spans wider than screen; board slides sideways to the player */
.bwrap.v3d{aspect-ratio:1/1;perspective:820px;perspective-origin:50% 0%}
.board.v3d{transform:translateX(var(--tx,0px)) translateY(-6%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.8)!important;transition:transform 1s cubic-bezier(.4,.1,.25,1)}

.bwrap.v3d{aspect-ratio:1/.95}
.board.v3d{transform:translateX(var(--tx,0px)) translateY(-34%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(1.6)!important;will-change:auto}
.hud[hidden]{display:none!important}

/* 3D v7: all cells square (uniform tracks), bigger zoom */
.board.v3d{grid-template-columns:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) var(--sep) repeat(9,minmax(0,1fr)) var(--sep) minmax(0,1fr)!important;gap:3px;transform:translateX(var(--tx,0px)) translateY(-40%) rotateX(var(--tilt)) rotateZ(var(--ang,0deg)) scale(2.3)!important}
.bwrap.v3d{aspect-ratio:1/.92}
.board.v3d .cell .lbl{font-size:clamp(5px,19cqmin,13px)}
.board.v3d .cell .tok.pic{width:clamp(14px,5cqw,40px)!important;height:clamp(32px,11.5cqw,92px)!important;margin-left:calc(clamp(14px,5cqw,40px) * -.35)}
.board.v3d .cell .lbl{top:24%}.board.v3d .cell[data-side="0"] .lbl{top:76%}.board.v3d .cell[data-side="1"] .lbl{left:24%}.board.v3d .cell[data-side="3"] .lbl{left:76%}
.board.v3d .cell .cimg,.board.v3d .cell .zimg{height:44cqmin}

/* 3D v8: board laid out large (crisp), no scale() */
.bwrap.v3d{aspect-ratio:1/.95;--S:2.1;--ty:-27%}
.board.v3d{position:absolute;left:50%;top:50%;width:calc(var(--S)*100%)!important;max-width:none!important;transform:translate(-50%,-50%) translateX(var(--tx,0px)) translateY(var(--ty)) rotateX(var(--tilt)) rotateZ(var(--ang,0deg))!important}

.board.v3d .cell .tok.pic{width:clamp(18px,3.6cqw,64px)!important;height:clamp(42px,8.4cqw,150px)!important;margin-left:calc(clamp(18px,3.6cqw,64px) * -.35)}
.board.v3d .cell .lbl{font-size:clamp(7px,16cqmin,22px)}

/* 3D standees v9: feet planted on the colour base, active player bigger */
.board.v3d .cell .tok.pic{transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt)))!important;background-position:50% calc(100% - 6%)!important;background-size:auto 92%!important;width:clamp(22px,4.4cqw,80px)!important;height:clamp(50px,10cqw,180px)!important;margin-left:calc(clamp(22px,4.4cqw,80px) * -.4);transition:transform .5s cubic-bezier(.3,1.5,.5,1),width .4s,height .4s}
.board.v3d .cell .tok.pic::after{left:4%;right:4%;bottom:0;height:13%;border-radius:50%;opacity:1;box-shadow:0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.35)}
.board.v3d .cell .tok.pic.cur{width:clamp(32px,6.6cqw,120px)!important;height:clamp(74px,15cqw,270px)!important;z-index:5;transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt))) translateZ(2px)!important;filter:drop-shadow(0 0 5px rgba(255,190,40,.95)) drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.board.v3d .cell .tok.pic.cur::after{box-shadow:0 0 0 3px #ffd56b,0 0 12px 3px rgba(255,200,60,.8)}
.board.v3d .cell .toks{bottom:22%;align-items:flex-end}

.board.v3d .cell .tok.pic{width:52cqmin!important;height:120cqmin!important;margin-left:-20cqmin;background-position:50% 100%!important;background-size:auto 93%!important}
.board.v3d .cell .tok.pic:first-child{margin-left:0}
.board.v3d .cell .tok.pic.cur{width:74cqmin!important;height:172cqmin!important}
.board.v3d .cell .tok.pic::after{left:8%;right:8%;bottom:-3%;height:9%}
.board.v3d .cell .toks{bottom:18%}

.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic:not(.cur){width:44cqmin!important;height:102cqmin!important;margin-left:-22cqmin}
.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic.cur{width:66cqmin!important;height:152cqmin!important;margin-left:-22cqmin}
.board.v3d .cell .toks .tok.pic:first-child{margin-left:0!important}
.board.v3d .cell .tok.pic::after{bottom:3%;height:8%}

/* 3D v10 */
.bwrap.v3d{--ty:-28%;touch-action:none;cursor:grab}
.bwrap.v3d.dragging{cursor:grabbing}.bwrap.v3d.dragging .board{transition:none!important}
.board.v3d{transform:translate(-50%,-50%) translateX(calc(var(--tx,0px) + var(--ux,0px))) translateY(calc(var(--ty) + var(--uy,0px))) rotateX(var(--tilt)) rotateZ(var(--ang,0deg))!important}
.board.v3d .cell .tok.pic{background:none!important;width:64cqmin!important;height:150cqmin!important;margin-left:-26cqmin}
.board.v3d .cell .tok.pic.cur{width:92cqmin!important;height:215cqmin!important}
.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic:not(.cur){width:54cqmin!important;height:126cqmin!important;margin-left:-26cqmin}
.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic.cur{width:82cqmin!important;height:190cqmin!important;margin-left:-26cqmin}
.board.v3d .cell .toks .tok.pic:first-child{margin-left:0!important}
.board.v3d .cell .tok.pic::before{content:'';position:absolute;inset:0;background:var(--pawn) 50% 100%/auto 100% no-repeat;z-index:2}
.board.v3d .cell .tok.pic::after{left:6%;right:6%;bottom:-5%;height:10%;z-index:1}

/* smooth walk */
.walker{position:absolute;z-index:40;pointer-events:none;transform-origin:50% 100%;transform:rotateZ(calc(-1 * var(--ang,0deg))) rotateX(calc(-1 * var(--tilt)));transition:left var(--stepms,640ms) linear,top var(--stepms,640ms) linear;will-change:left,top}
.walker::before{content:'';position:absolute;inset:0;background:var(--pawn) 50% 100%/auto 100% no-repeat;z-index:2;filter:drop-shadow(0 0 5px rgba(255,190,40,.95)) drop-shadow(0 4px 3px rgba(0,0,0,.35));transform-origin:50% 100%}
.walker::after{content:'';position:absolute;left:6%;right:6%;bottom:-5%;height:10%;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px #ffd56b,0 0 12px 3px rgba(255,200,60,.8);z-index:1}
.walker.bob::before{animation:walkBob var(--stepms,640ms) ease-in-out}
@keyframes walkBob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7%) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-7%) rotate(3deg)}}
.bwrap.walking .board.v3d .tok.pic.cur{visibility:hidden}
.bwrap.walking .board.v3d{transition:transform var(--stepms,640ms) linear!important}

/* 3D v11: true centering + fast bot camera + smaller sharper busts */
.board.v3d{transform:translate(-50%,-50%) translateX(calc(var(--tx,0px) + var(--ux,0px))) translateY(calc(var(--typx,-28%) + var(--uy,0px))) rotateX(var(--tilt)) rotateZ(var(--ang,0deg))!important}
.bwrap.fastcam .board.v3d{transition:transform .2s ease-out!important}
.ov.withfig{--fh:clamp(110px,22vh,215px)}
.bust{width:calc(var(--fh)*.86)}

.cinfo{display:flex;align-items:flex-end;gap:10px;width:100%;max-width:560px;background:#fff;border:1.5px solid #efe5cf;border-radius:16px;padding:8px 12px 8px 6px;text-align:left}
.ci-fig{height:clamp(110px,26cqh,230px);width:auto;flex:none;margin:-34px 0 -8px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));animation:bustIn .45s cubic-bezier(.2,1.4,.4,1) both}
.ci-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ci-row{display:flex;gap:6px;flex-wrap:wrap}
.ci-k{flex:1 1 90px;background:#fbf7ec;border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;line-height:1.2}
.ci-k span{font-size:11px;color:#8a8170}.ci-k b{font-size:clamp(13px,3.2cqw,18px)}
.ci-goal{font-size:12px;color:#5a4f3c;display:flex;flex-direction:column;gap:3px}
.ci-goal i{display:block;height:6px;border-radius:9px;background:linear-gradient(90deg,#3fb46a var(--v),#eee5cf var(--v))}
.ci-sts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ci-st{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:2px;font-size:12px}
.ci-st b{font-size:16px}.ci-st small{color:#8a8170}.ci-st .ii{width:18px;height:18px}
.ci-st i{grid-column:1/-1;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--c) var(--v),#eee5cf var(--v))}
.center.ph-card .who,.hud.ph-card .who{display:none}

/* card-phase info v2: fixed sizes, compact */
.cinfo{padding:6px 10px 6px 4px;gap:8px;max-width:520px}
.ci-fig{height:150px;margin:-18px 0 -6px}
.ci-k{padding:3px 8px}.ci-k b{font-size:15px}.ci-k span{font-size:10.5px}
.ci-goal{font-size:11.5px}.ci-st b{font-size:15px}
.center.ph-card,.hud.ph-card{gap:8px!important}
.center.ph-card .trow,.hud.ph-card .trow{order:-2}
.center.ph-card .cinfo{order:-1}
/* 2D board centre is small: hide figure & goal bar, keep numbers */
.board:not(.v3d) .center.ph-card .ci-fig,.board:not(.v3d) .center.ph-card .ci-goal{display:none}
.board:not(.v3d) .center.ph-card .cinfo{padding:5px 8px}
.board:not(.v3d) .center.ph-card .ci-k b{font-size:13px}
.board:not(.v3d) .center.ph-card .ci-st b{font-size:13px}
@media (max-width:520px){.ci-fig{height:120px}}

.pile.deck .ptag{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);z-index:4;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--tc);background:#fff;border:1px solid color-mix(in srgb,var(--tc) 35%,#fff);border-radius:999px;padding:1px 9px 2px;line-height:1.35;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pile.deck .ptag::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tc);margin-right:5px;vertical-align:1px}
.piles{padding-bottom:22px}
@media (max-width:420px){.pile.deck .ptag{font-size:9.5px;padding:1px 6px}.pile.deck .ptag::before{width:5px;height:5px;margin-right:3px}}

.board:not(.v3d) .center .pile.deck .ptag{font-size:clamp(6.5px,2.3cqw,10px);padding:0 4px 1px;bottom:-3px}
.board:not(.v3d) .center .pile.deck .ptag::before{display:none}
.board:not(.v3d) .center .piles{padding-bottom:14px}

/* base disc must stay above the board plane (it is upright with the standee) */
.board.v3d .cell .tok.pic::after,.walker::after{bottom:0!important;height:9%!important}
.board.v3d .cell .tok.pic::before,.walker::before{bottom:3.5%;top:auto;height:96.5%;inset:auto 0 3.5% 0}
/* ===== เต็มจอ: เกมพอดีขนาดหน้าจอจริง (body.fs) ===== */
body.fs{height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
body.fs>header{flex:none;padding-top:4px;padding-bottom:4px;position:static}
body.fs #setupView:not(:empty){flex:1;min-height:0;overflow:auto}
body.fs #gameView:not([hidden]){flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:6px 10px 8px;gap:10px;align-items:stretch}
body.fs #gameView:not(.mapmin){grid-template-columns:minmax(0,1fr) clamp(300px,30vw,480px)!important;grid-template-rows:minmax(0,1fr)!important}
body.fs #gameView.mapmin{overflow:auto}
body.fs #gameView:not(.mapmin)>section{min-height:0}
body.fs #gameView:not(.mapmin)>section:first-child{display:flex;flex-direction:column;container-type:size}
body.fs #gameView:not(.mapmin) .mapbar{flex:none;width:100%;max-width:none}
body.fs #gameView:not(.mapmin) .legend{display:none!important}
body.fs #gameView:not(.mapmin) .bwrap:not(.v3d){flex:none;width:min(100cqw,calc(100cqh - 40px));aspect-ratio:1;margin:0 auto}
body.fs #gameView:not(.mapmin) .bwrap:not(.v3d) .board{width:100%!important;max-width:none!important}
body.fs #gameView:not(.mapmin) .bwrap.v3d{flex:1;min-height:0;width:100%;aspect-ratio:auto!important}
body.fs #gameView:not(.mapmin)>section:last-child{display:flex;flex-direction:column;max-height:none!important;position:static!important;overflow:hidden!important}
body.fs #gameView:not(.mapmin)>section:last-child>.tabs{flex:none}
body.fs #gameView:not(.mapmin)>section:last-child>.panel{flex:1;min-height:0;overflow:auto}
@media (orientation:portrait){
 body.fs #gameView:not(.mapmin){grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr)!important;padding:4px 6px 6px;gap:6px}
}
/* ===== แผงข้อมูลเป็นหลัก (แนวนอน: แท็บข้อมูลได้พื้นที่ก่อน แผนที่รอง) ===== */
#panel{container:panel/inline-size}
@media (min-width:900px){
 .layout{max-width:1680px}
 .layout:not(.mapmin){grid-template-columns:minmax(312px,1.2fr) minmax(380px,1.5fr)!important}
}
@media (orientation:landscape) and (max-height:620px){
 .layout:not(.mapmin){grid-template-columns:minmax(240px,1.2fr) minmax(0,1.5fr)!important}
 .board{width:min(100%,calc(100dvh - 84px))}
}
body.fs #gameView:not(.mapmin){grid-template-columns:minmax(288px,1.2fr) minmax(340px,1.5fr)!important}
@media (orientation:portrait){body.fs #gameView:not(.mapmin){grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr)!important}}
/* เนื้อหาในแผง: ไม่ล้น ไม่ซ้อน ปรับตามความกว้างจริง (รวมขนาดตัวอักษร A−/A+) */
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stp{grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr))}
.mi2{flex-wrap:wrap;row-gap:6px}
.dlt,.mname,.prow{overflow-wrap:anywhere}
.mname{min-width:5.5em}
@container panel (min-width:620px){
 .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
 .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
}
@container panel (min-width:960px){
 .fin{display:grid;grid-template-columns:1fr 1fr;align-items:start}
 .fin>*{min-width:0}
 .fin>.fhead,.fin>.stp,.fin>.tiles,.fin>.fgrid,.fin>.fld{grid-column:1/-1}
}
/* โหมด 3D จอแนวนอน: แท็บข้อมูลกว้างขึ้นอีก (แผนที่ 3D เลื่อน/ซูมดูได้อยู่แล้ว) */
@media (min-width:900px){.layout:not(.mapmin):has(.bwrap.v3d){grid-template-columns:minmax(312px,1.2fr) minmax(420px,1.9fr)!important}}
@media (orientation:landscape) and (max-height:620px){.layout:not(.mapmin):has(.bwrap.v3d){grid-template-columns:minmax(240px,1.2fr) minmax(0,1.9fr)!important}}
@media (orientation:landscape){body.fs #gameView:not(.mapmin):has(.bwrap.v3d){grid-template-columns:minmax(288px,1.2fr) minmax(340px,1.9fr)!important}}
.mi1{flex-wrap:wrap}

/* ===== แท็บธนาคาร ===== */
.bank{display:flex;flex-direction:column;gap:12px}
.bkhead{display:flex;align-items:center;gap:10px}.bkhead img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:50%;background:#fff3d9;border:2px solid #efe0b6;flex:none}
.bkhead div{display:flex;flex-direction:column;min-width:0}.bkhead .muted{font-size:12px}
.bkgrid{display:grid;grid-template-columns:1fr;gap:12px}
.bank>.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5em),1fr))}
@container panel (min-width:700px){.bkgrid{grid-template-columns:1fr 1fr}.bank>.tiles{grid-template-columns:repeat(4,1fr)}}
.bkc h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bkrate{font-size:13px;font-weight:700}
.bkc .kv{grid-template-columns:auto 1fr;margin:4px 0 8px}.bkc .kv b{text-align:right}
.bkbar{height:8px;border-radius:5px;background:#eee6d2;overflow:hidden;margin:2px 0 4px}.bkbar i{display:block;height:100%;background:#e0a030}.bkbar i.hi{background:#d9534f}
.bknote{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.45}
.bkrow{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.bkrow label{font-weight:600;font-size:13px}
.bkrow input{width:100%;min-width:0;font-size:16px;padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.bkrow button{min-width:4.4em}
.bkq{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px 5.1em}
.bkq .bkall{margin-left:auto;border-color:#e0b25a;background:#fff4dc}
@container panel (max-width:360px){.bkrow{grid-template-columns:minmax(0,1fr) auto}.bkrow label{grid-column:1/-1}.bkq{margin-left:0}}

/* ===== เทรด (ป๊อปอัปซื้อขาย) + ปุ่มจำนวนเงินธนาคาร ===== */
.trhint{font-size:13px;margin:0 0 8px;color:var(--ink);background:#fff8e4;border:1px dashed #e8d39f;border-radius:10px;padding:6px 10px}
.mi1.tap{cursor:pointer;border-radius:10px;margin:-4px -6px;padding:4px 6px;transition:background .15s}
.mi1.tap:hover,.mi1.tap:focus-visible{background:#fff6dd;outline:none}
.mi1.tap{position:relative;padding-right:20px}
.mi1 .mgo{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:22px;color:#c9a75a;font-weight:700;line-height:1}
.trbox{display:flex;flex-direction:column;gap:10px}
.trhead{display:flex;gap:10px;align-items:center}.trhead .mico{width:40px;height:40px}
.trdir{align-self:stretch}.trdir button{flex:1;font-size:16px;font-weight:700;padding:10px}
.trdir button[data-d="-1"].on{background:#d9534f;color:#fff}
.trqty{display:flex;align-items:baseline;justify-content:center;gap:8px;background:#fffdf5;border:1.5px solid #efe0b6;border-radius:12px;padding:8px}
.trqty b{font-size:30px;font-family:var(--display);min-width:3ch;text-align:center}
.trsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,4.9em),1fr));gap:6px}
.trsteps button{font-size:14px;font-weight:700;padding:10px 2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.trsteps2{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.trcalc{grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;background:#fff;border:1px solid #efe5cf;border-radius:12px;padding:10px 12px}
.trcalc b{text-align:right}.trcalc b.big{font-size:18px}
.mf button.sell:not(:disabled){background:linear-gradient(180deg,#e2716d,#c9504c);border-color:#b8443f;box-shadow:0 3px 0 #9d3a36;color:#fff}
.bkpad{border:1.5px solid #efe5cf;border-radius:12px;padding:10px;margin-top:10px;background:#fffdf7;display:flex;flex-direction:column;gap:8px}
.bkpt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.bkpt span{font-weight:700}.bkpt b{font-size:22px;font-family:var(--display)}
.bkpf{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* ===== คริปโต + หัวกลุ่มในแท็บเทรด ===== */
.cico{display:inline-grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--cc) 60%,#fff),var(--cc));color:#fff;font-weight:800;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.15);flex:none}
.mi1 .cico{width:34px;height:34px}.trhead .cico{width:40px;height:40px;font-size:22px}
.mgh{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:#6b5a3a}
.mlist>.mgh:first-child{margin-top:0}
.crydate{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.mi1.tap .mk{white-space:nowrap}
.mi1{flex-wrap:nowrap!important}
.mi1>svg{flex:0 1 64px;min-width:0;width:64px;height:auto;overflow:hidden}
.mi1 .mname{min-width:0;flex:1 1 0}.mi1 .mname>*{overflow-wrap:break-word}
@container panel (max-width:340px){.mi1>svg{display:none}}
.mprice b{white-space:nowrap}
.mnl{background:#fff;border:1px solid #efe5cf;border-radius:10px;padding:4px 10px}
.jl.yw{background:#f2c230;color:#5a4300}
.ycard{font-size:54px;text-align:center;line-height:1;margin:2px 0 6px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}

/* ===== จอแนวตั้ง: ตัวละครไม่ล้นแผนที่ · การ์ดเห็นครบ ===== */
.board.v3d .cell .tok.pic{width:calc(64cqmin * var(--fs,1))!important;height:calc(150cqmin * var(--fs,1))!important;margin-left:calc(-26cqmin * var(--fs,1))}
.board.v3d .cell .tok.pic.cur{width:calc(92cqmin * var(--fs,1))!important;height:calc(215cqmin * var(--fs,1))!important}
.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic:not(.cur){width:calc(54cqmin * var(--fs,1))!important;height:calc(126cqmin * var(--fs,1))!important;margin-left:calc(-26cqmin * var(--fs,1))}
.board.v3d .cell .toks:has(.tok:nth-child(3)) .tok.pic.cur{width:calc(82cqmin * var(--fs,1))!important;height:calc(190cqmin * var(--fs,1))!important;margin-left:calc(-26cqmin * var(--fs,1))}
.bwrap.cardtime .hud{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.bwrap.v3d.cardtime .hud .pile.deck{max-width:min(21cqw,calc(var(--bh,600px) * .2))}
.bwrap.v3d.cardtime .hud .ci-fig{max-height:calc(var(--bh,600px) * .26)}
@media (orientation:portrait){
 body.fs #gameView:not(.mapmin){grid-template-rows:minmax(0,min(calc(100vw + 30px),64dvh)) minmax(0,1fr)!important}
}

/* ===== โหมดออนไลน์ ===== */
.setup.onl{max-width:520px}
.ol-btns{display:grid;gap:10px;margin:14px 0}
.ol-btns>button{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;font-size:16px}
.ol-ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:800}
.ol-g .ol-ic{background:#fff;color:#4285f4;border:1px solid #dadce0}
.ol-f{background:#1877f2!important;color:#fff!important;border-color:#1877f2!important}.ol-f .ol-ic{background:#fff;color:#1877f2}
.ol-mail{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.ol-mail summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.ol-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;background:rgba(255,255,255,.5)}
.ol-card h3{margin:0 0 4px;font-size:16px}.ol-card p{margin:0 0 10px}
.ol-entry{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ol-entry p{margin:0}
.ol-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ol-row input{flex:1;min-width:0}
#olCode{font-size:22px;letter-spacing:.25em;text-align:center;max-width:12ch}
.ol-code{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ol-code b{font-size:clamp(30px,9vw,44px);letter-spacing:.18em;font-variant-numeric:tabular-nums;color:var(--ink,#2b3a2b)}
.ol-n{margin:4px 0 8px}.ol-n span{margin-right:4px}
.seat.lb{grid-template-columns:14px 1fr auto;min-height:40px}
.lb-n{overflow-wrap:anywhere}
#gameView[hidden],#setupView[hidden]{display:none!important}
#olCode:placeholder-shown{letter-spacing:normal;font-size:16px}
.roomtag{margin-left:8px;font-size:12px;padding:2px 8px;border-radius:999px;background:#fff3c4;border:1px solid #e8d48a;white-space:nowrap}

/* แจ้งเตือน: กลางบนจอ ขนาดตามจอ แตะเพื่อปิด */
.toast{top:max(12px,env(safe-area-inset-top));bottom:auto!important;left:50%;transform:translate(-50%,-12px);
 font-size:clamp(16px,calc(13px + .6vw),22px)!important;font-weight:600;line-height:1.45;padding:.75em 1.4em!important;border-radius:16px!important;
 width:max-content;max-width:min(92vw,640px)!important;min-width:min(70vw,260px);text-align:center;z-index:9999!important;
 box-shadow:0 5px 0 #36502c,0 10px 24px rgba(0,0,0,.18)!important;cursor:pointer;transition:opacity .25s,transform .25s!important}
.toast.on{transform:translate(-50%,0);pointer-events:auto!important}

/* ===== ออนไลน์เล่นพร้อมกัน ===== */
.rbanner{position:fixed;left:50%;top:9%;transform:translate(-50%,-10px) scale(.96);z-index:9998;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
 background:#fffdf3;border:3px solid #e8d48a;border-radius:22px;padding:.8em 1.6em;text-align:center;box-shadow:0 6px 0 #d9c37a,0 18px 40px rgba(0,0,0,.2);min-width:min(80vw,320px)}
.rbanner.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.rbanner b{display:block;font-size:clamp(24px,6vw,40px);color:#b8202f}.rbanner span{display:block;margin-top:4px;font-size:clamp(14px,3.6vw,18px)}
.afkov{position:fixed;inset:0;z-index:9990;background:rgba(90,92,96,.72);backdrop-filter:grayscale(1);-webkit-backdrop-filter:grayscale(1);display:grid;place-items:center;padding:16px}
.afkov[hidden]{display:none}
.afk-box{background:#fffdf3;border-radius:22px;padding:22px 20px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.afk-box .afk-ic{font-size:48px}.afk-box h2{margin:6px 0}.afk-box button{margin-top:12px;font-size:18px;min-height:48px;padding:0 28px}
.pwait{font-size:15px}
.newsimg{display:block;width:clamp(84px,24vw,120px);height:auto;margin:0 auto 6px}
.netimg{display:block;width:clamp(96px,28vw,150px);margin:4px auto 2px}
.mghi{width:1.9em;height:1.9em;vertical-align:middle;margin-right:4px;object-fit:contain}

/* พื้นหลังหน้าออนไลน์ (ล็อกอิน/หน้าหลัก/ล็อบบี้) */
#setupView:has(.setup.onl)::before{content:"";position:fixed;inset:0;z-index:-1;background:url(img/online-hero.webp) center 70%/cover no-repeat}
@media (orientation:portrait){#setupView:has(.setup.onl)::before{background-image:url(img/online-hero-tall.webp);background-position:center bottom}}
/* จอเกือบสี่เหลี่ยม (4:3 แนวนอน · 3:4 แนวตั้ง เช่น iPad, Fold จอใน) ใช้ภาพที่ครอปมาเฉพาะ */
@media (orientation:landscape) and (max-aspect-ratio:3/2){#setupView:has(.setup.onl)::before{background-image:url(img/online-hero-43.webp);background-position:center bottom}}
@media (orientation:portrait) and (min-aspect-ratio:2/3){#setupView:has(.setup.onl)::before{background-image:url(img/online-hero-34.webp);background-position:center bottom}}
/* จอยาวพิเศษ 21:9 (จอ ultrawide แนวนอน · มือถือ 21:9 แนวตั้ง) */

@media (orientation:portrait) and (max-aspect-ratio:9/20){#setupView:has(.setup.onl)::before{background-image:url(img/online-hero-921.webp);background-position:center bottom}}
.setup.onl{background:rgba(255,253,245,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin-top:clamp(16px,6vh,64px)}
.setup.onl .ol-card{background:rgba(255,255,255,.72)}
body:has(#setupView .setup.onl) header{position:relative;z-index:5}
.icw{width:1.25em;height:1.25em;vertical-align:-.25em;object-fit:contain}
.ycard img{width:clamp(80px,22vw,120px);height:auto;display:block;margin:0 auto}

/* ===== ช่องบนกระดาน: ไม่แสดงชื่อ (กดดูเอง) · ภาพฉากส่วนบน · ตัวละครยืนส่วนล่าง ===== */
.board .cell .lbl{display:none!important}
.board:not(.v3d) .cell .zimg,.board:not(.v3d) .cell .cimg{position:absolute;left:50%;right:auto!important;top:6%;bottom:auto!important;transform:translateX(-50%)!important;width:auto!important;height:50%;max-width:94%!important;object-fit:contain;opacity:1}
.board:not(.v3d) .cell .ico{top:6%;bottom:auto;left:50%;right:auto;transform:translateX(-50%);opacity:.85}
.board:not(.v3d) .cell.corner .zimg,.board:not(.v3d) .cell.corner .cimg{height:54%}
.board:not(.v3d) .cell .toks{top:auto!important;bottom:2%!important;transform:translateX(-50%)!important}
.board:not(.v3d) .cell[style*="grid-column:1;"] .toks,.board:not(.v3d) .cell[style*="grid-column:13;"] .toks{transform:none!important}
.board.v3d .cell .zimg,.board.v3d .cell .cimg{height:50cqmin!important;width:auto!important;max-width:none!important;opacity:1}
.board.v3d .cell .zimg.pimgc{object-fit:contain}
.board.v3d .cell[data-side="0"] .zimg.pimgc,.board.v3d .cell[data-side="2"] .zimg.pimgc{width:94cqw!important;height:auto!important;max-height:60cqh}
.board.v3d .cell[data-side="1"] .zimg.pimgc,.board.v3d .cell[data-side="3"] .zimg.pimgc{width:94cqh!important;height:auto!important;max-height:60cqw}
.board:not(.v3d) .cell .zimg.pimgc{height:auto!important;width:92%!important;max-height:52%}
.board.v3d .cell[data-side="2"] .zimg,.board.v3d .cell[data-side="2"] .cimg{top:3%!important;bottom:auto!important;right:50%!important;left:auto!important;transform:translateX(50%)!important}
.board.v3d .cell[data-side="0"] .zimg,.board.v3d .cell[data-side="0"] .cimg{bottom:3%!important;top:auto!important;right:50%!important;left:auto!important;transform:translateX(50%) rotate(180deg)!important}
.board.v3d .cell[data-side="1"] .zimg,.board.v3d .cell[data-side="1"] .cimg{left:3%!important;right:auto!important;top:50%!important;bottom:auto!important;transform:translateY(-50%) rotate(-90deg)!important}
.board.v3d .cell[data-side="3"] .zimg,.board.v3d .cell[data-side="3"] .cimg{right:3%!important;left:auto!important;top:50%!important;bottom:auto!important;transform:translateY(-50%) rotate(90deg)!important}

const RULES=`<ol class="rules">
<li><b>ลูก</b> (สูงสุด 4 คน): คนที่ 1–2 บังคับรับ คนที่ 3–4 เลือกได้ · ค่าเลี้ยงดูรายเดือนตามอาชีพ · ⏳ −1 ทุกวันเงินเดือนต่อลูก 1 คน · แรงบันดาลใจ: การ์ดธุรกิจ/งานที่ใช้ ❤ ลดลง 1 ต่อลูก และรายได้ธุรกิจ (ธุรกิจในกองโอกาส + ธุรกิจ A) +5% ต่อลูก · การ์ดค่าเทอม ทัศนศึกษา อุปกรณ์การเรียน ฯลฯ ไม่บังคับ คิดตามจำนวนลูก</li>
<li><b>กองดำเนินชีวิต</b> = แหล่งเติม ❤ หัวใจ และ ⏳ เวลา ไม่มีใบไหนหักค่าพลัง จ่ายเป็นเงินแทน และค่าใช้จ่ายของการ์ดคูณค่าครองชีพเขตที่ยืนอยู่: ต่างจังหวัด: เกษตรกรรม ×0.7 · อุตสาหกรรม ×0.8 · ชุมชน ×0.85 · ท่องเที่ยว ×1.0 | เมืองหลวงแพงกว่าเสมอ: ย่านการเงิน ×1.3 · ย่านธุรกิจ ×1.4 · ย่านช้อปปิ้ง ×1.5 · ย่านที่พักหรู ×1.7 · <b>การ์ดชีวิตไม่บังคับรับ</b> เลือกข้ามได้ ยกเว้นการ์ดอุบัติเหตุ (และช่องฟุ่มเฟือยที่บังคับจ่าย)</li>
<li>กระดาน 2 ชั้น: <b>ชั้นนอก = ต่างจังหวัด</b> 40 ช่อง (เขตเกษตรกรรม อุตสาหกรรม ท่องเที่ยว ชุมชน) ค่าครองชีพ ×0.85 ที่ดินถูก · <b>ชั้นใน = เมืองหลวง</b> 32 ช่อง ค่าครองชีพ ×1.3 อสังหาฯ แพง แต่สร้างธุรกิจง่าย (มีศูนย์ธุรกิจ และดีลธุรกิจลด 20%)</li>
<li>ทุกเขตมี <b>ช่องถนน</b> เดินผ่านแล้วเลือกข้ามไปถนนของอีกชั้นได้ การข้ามนับเป็น 1 ก้าว ก้าวที่เหลือเดินต่อในชั้นใหม่ ค่าครองชีพคิดตามชั้นที่คุณอยู่</li>
<li>ช่อง <b>เงินเดือน</b>: ชั้นนอก 4 ช่อง (ทุกมุม) ชั้นใน 2 ช่อง (มุมตรงข้ามกัน) · ช่อง <b>ตกงาน</b>: ชั้นละ 1 ช่อง · <b>รอบที่ 1–5</b> โดนแค่ <b>ใบเตือน 🟨</b> เงินเดือนลด 50% 2 เดือน · ตั้งแต่รอบที่ 6 หัวใจ −2 และติดสถานะตกงาน วันเงินเดือน 2 ครั้งถัดไปได้เฉพาะ Passive income (ไม่ได้เงินเดือนและรายได้ Active) แล้วหักรายจ่ายรวม ถ้าเงินสดไม่พอ เลือกกู้ หรือขายทรัพย์สินในราคา 50%</li>
<li>ปกติ <b>ทอยลูกเต๋า 1 ลูก</b> · ช่อง <b>บริจาคการกุศล</b> (ชั้นละ 1 ช่อง) บริจาค 10% ของรายรับรวม แล้วเลือกทอย 1 หรือ 2 ลูกได้ 3 เทิร์น</li>
