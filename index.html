/* ===================== เทรด: แตะชื่อ → ซื้อ/ขาย → กดปุ่มจำนวนหน่วย → ยืนยัน ===================== */
const TSTEP=a=>a.st||(a.k==='com'?[100,10,1]:[100000,10000,1000,100]);
let TR=null;
function tradeCalc(){
  const p=cp(),a=AS(TR.s),pr=S.prices[TR.s],hd=p.stocks[TR.s],have=hd?hd.q:0,unit=UNIT(a);
  const q=TR.q,v=pr*q,fee=commission(p,v);
  const row=(k,val,cls='')=>`<span>${k}</span><b class="num ${cls}">${val}</b>`;
  let h='',ok=q>0,lbl='';
  if(TR.dir>0){const total=v+fee,after=p.cash-total,L=Math.ceil(Math.max(0,-after)/1000)*1000;TR.loan=L;
    h=row('มูลค่า',`${B(v)}`)+row('ค่าธรรมเนียม 1%',fee?B(fee):'ฟรี',fee?'neg':'')+row('<b>รวมจ่าย</b>',B(total),'neg big')+row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(after)}`,after<0?'neg':'')+(q?row('ถือหลังซื้อ',`${(have+q).toLocaleString()} ${unit}`):'')+(a.div&&q?row('ปันผลต่อเดือน (หลังซื้อ)','+'+B((have+q)*a.div*(1+skV(p,'stock')/100)),'pos'):'');
    const over=L>0&&p.loan+L>loanLim(p);if(over&&q){ok=false;h+=`<p class="lack" style="grid-column:1/-1;margin:4px 0 0">เงินสดขาด ${B(-after)} และกู้เพิ่มได้อีกไม่เกิน ${B(Math.max(0,loanLim(p)-p.loan))} (เพดานหนี้) · ลดจำนวนลง</p>`}
    else if(after<0&&q)h+=`<p class="lack" style="grid-column:1/-1;margin:4px 0 0">เงินสดขาด ${B(-after)} · ยืนยันแล้วระบบจะกู้ ${B(L)} (ดอกเบี้ย ${LOAN_TXT} ต่อเดือน)</p>`;
    lbl=!q?'เลือกจำนวนก่อน':over?'เกินวงเงินกู้':after<0?`กู้ ${B(L)} แล้วซื้อ ${B(total)}`:`ยืนยันซื้อ ${B(total)}`}
  else{const get=v-fee,avg=have?hd.c/have:0,cost=avg*q,pl=get-cost;
    h=row('มูลค่า',B(v))+row('ค่าธรรมเนียม 1%',fee?B(fee):'ฟรี',fee?'neg':'')+row('<b>ได้รับสุทธิ</b>',B(get),'pos big')+(q?row('กำไร/ขาดทุน',`${pl>=0?'+':'−'}${B(Math.abs(pl)).replace('−','')} (${pl>=0?'+':''}${(cost?pl/cost*100:0).toFixed(1)}%)`,pl>=0?'pos':'neg'):'')+row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(p.cash+get)}`)+row('เหลือถือ',`${(have-q).toLocaleString()} ${unit}`);
    lbl=!q?'เลือกจำนวนก่อน':`ยืนยันขาย ได้ ${B(get)}`}
  return {h,ok,lbl,have,unit,pr,a,p};
}
function tradeUpd(){
  const m=$('#modal');if(!m||!TR)return;const c=tradeCalc();
  m.querySelector('#trq').textContent=TR.q.toLocaleString();
  m.querySelector('#trcalc').innerHTML=c.h;
  m.querySelectorAll('.trdir button').forEach(b=>b.classList.toggle('on',+b.dataset.d===TR.dir));
  m.querySelector('#trall').hidden=TR.dir>0;
  const ok=m.querySelector('.mf button[data-i="0"]');if(ok){ok.disabled=!c.ok;ok.textContent=c.lbl;ok.classList.toggle('sell',TR.dir<0)}
}
function trDir(d){if(!TR)return;const c=tradeCalc();if(d<0&&!c.have){toast('ยังไม่มีให้ขาย');return}TR.dir=d;TR.q=d<0?Math.min(TR.q,c.have):TR.q;tradeUpd()}
function trAdd(n){if(!TR)return;const c=tradeCalc();let q=QR(TR.q+n);if(TR.dir<0&&q>c.have){q=c.have;toast(`มีอยู่ ${c.have.toLocaleString()} ${c.unit} ขายได้สูงสุดเท่านี้`)}TR.q=q;tradeUpd()}
function trSet(q){if(!TR)return;TR.q=Math.max(0,q);tradeUpd()}
async function tradeDlg(s){
  if(!canAct()){toast('ซื้อขายได้เฉพาะในเทิร์นของคุณ');return}
  {const a0=AS(s);if(!cryLive(a0,S)){toast(`${a0.s} ยังไม่เข้าตลาด เปิดเทรดในอีก ${cryFrom(s)-cryIdx()} รอบ`);return}}
  const p=cp(),a=AS(s),hd=p.stocks[s],have=hd?hd.q:0,unit=UNIT(a);
  TR={s,dir:1,q:0,loan:0};
  const body=`<div class="trbox">
   <div class="trhead">${MICO(a)}<div>${a.k==='stock'?`<b>${esc(a.n)}</b>`:`<b>${a.s}</b> <span class="muted">${a.n}</span>`}<div class="muted" style="font-size:12px">ราคาตอนนี้ <b class="num" style="color:var(--ink)">${fmtP(a,S.prices[s])}</b> ต่อ${unit}${a.k==='cry'?' (ราคาจริงช่วงสุ่ม)':''} · ถืออยู่ ${have.toLocaleString()} ${unit}${have?` · ทุนเฉลี่ย ${fmtAvg(a,hd.c/have)}`:''} · เงินสด ${B(p.cash)}</div></div></div>
   <div class="seg trdir"><button data-d="1" onclick="trDir(1)">ซื้อ</button><button data-d="-1" onclick="trDir(-1)" ${have?'':'disabled'}>ขาย</button></div>
   <div class="trqty"><span>จำนวน</span><b class="num" id="trq">0</b><span>${unit}</span></div>
   <div class="trsteps">${TSTEP(a).map(n=>`<button onclick="trAdd(${n})">+${n.toLocaleString(undefined,{maximumFractionDigits:3})}</button>`).join('')}</div>
   <div class="trsteps2"><button class="sm" onclick="trSet(0)">ล้าง</button><button class="sm" id="trall" onclick="trSet(${have})" hidden>ขายทั้งหมด ${have.toLocaleString()}</button></div>
   <div class="kv trcalc" id="trcalc"></div></div>`;
  const r=await choose({kind:'trade',title:`ซื้อขาย ${a.n}`,body,npc:false,opts:[{v:'ok',l:'เลือกจำนวนก่อน',c:'pri',dis:true},{v:'no',l:'ยกเลิก'}],onShow:()=>tradeUpd()});
  const t=TR;TR=null;if(r!=='ok'||!t||!t.q)return;
  const pr=S.prices[s],hd2=p.stocks[s];
  if(t.dir>0){const v=pr*t.q,fee=commission(p,v),total=v+fee;
    if(p.cash<total){const L=Math.ceil((total-p.cash)/1000)*1000;p.loan+=L;p.cash+=L;log(`🏦 ${esc(p.name)} กู้ ${B(L)} เพื่อซื้อ${a.n}`)}
    p.cash-=total;addHold(p,s,t.q,total);log(`${esc(p.name)} ซื้อ ${a.n} ${t.q.toLocaleString()} ${unit} @ ${fmtP(a,pr)} รวม ${B(total)} (ค่าธรรมเนียม ${B(fee)})`);toast(`ซื้อ ${SN(a)} ${t.q.toLocaleString()} ${unit} แล้ว`)}
  else{if(!hd2||!hd2.q)return;const q=Math.min(t.q,hd2.q),v=pr*q,fee=commission(p,v),get=v-fee,cost=hd2.c/hd2.q*q,pl=get-cost;
    hd2.q=QR(hd2.q-q);hd2.c-=cost;if(hd2.q<=0)delete p.stocks[s];p.cash+=get;if(a.k==='cry')axOf(p).cry=(axOf(p).cry||0)+pl;
    log(`${esc(p.name)} ขาย ${a.n} ${q.toLocaleString()} ${unit} @ ${fmtP(a,pr)} ได้ ${B(get)} (${pl>=0?'กำไร':'ขาดทุน'} ${B(Math.abs(pl))})`);toast(`ขาย ${SN(a)} ได้ ${B(get)}`)}
  render();save();checkWin();
}

/* ===================== ธนาคาร: เงินกู้ · ฝากประจำ · กองทุนรวม ===================== */
let BK={pid:-1,loan:0,pay:0};
function bkState(p){if(BK.pid!==p.id)BK={pid:p.id,loan:0,pay:0};return BK}
function bkAdd(k,n){if(!canAct())return;const p=cp(),b=bkState(p);if(n===0){b[k]=0;render();return}
  const cap=k==='loan'?Math.max(0,loanLim(p)-p.loan):Math.min(p.loan,Math.max(0,p.cash));let v=b[k]+n;
  if(v>cap){v=cap;toast(k==='loan'?`กู้ได้อีกสูงสุด ${B(cap)}`:cap<p.loan?`เงินสดมี ${B(Math.max(0,p.cash))} ชำระได้สูงสุดเท่านี้`:`หนี้เหลือ ${B(p.loan)} ชำระได้สูงสุดเท่านี้`)}
  b[k]=v;render()}
function bankAmt(id){const el=$('#'+id);const v=Math.round(+String(el?el.value:'').replace(/[^\d.]/g,''));return v>0?v:0}
function bankFill(id,v){const el=$('#'+id);if(el){el.value=v>0?v:'';el.focus()}}
function bankDo(kind){
  if(!canAct())return;const p=cp();p.dep=p.dep||0;const nm=esc(p.name),lim=loanLim(p);let v=0;
  const bk=bkState(p);
  if(kind==='borrow'){v=bk.loan;if(!v){toast('กดปุ่มเลือกจำนวนเงินที่ต้องการกู้');return}const room=lim-p.loan;if(v>room){toast(`กู้ได้อีกไม่เกิน ${B(Math.max(0,room))} (เพดานหนี้ ${B(lim)})`);return}
    p.loan+=v;p.cash+=v;bk.loan=0;log(`🏦 ${nm} กู้ธนาคาร ${B(v)} · หนี้รวม ${B(p.loan)}`);toast(`กู้ ${B(v)} แล้ว`)}
  else if(kind==='repay'||kind==='payall'){if(!p.loan){toast('ไม่มีหนี้ธนาคาร');return}v=kind==='payall'?p.loan:Math.min(bk.pay,p.loan);if(!v){toast('กดปุ่มเลือกจำนวนเงินที่ต้องการชำระ');return}if(v>p.cash){toast(`เงินสดไม่พอ (มี ${B(p.cash)})`);return}
    p.loan-=v;p.cash-=v;bk.pay=0;log(p.loan?`🏦 ${nm} ชำระหนี้ธนาคาร ${B(v)} · เหลือ ${B(p.loan)}`:`✅ ${nm} ปิดหนี้ธนาคาร ${B(v)} หมดแล้ว`);toast(p.loan?`ชำระ ${B(v)} แล้ว`:'ปิดหนี้ธนาคารแล้ว')}
  else if(kind==='dep'){v=bankAmt('bkDep');if(!v){toast('กรอกจำนวนเงินที่ต้องการฝาก');return}if(v>p.cash){toast(`เงินสดไม่พอ (มี ${B(p.cash)})`);return}
    p.dep+=v;p.cash-=v;log(`💰 ${nm} ฝากประจำ ${B(v)} · เงินฝากรวม ${B(p.dep)}`);toast(`ฝาก ${B(v)} แล้ว`)}
  else if(kind==='wd'||kind==='wdall'){if(!p.dep){toast('ไม่มีเงินฝาก');return}v=kind==='wdall'?p.dep:Math.min(bankAmt('bkWd'),p.dep);if(!v){toast('กรอกจำนวนเงินที่ต้องการถอน');return}
    p.dep-=v;p.cash+=v;log(`💰 ${nm} ถอนเงินฝาก ${B(v)} · เหลือ ${B(p.dep)}`);toast(`ถอน ${B(v)} แล้ว`)}
  render();save();checkWin();
}

function cardCore(k,r){ // common fields: title, cost, passive, active

}
function cardFrom(k,c){const r=dbBlankFor(k);r.t=c.t;
  if(k==='life'){if(c.A||c.P){r.cash=-c.cost;r.act=c.A||0;r.pas=c.P||0;r.opt=1;r.nt=1}else r.cash=c.cost?-c.cost:0}

  else if(k==='opp'){r.cost=c.cost;r.cf=c.P;r.act=c.A||0;r.ty=/คอนโด|บ้าน|อาคาร|หอพัก|ทาวน์|ที่ดิน/.test(c.t)?'re':/กองทุน|สินทรัพย์|หุ้น|ทอง/.test(c.t)?'fund':'biz';Object.assign(r,oppNeedDef(r))}

function csvParse(t){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))out.push(row);row=[]}else cur+=c}row.push(cur);if(row.some(x=>x!==''))out.push(row);return out}

/* ---------- บีบอัดสถานะเกม ---------- */
async function zEnc(str){if(typeof CompressionStream==='undefined')return 'J'+str;
  const b=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'Z'+btoa(s)}
async function zDec(z){if(z[0]==='J')return z.slice(1);const bin=atob(z.slice(1)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}

function axPoll(){if(!S||!S.players||S.winner!=null)return;for(const p of S.players){if(!p||p.bot&&!p.uid)continue;const x=axOf(p);

/* ตรวจเหรียญจากสถานะจบเกม (S ถูกสลับเป็นเกมนั้นแล้ว) · rec = ข้อมูล lb เดิม · คืน {ids ใหม่, ac ใหม่} */
function achEval(me,c,rec){const x=me.ax||{},have=rec.ach||{},ac={scam:0,jobs:{},...(rec.ac||{})},f=fin(me),win=c.win,got=[];

  let cry=x.cry||0;for(const a of ASSETS)if(a.k==='cry'){const hd=me.stocks[a.s];if(hd&&hd.q)cry+=hd.q*S.prices[a.s]-hd.c}
  const ok={first:!!me.badge1,noscam:ac.scam>=3,bal:!!x.bal,charity:(x.don||0)>=100000,noprop:win&&!x.prop,noloan:win&&!x.loan,comeback:win&&!!x.job,
    fast:!!me.badge1&&me.badge1<=15,div:win&&f.passive>0&&f.div>=f.passive*.5,real:win&&c.hum>=3,wins10:((rec.wins||0)+(win?1:0))>=10,
    million:win&&f.passive>=1e6,diamond:!!me.badge2,whale:cry>=1e6,alljobs:Object.keys(ac.jobs).length>=8,
    platinum:(x.nr||0)>=3,sixlegs:!!x.six,escape:!!x.esc,family:win&&(me.kids||0)>=3,landlord:(x.pmax||0)>=6,portfolio:(x.smax||0)>=5,
    cash2m:(x.cmax||0)>=2e6,debtfree:win&&!me.loan&&!(me.debt.home>0)&&!(me.debt.car>0)&&!(me.debt.card>0),storm:win&&(S.disN||0)>=2,blitz:!!me.badge1&&me.badge1<=10,
    nj5:(ac.nj||0)>=5,six5:(ac.n6||0)>=5,plat3:(ac.np||0)>=3,pv3m:(ac.pv||0)>=3e6,dia3:(ac.nd||0)>=3};
  for(const a of ACH)if(ok[a.id]&&!have[a.id])got.push(a.id);return {got,ac}}
/* ความคืบหน้าภารกิจสะสม: [ทำได้, เป้า] จาก lb/{uid}.ac */
function achProg(id,ac,rec){if(!ac&&!rec)return null;ac=ac||{};const P={noscam:[ac.scam||0,3],wins10:[(rec&&rec.wins)||0,10],alljobs:[Object.keys(ac.jobs||{}).length,8],nj5:[ac.nj||0,5],six5:[ac.n6||0,5],plat3:[ac.np||0,3],pv3m:[ac.pv||0,3e6],dia3:[ac.nd||0,3]}[id];return P}

  /* กระดาน 3D: transform ของ .board.v3d เป็น !important จึงซูม/เลื่อนที่กล่องครอบ #bzoom แทน */
  if(bz3()){const Hh=w.clientHeight,mx=W*(BZ.s-1)/2+W*.15,my=Hh*(BZ.s-1)/2+Hh*.15;BZ.x=Math.max(-mx,Math.min(mx,BZ.x));BZ.y=Math.max(-my,Math.min(my,BZ.y));
    /* ซูมทั้งภาพผ่านกล่องครอบ #bzoom (กลางจอ) → กล้องที่ตามตัวหมากยังทำงานปกติ ภาพซูมจึงตามตัวละครไปด้วย */
    const z=$('#bzoom'),hud=$('#hud'),hb=hud&&!hud.hidden?hud.getBoundingClientRect():null,wb=w.getBoundingClientRect(),tp=hb?Math.max(0,hb.bottom-wb.top):0;z.style.transformOrigin=`50% ${Math.round(tp+(Hh-tp)*.62)}px`;/* จุดเดียวกับที่กล้องวางตัวหมาก (v3Center) */
    const dy=(BZ.s-1)*(Hh-tp)*.12;/* เลื่อนลงนิดให้เห็นตัวละครเต็มตัว ไม่ติดแถบด้านบน */
    z.style.transform=BZ.s>1.001?`translate(${BZ.x.toFixed(1)}px,${(BZ.y+dy).toFixed(1)}px) scale(${BZ.s.toFixed(3)})`:'';b.style.transform='';
    w.classList.toggle('zoomed',BZ.s>1.001);$('#bzreset').hidden=true;$('#bzr').hidden=!(BZ.s>1.001);return}
  $('#bzr').hidden=!(BZ.s>1.001);
  const mg=(typeof CAM!=='undefined'&&CAM.active)?Math.min(48,W*.1):0;BZ.x=Math.min(mg,Math.max(W-W*BZ.s-mg,BZ.x));BZ.y=Math.min(mg,Math.max(H-H*BZ.s-mg,BZ.y));
  {const z=$('#bzoom');if(z)z.style.transform=''}b.style.transform=BZ.s>1.001?`translate(${BZ.x}px,${BZ.y}px) scale(${BZ.s})`:'';w.classList.toggle('zoomed',BZ.s>1.001);$('#bzreset').hidden=!(BZ.s>1.001);$('#bzreset').textContent=`⟲ ${Math.round(BZ.s*100)}%`}
const bz3=()=>{const b=$('#board');return !!(b&&b.classList.contains('v3d'))};
function boardZoom(s,cx,cy){const w=$('#bwrap');const r=w.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const ns=Math.min(3,Math.max(1,s));
  if(bz3()){BZ.x*=ns/BZ.s;BZ.y*=ns/BZ.s;BZ.s=ns;if(ns===1){BZ.x=0;BZ.y=0}bzApply();return}
  BZ.x=cx-(cx-BZ.x)*(ns/BZ.s);BZ.y=cy-(cy-BZ.y)*(ns/BZ.s);BZ.s=ns;if(ns===1){BZ.x=0;BZ.y=0}bzApply()}
(function(){const w=$('#bwrap');if(!w)return;
  const loc=e=>{const r=w.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  w.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!(BZ.s>1.001&&e.button===0))return;BZ.pts.set(e.pointerId,loc(e));BZ.moved=false;
    if(BZ.pts.size===2){const [a,b]=[...BZ.pts.values()];BZ.d0=Math.hypot(a.x-b.x,a.y-b.y);BZ.s0=BZ.s;BZ.m0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};BZ.x0=BZ.x;BZ.y0=BZ.y;$('#bzhint').classList.add('gone')}
    else if(BZ.pts.size===1){const a=loc(e);BZ.m0=a;BZ.x0=BZ.x;BZ.y0=BZ.y}});
  w.addEventListener('pointermove',e=>{if(!BZ.pts.has(e.pointerId))return;BZ.pts.set(e.pointerId,loc(e));
    if(BZ.pts.size===2){const [a,b]=[...BZ.pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      const ns=Math.min(3,Math.max(1,BZ.s0*d/BZ.d0));if(bz3()){BZ.x=BZ.x0*(ns/BZ.s0)+(m.x-BZ.m0.x);BZ.y=BZ.y0*(ns/BZ.s0)+(m.y-BZ.m0.y)}else{BZ.x=m.x-(BZ.m0.x-BZ.x0)*(ns/BZ.s0);BZ.y=m.y-(BZ.m0.y-BZ.y0)*(ns/BZ.s0)}BZ.s=ns;BZ.moved=true;bzApply();e.preventDefault()}
    else if(BZ.pts.size===1&&BZ.s>1.001){const a=loc(e),dx=a.x-BZ.m0.x,dy=a.y-BZ.m0.y;if(Math.abs(dx)+Math.abs(dy)>6)BZ.moved=true;BZ.x=BZ.x0+dx;BZ.y=BZ.y0+dy;bzApply()}},{passive:false});
  const up=e=>{BZ.pts.delete(e.pointerId);if(BZ.pts.size===1){const a=[...BZ.pts.values()][0];BZ.m0=a;BZ.x0=BZ.x;BZ.y0=BZ.y}};
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
  w.addEventListener('click',e=>{if(BZ.moved){e.stopPropagation();e.preventDefault();BZ.moved=false}},true);
  w.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const a=loc(e);boardZoom(BZ.s*(e.deltaY<0?1.12:1/1.12),a.x,a.y)},{passive:false});
  let lt=0;w.addEventListener('touchend',e=>{const n=NOW();if(n-lt<280&&!BZ.moved&&e.touches.length===0&&BZ.s>1.001){boardZoom(1)}lt=n});
  window.addEventListener('resize',bzApply);
  setTimeout(()=>{const h=$('#bzhint');if(h)h.classList.add('gone')},6000);
})();
/* ===== ขนาดตัวอักษร ===== */
const TZ_STEPS=[.85,1,1.15,1.3,1.5];let TZI=1;try{const v=+localStorage.getItem('ff-tz');if(TZ_STEPS.includes(v))TZI=TZ_STEPS.indexOf(v)}catch(e){}
function tzApply(){const z=TZ_STEPS[TZI];document.documentElement.style.setProperty('--tz',z);$('#tzMinus').disabled=TZI===0;$('#tzPlus').disabled=TZI===TZ_STEPS.length-1;$('#tzPlus').title=`เพิ่มขนาดตัวอักษร (ตอนนี้ ${Math.round(z*100)}%)`;try{localStorage.setItem('ff-tz',z)}catch(e){}}
$('#tzMinus').onclick=()=>{if(TZI>0){TZI--;tzApply();toast(`ขนาดตัวอักษร ${Math.round(TZ_STEPS[TZI]*100)}%`)}};
$('#tzPlus').onclick=()=>{if(TZI<TZ_STEPS.length-1){TZI++;tzApply();toast(`ขนาดตัวอักษร ${Math.round(TZ_STEPS[TZI]*100)}%`)}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.altKey&&(e.key==='='||e.key==='+')){e.preventDefault();$('#tzPlus').click()}if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key==='-'){e.preventDefault();$('#tzMinus').click()}});
tzApply();

/* ===== กล้องซูมตามตัวหมาก ===== */
const CAM={on:false,active:false};/* ปิดไว้: ผู้เล่นเวียนหัว — ใช้ช่องแนวยาวแทน (เปิดได้โดยตั้ง on:true และแสดง #btnCam) */
function camSync(){const b=$('#btnCam');if(b){b.textContent=CAM.on?'🎥 กล้องตาม: เปิด':'🎥 กล้องตาม: ปิด';b.classList.toggle('on',CAM.on)}}
function toggleCam(){CAM.on=!CAM.on;try{localStorage.setItem('ff-cam',CAM.on?'1':'0')}catch(e){}camSync();if(!CAM.on&&CAM.active)camOff();toast(CAM.on?'กล้องจะซูมตามตัวหมากตอนเดิน':'แสดงภาพรวมกระดานตลอด')}
function camScale(){const c=$('#board .cell');if(!c)return 1;const w=c.offsetWidth;return Math.min(2.6,Math.max(1.35,74/w))}
function camOn(p){if(!CAM.on||MAPMIN||RM||(S&&S.autoPilot))return;CAM.active=true;$('#bwrap').classList.add('cam');camFollow(p)}
function camFollow(p){if(!CAM.active)return;const b=$('#board'),w=$('#bwrap'),c=b&&b.querySelector(`.cell[data-k="${p.ring+p.pos}"]`);if(!c)return;
  const s=camScale(),cx=c.offsetLeft+c.offsetWidth/2,cy=c.offsetTop+c.offsetHeight/2;
  BZ.s=s;BZ.x=w.clientWidth/2-cx*s;BZ.y=b.offsetHeight/2-cy*s;bzApply()}
function camOff(){if(!CAM.active)return;CAM.active=false;BZ.s=1;BZ.x=0;BZ.y=0;bzApply();setTimeout(()=>{if(!CAM.active)$('#bwrap').classList.remove('cam')},500)}
camSync();

/* ===== มุมมองกึ่ง 3D หมุนเข้าหาฝั่งผู้เล่น ===== */
const V3={on:true,ang:0,side:-1,tx:0,SC:2.3};try{V3.on=localStorage.getItem('ff-3d')!=='0'}catch(e){}
function v3Side(p){const L=RING_LEN[p.ring],per=L/4;return Math.floor(p.pos/per)%4}
function v3Update(p){const bd=$('#board'),w=$('#bwrap');if(!bd)return;if(!V3.inited&&w.clientWidth){V3.inited=true;setTimeout(()=>{if(V3.on)render()},80);setTimeout(()=>{if(V3.on)render()},600)}bd.classList.add('v3d');w.classList.add('v3d');w.style.setProperty('--bh',w.clientHeight+'px');const WW=w.clientWidth||360;const SS=Math.max(1.35,Math.min(2.1,760/WW))*(V3.on?1.6:1);w.style.setProperty('--S',SS.toFixed(2));requestAnimationFrame(()=>{const c0=bd.querySelector('.cell.inner');if(c0)bd.style.setProperty('--cw',c0.offsetWidth+'px')});/* เต็มจอ: ระยะกล้องโตตามขนาดกระดาน → ภาพเหมือนเดิมแต่ใหญ่เต็มจอ */w.style.perspective=document.body.classList.contains('fs')?Math.round(820*Math.max(1,SS*WW/1026))+'px':'';
  /* มุมมอง isometric: กล้องมุมเดียวตายตัว (หมุน 45° เอียง 55°) ให้ภาพประจำช่องวางตรงช่องพอดี */
  V3.ang=45;V3.side=0;bd.classList.add('iso');bd.style.setProperty('--tilt','53deg');w.style.perspective='7000px';
  bd.style.setProperty('--ang',V3.ang+'deg');
  const c=bd.querySelector(`.cell[data-k="${p.ring+p.pos}"]`);if(c){
    const key=p.ring+p.pos+'|'+S.cur;if(V3.key!==key){V3.key=key;V3.ux=0;V3.uy=0;w.style.setProperty('--ux','0px');w.style.setProperty('--uy','0px')}
    v3Center(bd,w,c,p)}
  w.classList.toggle('fastcam',!!p.bot&&S.phase==='busy');w.classList.toggle('cardtime',S.phase==='card'&&!p.bot)}
function v3Sync(){const b=$('#btnV3');if(b)b.textContent=V3.on?'🧭 มุมมอง 3D':'🗺 มุมมอง 2D';const bd=$('#board'),w=$('#bwrap');if(!V3.on&&bd){bd.classList.remove('v3d','iso');bd.style.removeProperty('--tilt');w.style.perspective='';w.classList.remove('v3d','cardtime');bd.style.removeProperty('--ang')}}
function toggleV3(){V3.on=!V3.on;if(!V3.on){const h=$('#hud');h.hidden=true;h.innerHTML=''}try{localStorage.setItem('ff-3d',V3.on?'1':'0')}catch(e){}V3.side=-1;BZ.s=1;BZ.x=0;BZ.y=0;$('#board').style.transform='';v3Sync();render()}
v3Sync();

/* ลากเลื่อนกระดาน 3D ด้วยนิ้ว/เมาส์ */
(function(){const w=$('#bwrap');if(!w)return;let d=null;
  w.addEventListener('pointerdown',e=>{if(!w.classList.contains('v3d')||w.classList.contains('cardtime')||e.target.closest('.hud'))return;d={x:e.clientX,y:e.clientY,ux:V3.ux||0,uy:V3.uy||0,id:e.pointerId,mv:false}});
  w.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.mv&&Math.hypot(dx,dy)<8)return;d.mv=true;BZ.moved=true;
    const W=w.clientWidth;V3.ux=Math.max(-W*1.2,Math.min(W*1.2,d.ux+dx));V3.uy=Math.max(-W*.9,Math.min(W*.9,d.uy+dy));w.style.setProperty('--ux',V3.ux+'px');w.style.setProperty('--uy',V3.uy+'px');w.classList.add('dragging');e.preventDefault()},{passive:false});
  const end=e=>{if(d&&e.pointerId===d.id){d=null;w.classList.remove('dragging')}};w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('dblclick',()=>{if(!w.classList.contains('v3d'))return;V3.ux=0;V3.uy=0;w.style.setProperty('--ux','0px');w.style.setProperty('--uy','0px')});
})();

/* ===== เดินแบบลื่น 60fps (3D) ===== */
const STEP_MS=640;let WALK=null;
function walkOn(p){return V3.on&&!MAPMIN&&!RM&&!p.bot&&!(S&&S.autoPilot)}
function walkGeom(p){const bd=$('#board'),c=bd&&bd.querySelector(`.cell[data-k="${p.ring+p.pos}"]`);if(!c)return null;const m=Math.min(c.offsetWidth,c.offsetHeight)*(V3.fs||1),w=m*.92,h=m*2.15;
  return{x:c.offsetLeft+c.offsetWidth/2-w/2,y:c.offsetTop+c.offsetHeight*.82-h,w,h}}
function walkStart(p){if(!walkOn(p))return;const bd=$('#board');let el=bd.querySelector(':scope>.walker');if(!el){el=document.createElement('div');el.className='walker';bd.appendChild(el)}
  const i=jobIdx(p);el.style.setProperty('--pawn',`url(img/pawn-${i}.webp)`);el.style.setProperty('--pc',p.color);
  const g=walkGeom(p);if(!g)return;el.style.transition='none';Object.assign(el.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});el.offsetWidth;el.style.transition='';
  WALK={id:p.id};$('#bwrap').classList.add('walking');$('#bwrap').style.setProperty('--stepms',STEP_MS+'ms')}
function walkTo(p){if(!WALK||WALK.id!==p.id)return;const el=$('#board').querySelector(':scope>.walker');const g=walkGeom(p);if(!el||!g)return;
  Object.assign(el.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});el.classList.remove('bob');el.offsetWidth;el.classList.add('bob')}
async function walkEnd(p){if(!WALK)return;await sleep(STEP_MS*.6);WALK=null;const w=$('#bwrap');w.classList.remove('walking');const el=$('#board').querySelector(':scope>.walker');if(el)el.remove()}

/* จัดช่องของผู้เล่นให้อยู่กลางพื้นที่แผนที่ (วัดจริงหลังแปลงมุมมอง) */
function v3Center(bd,w,c,p){
  /* คำนวณตำแหน่งจากสมการภาพฉาย (ไม่วัดจากจอระหว่างแอนิเมชัน) */
  const W=w.clientWidth,H=w.clientHeight,BW=bd.offsetWidth,BH=bd.offsetHeight;if(!W||!BW)return;
  const hud=$('#hud'),hb=hud&&!hud.hidden?hud.getBoundingClientRect():null,wb=w.getBoundingClientRect();
  const top=hb?Math.max(0,hb.bottom-wb.top):0,X0=W/2,Y0=top+(H-top)*.62;
  const per=parseFloat(getComputedStyle(w).perspective)||800,tilt=(parseFloat(getComputedStyle(bd).getPropertyValue('--tilt'))||52)*Math.PI/180,a=V3.ang*Math.PI/180;
  const x=c.offsetLeft+c.offsetWidth/2-BW/2,y=c.offsetTop+c.offsetHeight/2-BH/2;const po=getComputedStyle(w).perspectiveOrigin.split(' ').map(parseFloat),OX=po[0],OY=po[1];
  const xr=x*Math.cos(a)-y*Math.sin(a),yr=x*Math.sin(a)+y*Math.cos(a);
  const y2=yr*Math.cos(tilt),z=yr*Math.sin(tilt),k=(per-z)/per;
  let tx=OX+(X0-OX)*k-xr-W/2,ty=OY+(Y0-OY)*k-y2-H/2;
  const lim=W*3;tx=Math.max(-lim,Math.min(lim,tx));ty=Math.max(-lim,Math.min(lim,ty));
  /* ขนาดตัวละคร: ตัวผู้เล่นปัจจุบัน (สูง 2.15 เท่าช่อง × กำลังขยายตามระยะ) ต้องไม่สูงเกิน 88% ของพื้นที่จากเท้าถึงขอบ HUD */
  {const cm=Math.min(c.offsetWidth,c.offsetHeight),mag=1/Math.max(.2,k),fig=2.15*cm*mag,av=(Y0-top)*.88;const f=Math.max(.45,Math.min(1,av/Math.max(1,fig)))*(bd.classList.contains('iso')?.62:1);V3.fs=f;w.style.setProperty('--fs',f.toFixed(3))}
  bd.style.setProperty('--tx',tx+'px');w.style.setProperty('--typx',ty+'px');V3.tx=tx;V3.ty=ty}

/* แผงข้อมูลตอนเลือกกองการ์ด: ตัวละครเต็มตัว + การเงิน + ค่าพลัง */
function cardInfo(p){const f=fin(p),i=jobIdx(p),pose=f.flow<0?'think':p.st.t<=2?'sad':'thumb';
  const st=k=>`<div class="ci-st"><span>${ii(STI[k])}</span><b>${p.st[k]}</b><small>/10</small><i style="--v:${p.st[k]*10}%;--c:${{h:'#e0607e',t:'#e0a030',k:'#4a8fd8'}[k]}"></i></div>`;
  const pct=f.expenses?Math.round(lv1Pct(f)):0;
  return `<div class="cinfo">${i>=0?`<img class="ci-fig" src="img/c${i}-${pose}.webp" alt="">`:''}<div class="ci-body">
   <div class="ci-row"><div class="ci-k"><span>เงินสด</span><b class="num">${B(p.cash)}</b></div><div class="ci-k"><span>คงเหลือ/เดือน</span><b class="num ${f.flow>=0?'pos':'neg'}">${f.flow>=0?'+':''}${B(f.flow)}</b></div>${p.loan?`<div class="ci-k"><span>หนี้ธนาคาร</span><b class="num neg">${B(p.loan)}</b></div>`:''}</div>
   <div class="ci-goal"><span>Passive <b class="pos">${B(f.passive)}</b> / เป้า <b class="neg">${B(lv1Goal(f))}</b> (รายจ่าย×2)</span><i style="--v:${pct}%"></i></div>
   <div class="ci-sts">${st('h')}${st('t')}${st('k')}</div></div></div>`}
</script>
