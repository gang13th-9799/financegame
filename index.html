<li>ตลาดหุ้นและสินค้าเทรดได้ตลอดเทิร์นของคุณ ช่องตลาดหลักทรัพย์ (เมืองหลวง) เทรดฟรีค่าคอม</li>
<li><b>ธุรกิจ A</b> (ธุรกิจเครือข่าย): ไม่มีช่องบนแผนที่ สมัคร ฿900 เพื่อเปิดแท็บธุรกิจ A · จั่วกองการ์ดธุรกิจ A เพื่อสร้างสายงาน A–F ทำยอด PV และไต่ระดับ สมาชิก → ซิลเวอร์ → โกลด์ → แพลทินัม → รูบี้ → เพิร์ล → เอเมอรัลด์ → ไดมอนด์ · การ์ดในกองนี้ส่วนใหญ่ใช้เวลา 1</li>
<li><b>ศูนย์เรียนรู้</b> (ชั้นนอก 4 ช่อง ชั้นใน 2 ช่อง): ได้ความรู้ +2–4 และสกิลการ์ดสุ่ม 1 อย่าง ฟรี</li><li><b>แท็บตลาด</b>: ทุกต้นรอบ NPC เปิดการ์ดโอกาส 2 ใบ · ธุรกิจ/อสังหาฯ ขึ้นแท็บตลาด ซื้อได้ในตาของคุณ ใครยืนยันก่อนได้ (บอทซื้อได้เฉพาะตาของบอท) · ข่าวหุ้น/คริปโต/สินค้า/กองทุน ขึ้นแท็บข่าวสารและมีผลกับราคาทันที · โชว์ 2 รอบ · ในแท็บตลาดยังติดป้ายขาย ซื้อจากป้ายคนอื่น และขายให้ธนาคารได้</li>
<li>ซื้อขายทรัพย์สินกับผู้เล่นอื่นได้ กู้ธนาคารได้ ดอกเบี้ย 10% ต่อเดือน</li>
<li>⏱ <b>เทิร์นละไม่เกิน 3 นาที</b> หมดเวลาแล้วจบเทิร์นอัตโนมัติ (การตัดสินใจที่ค้างจะถูกปฏิเสธ) · กด <b>จบเทิร์น</b> ก่อนครบ 3 นาทีได้ ⏳ เวลา +1</li>
<li><b>ค่าพลัง (เต็ม 10)</b>: ❤ หัวใจ (สุขภาพกายและใจ) · ⏳ เวลา · 📚 ความรู้ — เรียนรู้ใช้เวลา 2 ได้ความรู้ +2 · ดีลธุรกิจใช้เวลา 2 อสังหาฯ นอกกระดานใช้เวลา 1 · ธุรกิจและอสังหาฯ (บนกระดานและการ์ดโอกาส) ให้ผลตอบแทน 6–8% ต่อเดือนตามเขต (เกษตร 6% · ชุมชน/ที่พักหรู 6.5% · อุตสาหกรรม/ช้อปปิ้ง 7% · ท่องเที่ยว/ธุรกิจ 7.5% · การเงิน 8%) ผลตอบแทนยิ่งสูงยิ่งต้องใช้ความรู้มาก (×1–2.5) · ความรู้ 7 ขึ้นไปมองเห็นกลโกง · ทุกวันเงินเดือน (ผ่านหรือหยุด) ❤ หัวใจ สุ่ม −1 ถึง +1 และ <b>ลด −1 ต่อความเครียดแต่ละข้อ</b> (รายรับไม่พอรายจ่าย · หนี้ธนาคารเกิน 3 เท่าของเงินเดือน · ⏳ เหลือ ≤2 · ตกงาน · มีลูก 2 คนขึ้นไป) · ⏳ เวลา +1–3 · 📚 ความรู้ −0–1 · <b>การ์ดชีวิต/โอกาส/ธุรกิจ A หัก ⏳ ❤ 📚 ที่ต้องใช้ออกจริง</b> (การ์ดเรียนรู้และอสังหาฯ บนกระดานใช้ 📚 เป็นเกณฑ์ขั้นต่ำ ไม่หัก) · <b>ได้ ⏳ คืนเพิ่ม</b>: ช่องพักผ่อน 🌿 (⏳+1–2 ❤+1) · การ์ดชีวิตบางใบ · ปุ่มจ้างคนช่วย ฿10,000 = ⏳+1 (เทิร์นละครั้ง) · วันเงินเดือนถ้า Passive ถึง 25%/50%/75% ของรายจ่าย ได้ ⏳+1/+2/+3 · ธุรกิจ A เลื่อนระดับละ ⏳+1 · จบเทิร์นก่อนเวลา ⏳+1 · หัวใจ ≤2 เสียค่ารักษา หัวใจหมดป่วยหนักขาดงาน</li>
<li><b>❤ หัวใจต่ำ (2 หรือต่ำกว่า)</b>: ทุกวันเงินเดือนจ่ายค่ารักษา 20% ของเงินเดือน · ตกงานมาจากช่องตกงานหรือการ์ดตกงานเท่านั้น · เมื่อระบบใช้กติกาอัตโนมัติ (กู้อัตโนมัติ ค่ารักษา ล้มละลาย) จะมีกล่อง 📌 แจ้งสาเหตุ</li>
<li><b>ชนะ Lv.1 🏆</b>: รายได้จากทรัพย์สิน (Passive Income) มากกว่ารายจ่ายรวม ได้ถ้วยข้างชื่อ เกมเล่นต่อได้ · <b>ชนะ Lv.2 💎</b>: ธุรกิจ A ระดับไดมอนด์ เกมจบทันที · กด "จบเกมและสรุปผล" ในแท็บผู้เล่นเพื่อจบเกมเมื่อไรก็ได้</li></ol>`;

function resume(){
  if(S.cm0==null)cryInit();
  if(!S.mkOn){S.adj={};for(const k in MKT){const a=AS(k),base=a.p*MKT[k][Math.min(cryIdx(),CRY_N-1)]/MKT[k][S.cm0];S.adj[k]=(S.prices[k]||base)/base}S.mkOn=1}
  syncDiv();
  for(const a of ASSETS)if(S.prices[a.s]==null){S.prices[a.s]=a.p;S.hist[a.s]=[a.p]}for(const q of S.players)q.dep=q.dep||0;
  if(S.winner!=null){render();return}
  if(S.phase==='busy')S.phase='card';
  S.autoPilot=false;S.turnEnd=Date.now()+TURN_MS;
  if(PAR()){render();if(!S.rp&&parMaster())parStartRound();return}
  render();const p=cp();if(!p.bot)return;
  if(S.phase==='roll')botTurn();
  else if(S.phase==='card')sleep(S.speed).then(()=>pickPile(botPile(p)));
  else if(S.phase==='free')sleep(S.speed).then(()=>endTurn(true));
}

function assetsOf(p){
  const out=[];
  for(const k in S.props)if(S.props[k].o===p.id)out.push({key:'p:'+k,n:SQ(k).n,fair:S.props[k].inv,cf:propCf(k),cat:'prop',z:SQ(k).z});
  for(const d of p.deals)if(d.ty!=='scam')out.push({key:'d:'+d.id,n:d.t,fair:d.cost,cf:dealCf(p,d),cat:d.ty});
  for(const a of ASSETS){const hd=p.stocks[a.s];if(hd&&hd.q)out.push({key:'s:'+a.s,n:`${a.n} ${hd.q.toLocaleString()} ${a.k==='stock'?'หุ้น':'หน่วย'}`,fair:Math.round(hd.q*S.prices[a.s]),cf:a.div?Math.round(hd.q*a.div):0,cat:'stk',s:a.s})}
  return out;
}
function findAsset(p,key){return assetsOf(p).find(a=>a.key===key)}
function moveAsset(from,to,key,paid){
  const [t,r]=[key[0],key.slice(2)];
  if(t==='p'){if(to)S.props[r].o=to.id;else delete S.props[r]}
  else if(t==='d'){const d=from.deals.find(x=>String(x.id)===r);from.deals=from.deals.filter(x=>x!==d);if(to)to.deals.push(d)}
  else{const hd=from.stocks[r];delete from.stocks[r];if(to)addHold(to,r,hd.q,paid)}
}
function cleanListings(){S.listings=(S.listings||[]).filter(l=>findAsset(P(l.seller),l.key))}
function bankOffers(p){

    ()=>{const z=Object.keys(ZONES)[Math.floor(Math.random()*8)];return {id:'z'+z,t:`รับซื้ออสังหาฯ ${ZONES[z].n}`,m:1+Math.round(Math.random()*5)/10,match:a=>a.cat==='prop'&&a.z===z}},

    ()=>{const a=ASSETS[Math.floor(Math.random()*ASSETS.length)];return {id:'s'+a.s,t:`รับซื้อ${a.n}`,m:1.05+Math.round(Math.random()*4)/20,match:x=>x.cat==='stk'&&x.s===a.s}},
  ];

function botMarket(p,offers,mine,others,avail,soldBank){

}

const KIDMAX=4;
function lifePreview(p,c){const R=[];
  if(+c.cash>0)R.push(chip('💵',`+${B(+c.cash)}`,'','gain'));
  if(+c.cpct){const a=rnd100(p.salary*Math.abs(c.cpct)/100);R.push(chip(c.cpct>0?'💵':'💸',`${c.cpct>0?'+':'−'}${B(a)}`,`${Math.abs(c.cpct)}% เงินเดือน`,c.cpct>0?'gain':'cost'))}
  if(+c.spct)R.push(chip('📈',`+${c.spct}%`,`≈+${B(rnd100(p.salary*c.spct/100))}/ด.`,'gain'));
  if(+c.mexp)R.push(chip('🧾',`+${B(lifeCost(p,+c.mexp))}`,'รายจ่าย/เดือน','cost'));
  if(+c.kid){R.push(chip('👶',`${p.kids+1}/${KIDMAX}`,`+${B(p.kidCost)}/ด.`,'cost'));R.push(chip('⏳','−1','ทุกเดือน','use'));R.push(chip('✨','❤−1 · +5%','ธุรกิจ','gain2'))}
  if(+c.h>0)R.push(chip('❤',`+${+c.h}`,'','gain'));if(+c.tt>0)R.push(chip('⏳',`+${+c.tt}`,'','gain'));if(+c.k>0)R.push(chip('📚',`+${+c.k}`,'','gain'));
  if(+c.act)R.push(chip('💼',`+${B(+c.act)}`,'Active/ด.','gain2'));if(+c.pas)R.push(chip('📈',`+${B(+c.pas)}`,'Passive/ด.','gain'));
  return chips(R)}
async function lifeCard(p,c,src){
  if(c.sp==='jobless'){await joblessHit(p);return}
  if(+c.kid&&p.kids>=KIDMAX){log(`${esc(p.name)} มีลูกครบ ${KIDMAX} คนแล้ว ข้ามการ์ด ${esc(c.t)}`);await choose({actor:p,kind:'life',title:esc(c.t),body:`<p>คุณมีลูกครบ ${KIDMAX} คนแล้ว (สูงสุดในเกม) การ์ดนี้ไม่มีผล</p>`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});return}
  if(+c.perkid&&!p.kids){log(`${esc(p.name)} ยังไม่มีลูก ข้ามการ์ด ${esc(c.t)}`);await choose({actor:p,kind:'life',title:esc(c.t),body:'<p>คุณยังไม่มีลูก การ์ดนี้ไม่มีผล</p>',opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});return}
  if(+c.perkid)c={...c,cash:(+c.cash||0)*p.kids,t:`${c.t} (ลูก ${p.kids} คน)`};
  const forced=+c.acc||!!src||(+c.kid&&p.kids<2);
  if(!forced){const cost=lifeCost(p,Math.max(0,-(+c.cash||0)));
    const gain=(+c.h>0?+c.h:0)+(+c.tt>0?+c.tt:0)+(+c.k>0?+c.k:0);
    const botY=(+c.cash>0||+c.cpct>0||+c.spct>0||+c.act||+c.pas)?(cost<p.cash):(gain&&cost<=(p.cash-fin(p).expenses)*.3&&(p.st.h<=5||p.st.t<=5));
    const ok=await buyFlow(p,cost,{kind:'life',verb:cost?'จ่าย':'รับ',no:'ข้าม',needK:+c.nk||0,cf:(+c.pas||0)+(+c.act||0),bot:botY,title:esc(c.t),body:`${lifePreview(p,c)}${cost||+c.mexp?zoneChip(p):''}`});
    if(!ok){log(`${esc(p.name)} ข้าม ${esc(c.t)}`);return}
    const res=lifeApply(p,{...c,cash:Math.max(0,+c.cash||0)});log(`🔺 ${esc(p.name)}: ${esc(c.t)}${cost?` จ่าย ${B(cost)}`:''} — ${res}`);render();return}
  const res=lifeApply(p,c);log(`${c.neg?'🔻':'🔺'} ${esc(p.name)}: ${c.t} — ${res}`);render();
  await choose({actor:p,kind:'life',pose:+c.kid?'happy':+c.acc?'shock':src?'sad':'happy',title:c.t,body:`${src?`<p class="muted">${src}</p>`:`${+c.kid?'<p class="neg">ลูกคนที่ 1–2 บังคับรับ</p>':'<p class="neg">อุบัติเหตุ · บังคับรับ</p>'}`}<p class="${c.neg?'neg':'pos'}"><b>${res}</b></p>${+c.kid?`<p>⏳ ดูแลลูก −1 ทุกวันเงินเดือน (ต่อลูก 1 คน)</p><p class="pos">👶 แรงบันดาลใจ: ธุรกิจ/งานที่ใช้หัวใจ ใช้ ❤ ลดลง 1 ต่อลูก · รายได้ธุรกิจ +5% ต่อลูก</p>`:''}${+c.cash<0||+c.mexp?`<p class="muted">${zoneNote(p)}</p>`:''}`,opts:[{v:'ok',l:'รับทราบ',c:'pri'}],bot:'ok'});
}

function gainSkill(p,k){const s=SKILLDB[k];if(!s)return;
  if(s.kind==='active'){p.charges=p.charges||{};p.charges[k]=(p.charges[k]||0)+s.uses;log(`🃏 ${esc(p.name)} ได้สกิลการ์ด ${esc(s.n)} +${s.uses} ครั้ง (มี ${p.charges[k]})`);toast(`🃏 ${p.name} ได้สกิลการ์ด ${s.n} ×${s.uses}`);return}
  p.skills.push(k);if(s.eff==='salary')p.salary=rnd100(p.salary*(1+s.val/100));log(`🎓 ${esc(p.name)} ได้ทักษะ ${skillName(k)}`);toast(`${p.name} ได้ทักษะ ${skillName(k)}`)}

/* ===================== NPC เปิดการ์ดโอกาสทุกต้นรอบ · แท็บตลาด / แท็บข่าวสาร =====================
   ทุกต้นรอบ (และตอนเริ่มเกม) NPC จั่วการ์ดโอกาส 2 ใบจากกองเดียวกับผู้เล่น
   ธุรกิจ/อสังหาฯ/แชร์/ข้อเสนอซื้อ/รีไฟแนนซ์/ธุรกิจ A → S.mk (แท็บตลาด) · ข่าว/หุ้น IPO/ทอง/กองทุน → S.nw (แท็บข่าวสาร)
   โชว์ 2 รอบ (exp = รอบที่เปิด + 1) · ซื้อได้ในตาของตัวเอง ใครยืนยันก่อนได้ · บอทซื้อได้เฉพาะตาของบอท */
const NPC_MK=['re','biz','scam','buyer','refi','netinv'];
const NPC_BUYPRE=['re','biz','scam','fund'];
function npcDraw(){if(!S)return;
  S.mk=(S.mk||[]).filter(x=>x.exp>=S.round&&x.sold==null);S.nw=(S.nw||[]).filter(x=>x.exp>=S.round&&x.sold==null);
  const out=[],news=[];
  for(let i=0;i<2;i++){const d=parDeck('opp'),c0=OPP[d.pop()];if(!c0)continue;let c={...c0};const id='n'+S.round+'_'+i+'_'+Math.random().toString(36).slice(2,6);
    if(NPC_MK.includes(c.ty)){if(['re','biz'].includes(c.ty)){const zs=Object.keys(ZROI);c=oppPrep(c,zs[Math.floor(Math.random()*zs.length)])}S.mk.push({id,c,r0:S.round,exp:S.round+1});out.push('🏪 '+esc(c.t))}
    else{S.nw.push({id,c,r0:S.round,exp:S.round+1});if(c.ty==='mnews'||c.e)news.push({c,by:'NPC'});out.push('📰 '+esc(c.t))}}
  if(news.length)parApplyNews(news);
  log(`🧑‍💼 NPC เปิดการ์ดโอกาส 2 ใบ: ${out.join(' · ')}`);
  const cur=S.players&&S.players.find(q=>!q.bot);if(cur)ruleNote(cur,'NPC เปิดการ์ดโอกาสต้นรอบ',`${out.join(' · ')} — ดูได้ที่แท็บตลาด / ข่าวสาร (อยู่ 2 รอบ)`)}
function npcLeft(x){return x.exp-S.round+1}
async function npcClaim(L,who){if(L.sold!=null)return L.sold===who;
  if(ON.play&&S.par&&S.rp==='h'){const x=await ON.be.tx(`rooms/${ON.code}/mk/${L.id}`,cur=>cur==null?who:undefined);const ok=!!(x.ok&&x.val===who);L.sold=ok?who:x.val;render();return ok}
  L.sold=who;return true}
async function npcTake(id){
  const L=[...(S.mk||[]),...(S.nw||[])].find(x=>x.id===id);if(!L)return;
  if(L.sold!=null){toast('มีผู้เล่นอื่นรับโอกาสนี้ไปแล้ว');return}
  if(!canAct()){toast('รับโอกาสได้ตอนตาของคุณ');return}

function addHold(p,s,q,cost){const h=p.stocks[s]||(p.stocks[s]={q:0,c:0});h.q+=q;h.c+=cost}
function commission(p,v){return S.freeComm||skHas(p,'stock')?0:Math.round(v*.01)}
async function trade(s,dir,lots){
  if(!canAct())return;const p=cp(),a=AS(s),pr=S.prices[s],unit=UNIT(a),hd=p.stocks[s];
  let q=LOT(a)*lots;
  if(dir<0){if(!hd||!hd.q){toast('ยังไม่มีให้ขาย');return}q=Math.min(q,hd.q)}
  const v=pr*q,fee=commission(p,v),prS=a.k==='com'?B(pr):'฿'+pr.toFixed(2);
  const row=(k,val,cls='')=>`<b>${k}</b><span class="num ${cls}">${val}</span>`;
  let body=`<div class="kv">${row('สินทรัพย์',`${a.n} (${a.s})`)}${row('ราคาตอนนี้',`${prS} ต่อ${unit}`)}${row('จำนวน',`${q.toLocaleString()} ${unit}`)}${row('มูลค่า',B(v))}${row('ค่าคอม',fee?B(fee):'ฟรี',fee?'neg':'')}`;
  let opts;
  if(dir>0){
    const total=v+fee,after=p.cash-total,L=Math.ceil(Math.max(0,-after)/1000)*1000;
    const nq=(hd?hd.q:0)+q,nc=(hd?hd.c:0)+total;
    body+=`${row('รวมจ่าย',B(total),'neg')}${row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(after)}`,after<0?'neg':'')}${row('ถือหลังซื้อ',`${nq.toLocaleString()} ${unit} · ทุนเฉลี่ย ${fmtAvg(a,nc/nq)}`)}${a.div?row('ปันผลต่อเดือน (หลังซื้อ)','+'+B(nq*a.div*(1+skV(p,'stock')/100)),'pos'):''}</div>`;
    if(after<0)body+=`<p class="lack">เงินสดขาด ${B(-after)} · กดกู้เพื่อซื้อได้ (ดอกเบี้ย ${LOAN_TXT} ต่อเดือน)</p>`;
    opts=[after<0?{v:'loan',l:`กู้ ${B(L)} แล้วซื้อ`,c:'pri'}:{v:'ok',l:`ยืนยันซื้อ ${B(total)}`,c:'pri'},{v:'no',l:'ยกเลิก'}];
    const r=await choose({title:`ซื้อ ${a.n}`,body,opts});
    if(r==='no')return;
    if(r==='loan'){p.loan+=L;p.cash+=L;log(`🏦 ${esc(p.name)} กู้ ${B(L)} เพื่อซื้อ${a.n}`)}
    p.cash-=total;addHold(p,s,q,total);log(`${esc(p.name)} ซื้อ ${a.n} ${q.toLocaleString()} ${unit} @ ${prS} รวม ${B(total)}`);
  }else{
    const avg=hd.c/hd.q,cost=avg*q,get=v-fee,pl=get-cost;
    body+=`${row('ได้รับสุทธิ',B(get))}${row('ทุนเฉลี่ย',`${fmtAvg(a,avg)} ต่อ${unit}`)}${row('ทุนของส่วนที่ขาย',B(cost))}${row('กำไร/ขาดทุน',`${pl>=0?'+':'−'}${B(Math.abs(pl))} (${pl>=0?'+':''}${(pl/cost*100).toFixed(1)}%)`,pl>=0?'pos':'neg')}${row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(p.cash+get)}`)}${row('เหลือถือ',`${(hd.q-q).toLocaleString()} ${unit}`)}</div>`;
    if(q<LOT(a)*lots)body+=`<p class="muted">มีอยู่ ${hd.q.toLocaleString()} ${unit} จึงขายได้เท่านี้</p>`;
    const r=await choose({title:`ขาย ${a.n}`,body,opts:[{v:'ok',l:`ยืนยันขาย ${B(get)}`,c:'pri'},{v:'no',l:'ยกเลิก'}]});
    if(r==='no')return;
    hd.q-=q;hd.c-=cost;if(!hd.q)delete p.stocks[s];p.cash+=get;
    log(`${esc(p.name)} ขาย ${a.n} ${q.toLocaleString()} ${unit} @ ${prS} ได้ ${B(get)} (${pl>=0?'กำไร':'ขาดทุน'} ${B(Math.abs(pl))})`);
  }
  render();save();checkWin();
}

    <div class="fld" id="tbw"><label for="tb">ขายให้ใคร</label><select id="tb" data-f="b">${S.players.filter(q=>q.id!==p.id).map(q=>`<option value="${q.id}">${esc(q.name)} (เงินสด ${B(q.cash)})</option>`).join('')}</select></div>
    <div class="fld"><label for="tp">ราคาเสนอ (บาท)</label><input id="tp" data-f="p" type="number" min="0" step="1000" inputmode="numeric"></div>`,
    opts:[{v:'ok',l:'ส่งข้อเสนอ',c:'pri'},{v:'x',l:'ยกเลิก'}],

  if(buyer.cash<price){toast(`${buyer.name} มีเงินสดไม่พอ`);return}
  const fair=Math.max(it.fair,it.cf*10);
  const botOk=other===buyer?(price<=fair*1.1&&buyer.cash-price>=fin(buyer).expenses*.5):(price>=fair*1.3);
  const v=await choose({actor:other,title:'ข้อเสนอซื้อขาย',handoff:other.name,body:`<p><b>${esc(p.name)}</b> ${other===buyer?'เสนอขาย':'ขอซื้อ'} <b>${esc(it.n)}</b> (รายได้ +${B(it.cf)}/เดือน) ราคา <b class="num">${B(price)}</b></p><p class="muted">${esc(other.name)} มีเงินสด ${B(other.cash)}</p>`,opts:[{v:'y',l:'ตกลง',c:'pri'},{v:'n',l:'ปฏิเสธ'}],bot:botOk?'y':'n'});
  if(v!=='y'){log(`${esc(other.name)} ปฏิเสธข้อเสนอเรื่อง ${esc(it.n)}`);toast(`${other.name} ปฏิเสธ`);return}
  if(PARH()&&other.uid!==ON.user.uid){/* ออนไลน์เล่นพร้อมกัน: ฝั่งเราทำทันที ฝั่งอีกคนส่งไปให้เครื่องเขาบวกเอง */
    const d=it.k==='d'?seller.deals.find(x=>x.id===it.id):null;
    if(other===buyer){p.cash+=price;if(d)p.deals=p.deals.filter(x=>x!==d);parLed(buyer.id,{cash:-price,add:d||null,note:`🤝 ซื้อ ${it.n} จาก ${p.name} ${B(price)}`})}
    else{pay(p,price);if(d)p.deals.push(d);parLed(seller.id,{cash:price,rem:d?d.id:null,note:`🤝 ขาย ${it.n} ให้ ${p.name} ${B(price)}`})}
    if(it.k==='p'){S.props[it.i].o=buyer.id;ON.be.set(`rooms/${ON.code}/pr/${it.i}`,S.props[it.i]);ON.prSent=ON.prSent||{};ON.prSent[it.i]=JSON.stringify(S.props[it.i])}
  }else{
  buyer.cash-=price;seller.cash+=price;

  }
  log(`🤝 ${esc(seller.name)} ขาย ${esc(it.n)} ให้ ${esc(buyer.name)} ${B(price)}`);render();save();checkWin();
}

/* ===================== BOTS ===================== */
function botWants(p,cost,cf){
  const f=fin(p);if(cf<0)return false;
  if(p.cash-cost>=f.expenses*.5)return cf>0||Math.random()<.5;
  const L=Math.ceil(Math.max(0,cost-p.cash)/1000)*1000;
  return cf>0&&cf>L*LOAN_R*2&&f.flow>0&&p.loan+L<p.salary*6;
}
function botRoad(p,into){const f=fin(p);if(into)return p.cash>150000&&f.flow>15000&&Math.random()<.7?'go':'stay';return p.cash<80000||Math.random()<.35?'go':'stay'}
function botPile(p){const f=fin(p),r=Math.random();if(p.net.on&&r<.25)return 'net';if(!p.net.on&&r<.08)return 'net';if(p.skills.length<4&&p.cash>f.expenses*1.5&&r<.3)return 'learn';if(r<.75)return 'opp';return 'life'}
async function botInvest(p){
  if(p.st.t<=2&&!p.hired&&p.cash>HIRE_COST+fin(p).expenses*1.5)await hireHelp(p);
  const f=fin(p),res=f.expenses;
  while(p.loan>=10000&&p.cash-10000>res*1.5){p.loan-=10000;p.cash-=10000}
  for(const k of ['card','car'])if(p.debt[k]>0&&p.cash-p.debt[k]>res*1.5){p.cash-=p.debt[k];p.debt[k]=0;p.exp[k]=0;log(`✅ ${esc(p.name)} ปิดหนี้${k==='card'?'บัตรเครดิต':'รถ'}`)}
  for(const a of ASSETS){const h=p.stocks[a.s];if(h&&h.q&&!a.div&&S.prices[a.s]*h.q>h.c*1.25){const v=S.prices[a.s]*h.q;p.cash+=v-commission(p,v);log(`${esc(p.name)} ขายทำกำไร ${a.n} ${B(v)}`);delete p.stocks[a.s]}}
  const surplus=p.cash-res*2;
  if(surplus>20000){const best=ASSETS.filter(a=>a.div).sort((x,y)=>y.div/S.prices[y.s]-x.div/S.prices[x.s])[0];
    const lots=Math.floor(surplus*.5/(S.prices[best.s]*1000));if(lots>0){const v=lots*1000*S.prices[best.s],fee=commission(p,v);p.cash-=v+fee;addHold(p,best.s,lots*1000,v+fee);log(`${esc(p.name)} ซื้อหุ้นปันผล ${best.n} ${(lots*1000).toLocaleString()} หุ้น`)}}
  save();
}

function passiveDetail(p,k){const s=SKILLDB[k];if(!s)return '';const v=s.val;
  if(s.eff==='rent'){let b=0;for(const kk in S.props)if(S.props[kk].o===p.id){const pr=S.props[kk],q=SQ(kk);b+=(q.cf+pr.l*q.upcf)*(fullZone(p.id,q.z)?1.5:1)*v/100}for(const d of p.deals)if(d.ty==='re')b+=d.cf*v/100;return `ตอนนี้ช่วยเพิ่มค่าเช่า +${B(b)} ต่อเดือน`}

    const over=L>0&&p.loan+L>loanLim(p);if(over&&q){ok=false;h+=`<p class="lack" style="grid-column:1/-1;margin:4px 0 0">เงินสดขาด ${B(-after)} และกู้เพิ่มได้อีกไม่เกิน ${B(Math.max(0,loanLim(p)-p.loan))} (เพดานหนี้) · ลดจำนวนลง</p>`}
    else if(after<0&&q)h+=`<p class="lack" style="grid-column:1/-1;margin:4px 0 0">เงินสดขาด ${B(-after)} · ยืนยันแล้วระบบจะกู้ ${B(L)} (ดอกเบี้ย ${LOAN_TXT} ต่อเดือน)</p>`;
    lbl=!q?'เลือกจำนวนก่อน':over?'เกินวงเงินกู้':after<0?`กู้ ${B(L)} แล้วซื้อ ${B(total)}`:`ยืนยันซื้อ ${B(total)}`}
  else{const get=v-fee,avg=have?hd.c/have:0,cost=avg*q,pl=get-cost;
    h=row('มูลค่า',B(v))+row('ค่าธรรมเนียม 1%',fee?B(fee):'ฟรี',fee?'neg':'')+row('<b>ได้รับสุทธิ</b>',B(get),'pos big')+(q?row('กำไร/ขาดทุน',`${pl>=0?'+':'−'}${B(Math.abs(pl)).replace('−','')} (${pl>=0?'+':''}${(cost?pl/cost*100:0).toFixed(1)}%)`,pl>=0?'pos':'neg'):'')+row('เงินสดก่อน → หลัง',`${B(p.cash)} → ${B(p.cash+get)}`)+row('เหลือถือ',`${(have-q).toLocaleString()} ${unit}`);

function tradeUpd(){

  m.querySelectorAll('.trdir button').forEach(b=>b.classList.toggle('on',+b.dataset.d===TR.dir));
  m.querySelector('#trall').hidden=TR.dir>0;
  const ok=m.querySelector('.mf button[data-i="0"]');if(ok){ok.disabled=!c.ok;ok.textContent=c.lbl;ok.classList.toggle('sell',TR.dir<0)}
}
function trDir(d){if(!TR)return;const c=tradeCalc();if(d<0&&!c.have){toast('ยังไม่มีให้ขาย');return}TR.dir=d;TR.q=d<0?Math.min(TR.q,c.have):TR.q;tradeUpd()}
function trAdd(n){if(!TR)return;const c=tradeCalc();let q=QR(TR.q+n);if(TR.dir<0&&q>c.have){q=c.have;toast(`มีอยู่ ${c.have.toLocaleString()} ${c.unit} ขายได้สูงสุดเท่านี้`)}TR.q=q;tradeUpd()}
function trSet(q){if(!TR)return;TR.q=Math.max(0,q);tradeUpd()}

   <div class="trsteps2"><button class="sm" onclick="trSet(0)">ล้าง</button><button class="sm" id="trall" onclick="trSet(${have})" hidden>ขายทั้งหมด ${have.toLocaleString()}</button></div>
   <div class="kv trcalc" id="trcalc"></div></div>`;

  const t=TR;TR=null;if(r!=='ok'||!t||!t.q)return;

  else{if(!hd2||!hd2.q)return;const q=Math.min(t.q,hd2.q),v=pr*q,fee=commission(p,v),get=v-fee,cost=hd2.c/hd2.q*q,pl=get-cost;

let BK={pid:-1,loan:0,pay:0};
function bkState(p){if(BK.pid!==p.id)BK={pid:p.id,loan:0,pay:0};return BK}
function bkAdd(k,n){if(!canAct())return;const p=cp(),b=bkState(p);if(n===0){b[k]=0;render();return}
  const cap=k==='loan'?Math.max(0,loanLim(p)-p.loan):Math.min(p.loan,Math.max(0,p.cash));let v=b[k]+n;
  if(v>cap){v=cap;toast(k==='loan'?`กู้ได้อีกสูงสุด ${B(cap)}`:cap<p.loan?`เงินสดมี ${B(Math.max(0,p.cash))} ชำระได้สูงสุดเท่านี้`:`หนี้เหลือ ${B(p.loan)} ชำระได้สูงสุดเท่านี้`)}
  b[k]=v;render()}
function bankAmt(id){const el=$('#'+id);const v=Math.round(+String(el?el.value:'').replace(/[^\d.]/g,''));return v>0?v:0}
function bankFill(id,v){const el=$('#'+id);if(el){el.value=v>0?v:'';el.focus()}}
function bankDo(kind){
  if(!canAct())return;const p=cp();p.dep=p.dep||0;const nm=esc(p.name),lim=loanLim(p);let v=0;
  const bk=bkState(p);
  if(kind==='borrow'){v=bk.loan;if(!v){toast('กดปุ่มเลือกจำนวนเงินที่ต้องการกู้');return}const room=lim-p.loan;if(v>room){toast(`กู้ได้อีกไม่เกิน ${B(Math.max(0,room))} (เพดานหนี้ ${B(lim)})`);return}
    p.loan+=v;p.cash+=v;bk.loan=0;log(`🏦 ${nm} กู้ธนาคาร ${B(v)} · หนี้รวม ${B(p.loan)}`);toast(`กู้ ${B(v)} แล้ว`)}
  else if(kind==='repay'||kind==='payall'){if(!p.loan){toast('ไม่มีหนี้ธนาคาร');return}v=kind==='payall'?p.loan:Math.min(bk.pay,p.loan);if(!v){toast('กดปุ่มเลือกจำนวนเงินที่ต้องการชำระ');return}if(v>p.cash){toast(`เงินสดไม่พอ (มี ${B(p.cash)})`);return}
    p.loan-=v;p.cash-=v;bk.pay=0;log(p.loan?`🏦 ${nm} ชำระหนี้ธนาคาร ${B(v)} · เหลือ ${B(p.loan)}`:`✅ ${nm} ปิดหนี้ธนาคาร ${B(v)} หมดแล้ว`);toast(p.loan?`ชำระ ${B(v)} แล้ว`:'ปิดหนี้ธนาคารแล้ว')}
  else if(kind==='dep'){v=bankAmt('bkDep');if(!v){toast('กรอกจำนวนเงินที่ต้องการฝาก');return}if(v>p.cash){toast(`เงินสดไม่พอ (มี ${B(p.cash)})`);return}
    p.dep+=v;p.cash-=v;log(`💰 ${nm} ฝากประจำ ${B(v)} · เงินฝากรวม ${B(p.dep)}`);toast(`ฝาก ${B(v)} แล้ว`)}
  else if(kind==='wd'||kind==='wdall'){if(!p.dep){toast('ไม่มีเงินฝาก');return}v=kind==='wdall'?p.dep:Math.min(bankAmt('bkWd'),p.dep);if(!v){toast('กรอกจำนวนเงินที่ต้องการถอน');return}
    p.dep-=v;p.cash+=v;log(`💰 ${nm} ถอนเงินฝาก ${B(v)} · เหลือ ${B(p.dep)}`);toast(`ถอน ${B(v)} แล้ว`)}
  render();save();checkWin();
}

const DECKS=['life','learn','opp','net'];
function cardCore(k,r){ // common fields: title, cost, passive, active
  const t=r.t||'',cost=k==='life'?Math.max(0,-(+r.cash||0)):(+r.cost||0),P=k==='opp'?(+r.cf||0):k==='net'?(+r.P||0):k==='life'?(+r.pas||0):0,A=k==='net'?(+r.A||0):k==='opp'||k==='life'?(+r.act||0):0;return {t,cost,P,A};
}
function cardFrom(k,c){const r=dbBlankFor(k);r.t=c.t;
  if(k==='life'){if(c.A||c.P){r.cash=-c.cost;r.act=c.A||0;r.pas=c.P||0;r.opt=1;r.nt=1}else r.cash=c.cost?-c.cost:0}
  else if(k==='learn'){r.cost=c.cost;Object.assign(r,learnNeedDef(r))}
  else if(k==='opp'){r.cost=c.cost;r.cf=c.P;r.act=c.A||0;r.ty=/คอนโด|บ้าน|อาคาร|หอพัก|ทาวน์|ที่ดิน/.test(c.t)?'re':/กองทุน|สินทรัพย์|หุ้น|ทอง/.test(c.t)?'fund':'biz';Object.assign(r,oppNeedDef(r))}
  else if(k==='net'){r.cost=c.cost;r.P=c.P;r.A=c.A;r.cat=c.P||c.A?'สร้างธุรกิจ':'ชีวิต';Object.assign(r,netNeedDef(r))}
  return r;
}
function optLabel(k,c,o){if(k==='life'&&c==='sp')return o==='jobless'?'ตกงาน (กติกาเดียวกับช่องตกงาน)':'ไม่มี';if(k==='learn'&&c==='ty'&&o==='know')return 'ได้ความรู้อย่างเดียว (ไม่ได้ทักษะ)';if(k==='skills'&&c==='kind')return o==='active'?'Active (สกิลการ์ด ใช้เอง)':'Passive (อัตโนมัติ)';if(k==='opp'&&c==='ty')return OPP_TY[o]||o;if(k==='learn'&&c==='ty')return o==='scam_course'?'คอร์สหลอกลวง':o==='mentor'?'ได้ทักษะสุ่ม':SKILLDB[o]?`${SKILLDB[o].n} (${o})`:o;if(k==='skills'&&c==='eff'){const f=EFFTXT[o];return f?f('x').replace('x','…'):o}return o||'(ส่วนตัว)'}
function dbBlankFor(k){const save=SET_TAB;SET_TAB=k;const r=dbBlank();SET_TAB=save;return r}
function dbMove(){
  const from=SET_TAB,to=$('#mvto').value,def=DBCOLS[from],cur={};
  def.cols.forEach(([c,,t])=>{const el=$('#setov .dbform [data-c="'+c+'"]');cur[c]=t==='n'?(+el.value||0):el.value.trim()});
  const moved=cardFrom(to,cardCore(from,cur));
  DB[from].splice(SET_EDIT,1);DB[to].push(moved);saveDB();
  if(S)log(`⚙ ย้ายการ์ด "${esc(moved.t)}" จาก${def.name}ไป${DBCOLS[to].name}`);
  SET_TAB=to;SET_EDIT=DB[to].length-1;SET_DEL=null;SET_Q='';toast(`ย้ายไป${DBCOLS[to].name}แล้ว ตรวจแก้แล้วกดบันทึก`);renderSettings();
}
function dbBlank(){const r={};if(SET_TAB==='life'){return {t:'',cash:0,cpct:0,spct:0,mexp:0,kid:0,h:0,tt:0,k:0,act:0,pas:0,opt:0,nt:0,nh:0,nk:0,sp:''}}if(SET_TAB==='opp'){return {t:'',ty:'biz',cost:0,cf:0,act:0,nt:2,nh:0,nk:0}}if(SET_TAB==='learn'){return {t:'',ty:Object.keys(SKILLDB)[0]||'scam_course',cost:0,nt:1,nh:0,nk:0,kg:2}}if(SET_TAB==='skills'){return {key:'skill'+(DB.skills.length+1),n:'',kind:'passive',eff:'rent',val:10,uses:1}}DBCOLS[SET_TAB].cols.forEach(([c,,t,o])=>r[c]=t==='n'?0:t==='o'?o[0]:'');if(SET_TAB==='net'){r.id='c-'+Date.now().toString().slice(-6);r.nt=1}if(SET_TAB==='jobs'){r.h=5;r.t=4;r.k=4}return r}

  const title=SET_TAB==='jobs'||SET_TAB==='skills'?r.n:r.t;if(!title){toast('กรุณาใส่ชื่อ');return}

  if(SET_TAB==='jobs')for(const s of ['h','t','k'])r[s]=Math.max(0,Math.min(10,r[s]));

function dbDel(i){
  if(SET_TAB==='jobs'&&DB.jobs.length<=1){toast('ต้องมีอาชีพอย่างน้อย 1 อาชีพ');return}

function dbReset(){DB[SET_TAB]=JSON.parse(JSON.stringify(DEFAULT_DB[SET_TAB]));saveDB();SET_DEL=null;toast('คืนค่าเริ่มต้นแล้ว');renderSettings()}
function csvLine(a){return a.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}
function csvParse(t){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))out.push(row);row=[]}else cur+=c}row.push(cur);if(row.some(x=>x!==''))out.push(row);return out}
function dbExport(){const def=DBCOLS[SET_TAB],rows=DB[SET_TAB];$('#dbcsv').value=[csvLine(def.cols.map(c=>c[1])),...rows.map(r=>csvLine(def.cols.map(([c])=>r[c])))].join('\n')}
function dbCopy(){dbExport();const t=$('#dbcsv').value;try{navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ ให้เลือกข้อความในช่องแล้วคัดลอกเอง'))}catch(e){toast('คัดลอกไม่ได้ ให้เลือกข้อความในช่องแล้วคัดลอกเอง')}}
function dbImport(){
  const def=DBCOLS[SET_TAB],data=csvParse($('#dbcsv').value.replace(/^\uFEFF/,''));if(data.length<2){toast('ไม่พบข้อมูล CSV');return}
  const head=data[0].map(x=>x.trim());
  // map header -> column; for the network deck also accept the original file's headers
  const alias={'ชื่อการ์ด (Title)':'t','เป้าหมาย (Target)':'leg','ราคา':'cost','หมวดหมู่':'cat','Active':'A','Passive':'P','PV':'pv','ID':'id'};
  const idx=def.cols.map(([c,l])=>{let i=head.indexOf(l);if(i<0&&SET_TAB==='net')i=head.findIndex(x=>alias[x]===c);return i});
  if(idx.every(i=>i<0)){toast('หัวคอลัมน์ไม่ตรงกับหมวดนี้');return}
  const rows=data.slice(1).map(a=>{const r={};def.cols.forEach(([c,,t,o],j)=>{let v=idx[j]>=0?(a[idx[j]]??'').trim():'';if(SET_TAB==='net'&&c==='leg')v=v.replace('สายงาน','').replace('ส่วนตัว','').trim();r[c]=t==='n'?(+String(v).replace(/,/g,'')||0):v});return r});
  let skip=0;const kept=SET_TAB==='net'?rows.filter(r=>{if(r.t==='เงินเดือน'||String(r.cat).startsWith('คุณสมบัติ')){skip++;return false}return true}):rows;
  if(SET_TAB==='jobs'&&!kept.length){toast('ไม่พบอาชีพในไฟล์');return}
  DB[SET_TAB]=kept;saveDB();renderSettings();toast(`นำเข้าและบันทึก ${kept.length} รายการ${skip?` (ข้ามการ์ดเงินเดือนและการ์ดคุณสมบัติ ${skip} ใบ)`:''}`);
}

async function beFirebase(){
  const B=`https://www.gstatic.com/firebasejs/${FBV}/`;
  const [A,AU,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-database.js')]);
  const app=A.initializeApp(FB_CONFIG),auth=AU.getAuth(app),db=D.getDatabase(app),r=p=>D.ref(db,p);
  const U=u=>u&&{uid:u.uid,name:u.displayName||(u.email||'').split('@')[0]||'',anon:u.isAnonymous,email:u.email||''};
  return {
    onAuth:cb=>AU.onAuthStateChanged(auth,u=>cb(U(u))),
    google:()=>AU.signInWithPopup(auth,new AU.GoogleAuthProvider()),
    facebook:()=>AU.signInWithPopup(auth,new AU.FacebookAuthProvider()),
    email:async(e,p,reg,name)=>{const c=reg?await AU.createUserWithEmailAndPassword(auth,e,p):await AU.signInWithEmailAndPassword(auth,e,p);if(reg&&name)await AU.updateProfile(c.user,{displayName:name})},
    reset:e=>AU.sendPasswordResetEmail(auth,e),
    guest:()=>AU.signInAnonymously(auth),
    link:()=>AU.linkWithPopup(auth.currentUser,new AU.GoogleAuthProvider()),
    out:()=>AU.signOut(auth),
    get:async p=>(await D.get(r(p))).val(),
    set:(p,v)=>D.set(r(p),v),update:(p,v)=>D.update(r(p),v),remove:p=>D.remove(r(p)),
    on:(p,cb)=>D.onValue(r(p),s=>cb(s.val())),
    tx:async(p,f)=>{try{const x=await D.runTransaction(r(p),f);return {ok:x.committed,val:x.snapshot.val()}}catch(e){return {ok:false,err:e}}},
    onDisc:(p,v)=>v==null?D.onDisconnect(r(p)).remove():D.onDisconnect(r(p)).set(v),
    conn:cb=>D.onValue(r('.info/connected'),x=>cb(!!x.val())),
    now:()=>D.serverTimestamp()
  }}
/* ---------- backend จำลอง (?mock=1) ใช้ทดสอบหลายแท็บในเครื่องเดียว ---------- */
function beMock(){
  const K='fgmock-db',L=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}};
  const seg=p=>p.split('/').filter(Boolean),getP=(d,p)=>seg(p).reduce((o,k)=>o==null?null:(o[k]??null),d);
  const setP=(d,p,v)=>{const s=seg(p);let o=d;for(let i=0;i<s.length-1;i++){if(o[s[i]]==null||typeof o[s[i]]!=='object')o[s[i]]={};o=o[s[i]]}if(v==null)delete o[s[s.length-1]];else o[s[s.length-1]]=JSON.parse(JSON.stringify(v))};
  const subs=new Set(),fire=()=>{const d=L();subs.forEach(s=>{const v=JSON.stringify(getP(d,s.p));if(v!==s.last){s.last=v;s.cb(JSON.parse(v))}})};
  const W=f=>{const d=L();f(d);localStorage.setItem(K,JSON.stringify(d));setTimeout(fire)};
  addEventListener('storage',e=>{if(e.key===K)fire()});
  let user=JSON.parse(sessionStorage.getItem('fgmock-user')||'null'),acb=null;const disc=[];
  addEventListener('pagehide',()=>disc.forEach(([p,v])=>W(d=>setP(d,p,v))));
  const login=(n,anon)=>{user={uid:'u'+Math.random().toString(36).slice(2,8),name:n,anon:!!anon};sessionStorage.setItem('fgmock-user',JSON.stringify(user));acb&&acb(user)};
  return {
    onAuth:cb=>{acb=cb;setTimeout(()=>cb(user))},
    google:async()=>login('ทดสอบ '+Math.floor(Math.random()*90+10)),facebook:async()=>login('เฟซ '+Math.floor(Math.random()*90+10)),
    email:async(e,p,reg,name)=>login(name||e.split('@')[0]),reset:async()=>{},guest:async()=>login('',true),link:async()=>{user.anon=false},
    out:async()=>{user=null;sessionStorage.removeItem('fgmock-user');acb&&acb(null)},
    get:async p=>getP(L(),p),set:async(p,v)=>W(d=>setP(d,p,v)),remove:async p=>W(d=>setP(d,p,null)),
    update:async(p,v)=>W(d=>{for(const k in v)setP(d,p+'/'+k,v[k])}),
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.add(s);setTimeout(fire);return ()=>subs.delete(s)},
    tx:async(p,f)=>{let ok=false,val;W(d=>{const cur=getP(d,p);let nv=f(null);if(nv===undefined&&cur==null)return;if(cur!=null)nv=f(JSON.parse(JSON.stringify(cur)));if(nv!==undefined){setP(d,p,nv);ok=true}val=getP(d,p)});return {ok,val}},
    onDisc:(p,v)=>disc.push([p,v]),now:()=>Date.now(),conn:cb=>{setTimeout(()=>cb(true));return ()=>{}}
  }}

/* ---------- บีบอัดสถานะเกม ---------- */
async function zEnc(str){if(typeof CompressionStream==='undefined')return 'J'+str;
  const b=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'Z'+btoa(s)}
async function zDec(z){if(z[0]==='J')return z.slice(1);const bin=atob(z.slice(1)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}

async function onJoin(code){

  let got=-1;
  for(let i=1;i<(r.n||6)&&got<0;i++){/* Firebase เรียกฟังก์ชันครั้งแรกด้วยค่าแคช (มักเป็น null) ต้องคืนค่าเพื่อให้มันไปอ่านค่าจริงจากเซิร์ฟเวอร์แล้วเรียกซ้ำ ห้ามยกเลิกตอนเป็น null */

    v3Center(bd,w,c,p)}
  w.classList.toggle('fastcam',!!p.bot&&S.phase==='busy');w.classList.toggle('cardtime',S.phase==='card'&&!p.bot)}
function v3Sync(){const b=$('#btnV3');if(b)b.textContent=V3.on?'🧭 มุมมอง 3D':'🗺 มุมมอง 2D';const bd=$('#board'),w=$('#bwrap');if(!V3.on&&bd){bd.classList.remove('v3d','iso');bd.style.removeProperty('--tilt');w.style.perspective='';w.classList.remove('v3d','cardtime');bd.style.removeProperty('--ang')}}
function toggleV3(){V3.on=!V3.on;if(!V3.on){const h=$('#hud');h.hidden=true;h.innerHTML=''}try{localStorage.setItem('ff-3d',V3.on?'1':'0')}catch(e){}V3.side=-1;BZ.s=1;BZ.x=0;BZ.y=0;$('#board').style.transform='';v3Sync();render()}
v3Sync();

/* ลากเลื่อนกระดาน 3D ด้วยนิ้ว/เมาส์ */
(function(){const w=$('#bwrap');if(!w)return;let d=null;
  w.addEventListener('pointerdown',e=>{if(!w.classList.contains('v3d')||w.classList.contains('cardtime')||e.target.closest('.hud'))return;d={x:e.clientX,y:e.clientY,ux:V3.ux||0,uy:V3.uy||0,id:e.pointerId,mv:false}});
  w.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.mv&&Math.hypot(dx,dy)<8)return;d.mv=true;BZ.moved=true;
    const W=w.clientWidth;V3.ux=Math.max(-W*1.2,Math.min(W*1.2,d.ux+dx));V3.uy=Math.max(-W*.9,Math.min(W*.9,d.uy+dy));w.style.setProperty('--ux',V3.ux+'px');w.style.setProperty('--uy',V3.uy+'px');w.classList.add('dragging');e.preventDefault()},{passive:false});
  const end=e=>{if(d&&e.pointerId===d.id){d=null;w.classList.remove('dragging')}};w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('dblclick',()=>{if(!w.classList.contains('v3d'))return;V3.ux=0;V3.uy=0;w.style.setProperty('--ux','0px');w.style.setProperty('--uy','0px')});
})();

/* ===== เดินแบบลื่น 60fps (3D) ===== */
const STEP_MS=640;let WALK=null;
function walkOn(p){return V3.on&&!MAPMIN&&!RM&&!p.bot&&!(S&&S.autoPilot)}
function walkGeom(p){const bd=$('#board'),c=bd&&bd.querySelector(`.cell[data-k="${p.ring+p.pos}"]`);if(!c)return null;const m=Math.min(c.offsetWidth,c.offsetHeight)*(V3.fs||1),w=m*.92,h=m*2.15;
  return{x:c.offsetLeft+c.offsetWidth/2-w/2,y:c.offsetTop+c.offsetHeight*.82-h,w,h}}
function walkStart(p){if(!walkOn(p))return;const bd=$('#board');let el=bd.querySelector(':scope>.walker');if(!el){el=document.createElement('div');el.className='walker';bd.appendChild(el)}
  const i=jobIdx(p);el.style.setProperty('--pawn',`url(img/pawn-${i}.webp)`);el.style.setProperty('--pc',p.color);
  const g=walkGeom(p);if(!g)return;el.style.transition='none';Object.assign(el.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});el.offsetWidth;el.style.transition='';
  WALK={id:p.id};$('#bwrap').classList.add('walking');$('#bwrap').style.setProperty('--stepms',STEP_MS+'ms')}
function walkTo(p){if(!WALK||WALK.id!==p.id)return;const el=$('#board').querySelector(':scope>.walker');const g=walkGeom(p);if(!el||!g)return;
  Object.assign(el.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});el.classList.remove('bob');el.offsetWidth;el.classList.add('bob')}
async function walkEnd(p){if(!WALK)return;await sleep(STEP_MS*.6);WALK=null;const w=$('#bwrap');w.classList.remove('walking');const el=$('#board').querySelector(':scope>.walker');if(el)el.remove()}

/* จัดช่องของผู้เล่นให้อยู่กลางพื้นที่แผนที่ (วัดจริงหลังแปลงมุมมอง) */
function v3Center(bd,w,c,p){
  /* คำนวณตำแหน่งจากสมการภาพฉาย (ไม่วัดจากจอระหว่างแอนิเมชัน) */
  const W=w.clientWidth,H=w.clientHeight,BW=bd.offsetWidth,BH=bd.offsetHeight;if(!W||!BW)return;
  const hud=$('#hud'),hb=hud&&!hud.hidden?hud.getBoundingClientRect():null,wb=w.getBoundingClientRect();
  const top=hb?Math.max(0,hb.bottom-wb.top):0,X0=W/2,Y0=top+(H-top)*.62;
  const per=parseFloat(getComputedStyle(w).perspective)||800,tilt=(parseFloat(getComputedStyle(bd).getPropertyValue('--tilt'))||52)*Math.PI/180,a=V3.ang*Math.PI/180;
  const x=c.offsetLeft+c.offsetWidth/2-BW/2,y=c.offsetTop+c.offsetHeight/2-BH/2;const po=getComputedStyle(w).perspectiveOrigin.split(' ').map(parseFloat),OX=po[0],OY=po[1];
  const xr=x*Math.cos(a)-y*Math.sin(a),yr=x*Math.sin(a)+y*Math.cos(a);
  const y2=yr*Math.cos(tilt),z=yr*Math.sin(tilt),k=(per-z)/per;
  let tx=OX+(X0-OX)*k-xr-W/2,ty=OY+(Y0-OY)*k-y2-H/2;
  const lim=W*3;tx=Math.max(-lim,Math.min(lim,tx));ty=Math.max(-lim,Math.min(lim,ty));
  /* ขนาดตัวละคร: ตัวผู้เล่นปัจจุบัน (สูง 2.15 เท่าช่อง × กำลังขยายตามระยะ) ต้องไม่สูงเกิน 88% ของพื้นที่จากเท้าถึงขอบ HUD */
  {const cm=Math.min(c.offsetWidth,c.offsetHeight),mag=1/Math.max(.2,k),fig=2.15*cm*mag,av=(Y0-top)*.88;const f=Math.max(.45,Math.min(1,av/Math.max(1,fig)))*(bd.classList.contains('iso')?.62:1);V3.fs=f;w.style.setProperty('--fs',f.toFixed(3))}
  bd.style.setProperty('--tx',tx+'px');w.style.setProperty('--typx',ty+'px');V3.tx=tx;V3.ty=ty}

/* แผงข้อมูลตอนเลือกกองการ์ด: ตัวละครเต็มตัว + การเงิน + ค่าพลัง */
function cardInfo(p){const f=fin(p),i=jobIdx(p),pose=f.flow<0?'think':p.st.t<=2?'sad':'thumb';
  const st=k=>`<div class="ci-st"><span>${ii(STI[k])}</span><b>${p.st[k]}</b><small>/10</small><i style="--v:${p.st[k]*10}%;--c:${{h:'#e0607e',t:'#e0a030',k:'#4a8fd8'}[k]}"></i></div>`;
  const pct=f.expenses?Math.min(100,Math.round(f.passive/f.expenses*100)):0;
  return `<div class="cinfo">${i>=0?`<img class="ci-fig" src="img/c${i}-${pose}.webp" alt="">`:''}<div class="ci-body">
   <div class="ci-row"><div class="ci-k"><span>เงินสด</span><b class="num">${B(p.cash)}</b></div><div class="ci-k"><span>คงเหลือ/เดือน</span><b class="num ${f.flow>=0?'pos':'neg'}">${f.flow>=0?'+':''}${B(f.flow)}</b></div>${p.loan?`<div class="ci-k"><span>หนี้ธนาคาร</span><b class="num neg">${B(p.loan)}</b></div>`:''}</div>
   <div class="ci-goal"><span>Passive <b class="pos">${B(f.passive)}</b> / รายจ่าย <b class="neg">${B(f.expenses)}</b></span><i style="--v:${pct}%"></i></div>
   <div class="ci-sts">${st('h')}${st('t')}${st('k')}</div></div></div>`}
</script>
</body>
</html>
